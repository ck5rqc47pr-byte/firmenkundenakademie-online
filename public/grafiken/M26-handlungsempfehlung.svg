<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="560" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">HANDLUNGSEMPFEHLUNG · MODUL 26 · ESG IM KREDITGESCHÄFT</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <text x="40" y="60" class="mono" font-size="9" fill="#7A8099" letter-spacing="1">VOM ESG-SIGNAL ZUR KREDITENTSCHEIDUNG · WENN-DANN-LOGIK</text>

  <!-- Spalten-Header -->
  <text x="76" y="84" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="1">WENN · ESG-SIGNAL / BEFUND</text>
  <text x="460" y="84" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="1">DANN · BERATUNGSIMPULS &amp; KREDITAKTE</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- ROW 1: Energiekosten + Gebäude → KfW-Effizienzfinanzierung -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="94" width="780" height="110" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="40" y="94" width="6" height="110" fill="#f59e0b"/>

  <text x="70" y="118" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="0.5">WENN</text>
  <text x="70" y="139" class="serif" font-size="14" fill="#1F2C56">Energiekostenanteil &gt; 8 % vom Umsatz</text>
  <text x="70" y="159" class="serif" font-size="13" fill="#3D4460">und Betriebsgebäude Baujahr vor 1995</text>
  <text x="70" y="178" class="serif" font-size="13" fill="#3D4460">ohne energetische Sanierung</text>

  <!-- Pfeiltrennlinie -->
  <line x1="430" y1="100" x2="430" y2="198" stroke="#F1F1F4" stroke-width="1"/>
  <polygon points="430,152 430,168 446,160" fill="#D9C089"/>

  <text x="460" y="118" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="0.5">DANN</text>
  <text x="460" y="139" class="serif" font-size="14" fill="#1F2C56">Effizienzinvestition mit KfW-Förderung prüfen</text>
  <text x="460" y="159" class="serif" font-size="13" fill="#3D4460">Zehn-Jahres-Einsparrechnung gemeinsam</text>
  <text x="460" y="178" class="serif" font-size="13" fill="#3D4460">mit dem Kunden aufstellen (Hausbankprinzip)</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- ROW 2: Abnehmerkonzentration + ESG-Beschaffung → DSCR-Szenario -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="214" width="780" height="110" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="40" y="214" width="6" height="110" fill="#f59e0b"/>

  <text x="70" y="238" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="0.5">WENN</text>
  <text x="70" y="259" class="serif" font-size="14" fill="#1F2C56">Umsatzanteil emissionsintensiver Abnehmer &gt; 40 %</text>
  <text x="70" y="279" class="serif" font-size="13" fill="#3D4460">und dieser Abnehmer hat ESG-Beschaffungsrichtlinien</text>
  <text x="70" y="298" class="serif" font-size="13" fill="#3D4460">kommuniziert</text>

  <line x1="430" y1="220" x2="430" y2="318" stroke="#F1F1F4" stroke-width="1"/>
  <polygon points="430,272 430,288 446,280" fill="#D9C089"/>

  <text x="460" y="238" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="0.5">DANN</text>
  <text x="460" y="259" class="serif" font-size="14" fill="#1F2C56">DSCR-Szenario ohne diesen Abnehmer rechnen</text>
  <text x="460" y="279" class="serif" font-size="13" fill="#3D4460">Zehn-Jahres-Kapitaldienstfähigkeit durchrechnen;</text>
  <text x="460" y="298" class="serif" font-size="13" fill="#3D4460">Ergebnis in Kreditakte aufnehmen (ESG-Feld)</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- ROW 3: Euro-5-Anteil > 50 % + Mautankündigung → Teilumbau -->
  <!-- (rote Ampel — kritischer Befund) -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="334" width="780" height="130" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="40" y="334" width="6" height="130" fill="#ef4444"/>

  <text x="70" y="358" class="mono" font-size="8" fill="#ef4444" letter-spacing="0.5">WENN · ERHÖHTES RISIKO</text>
  <text x="70" y="379" class="serif" font-size="14" fill="#1F2C56">Euro-5-Anteil im Fuhrpark &gt; 50 %</text>
  <text x="70" y="399" class="serif" font-size="13" fill="#3D4460">und regulatorische Mautdifferenzierung</text>
  <text x="70" y="418" class="serif" font-size="13" fill="#3D4460">für 2027 bereits angekündigt</text>
  <text x="70" y="437" class="mono" font-size="7" fill="#B0B3C0" letter-spacing="0.5">(Fall Kramer &amp; Sohn: 61 % Euro 5, 11 Fahrzeuge)</text>
  <text x="70" y="455" class="mono" font-size="7" fill="#B0B3C0" letter-spacing="0.5">ESG-Kurzcheck Zone: erhöht (&gt; 6 Signale)</text>

  <line x1="430" y1="340" x2="430" y2="458" stroke="#F1F1F4" stroke-width="1"/>
  <polygon points="430,392 430,408 446,400" fill="#D9C089"/>

  <text x="460" y="358" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="0.5">DANN</text>
  <text x="460" y="379" class="serif" font-size="14" fill="#1F2C56">Teilflottenumstellung (älteste Fahrzeuge zuerst)</text>
  <text x="460" y="399" class="serif" font-size="13" fill="#3D4460">KfW-Finanzierung über Hausbankprinzip prüfen;</text>
  <text x="460" y="418" class="serif" font-size="13" fill="#3D4460">DSCR-Szenario B und C gegenüberstellen;</text>
  <text x="460" y="437" class="serif" font-size="13" fill="#3D4460">ESG-Feld + Anlage zur Kreditvorlage</text>
  <text x="460" y="455" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">(Szenario B: DSCR 1,38 &gt; Mindestpuffer 1,20 ✓)</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- GREENWASHING-PRÜFFRAGE -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="478" width="780" height="32" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="40" y="478" width="6" height="32" fill="#8898C4"/>
  <text x="60" y="490" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">GREENWASHING-PRÜFFRAGE</text>
  <text x="60" y="504" class="serif" font-size="12" fill="#3D4460">Würde ich diese Finanzierung auch ohne Förderrahmen empfehlen, weil sie wirtschaftlich sinnvoll ist? Wenn ja — dann ist es Beratung.</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- BASELINE & QUELLE -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <line x1="40" y1="520" x2="820" y2="520" stroke="#15192B" stroke-width="1"/>
  <text x="40" y="534" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Handlungsempfehlung · ESG-Kurzcheck nach EFRAG VSME (2024) · TCFD (2017) · BaFin MaRisk 9. Novelle (2026) · Fallzahlen fiktiv</text>

</svg>
