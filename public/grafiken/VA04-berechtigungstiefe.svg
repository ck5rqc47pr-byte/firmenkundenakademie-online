<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">DATENQUALITÄT · BERECHTIGUNGSTIEFE · MODUL VA04 · WIEDERVORLAGE, FRISTEN UND DATENQUALITÄT</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Datenqualität: Was darf ich selbst ändern?</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Drei Stufen der Berechtigungstiefe in der Vertriebsassistenz</text>

  <!-- ══════════════════════════════════════════════
       STUFE 1: Typisch erlaubt — Grün-Ton (y=104–222)
       ══════════════════════════════════════════════ -->

  <!-- Stufen-Label links -->
  <rect x="40" y="104" width="120" height="118" fill="#1A3A2A"/>
  <!-- Stufennummer + Text vertikal zentriert -->
  <text x="100" y="155" class="mono" font-size="28" fill="#4CAF82" text-anchor="middle" opacity="0.35">1</text>
  <text x="100" y="175" class="mono" font-size="7" fill="rgba(248,248,250,0.75)" letter-spacing="1" text-anchor="middle">ERLAUBT</text>
  <text x="100" y="188" class="mono" font-size="7" fill="rgba(248,248,250,0.50)" letter-spacing="0.5" text-anchor="middle">oft ohne Freigabe</text>

  <!-- Hauptkachel -->
  <rect x="164" y="104" width="656" height="118" fill="#E8F5EE" stroke="#4CAF82" stroke-width="1.5"/>
  <rect x="164" y="104" width="4"   height="118" fill="#4CAF82"/>
  <text x="180" y="124" class="mono" font-size="9" fill="#1A3A2A" letter-spacing="2">TYPISCH ERLAUBT — MEIST OHNE FREIGABE ÄNDERBAR</text>
  <line x1="180" y1="131" x2="804" y2="131" stroke="#4CAF82" stroke-width="0.5" opacity="0.5"/>

  <!-- Zwei Spalten mit Einträgen -->
  <text x="180" y="148" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Postanschrift / Adresse</text>
  <text x="180" y="163" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Ansprechpartner und Kontaktpersonen</text>
  <text x="180" y="178" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Telefonnummern / E-Mail-Adressen</text>
  <text x="180" y="193" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Interne Vermerke und Gesprächsnotizen</text>

  <text x="490" y="148" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Dokumentenablage (neue Anhänge)</text>
  <text x="490" y="163" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Wiedervorlage-Datum im System setzen</text>
  <text x="490" y="178" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Kommunikationshistorie ergänzen</text>
  <text x="490" y="193" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Aktivitäts-Status aktualisieren</text>

  <text x="180" y="212" class="mono" font-size="8" fill="#2D7A50" letter-spacing="0.5">Keine Auswirkung auf Risikoparameter oder Kreditentscheidungen.</text>

  <!-- ══════════════════════════════════════════════
       STUFE 2: Typisch gesperrt — Warnung (y=232–330)
       ══════════════════════════════════════════════ -->

  <!-- Stufen-Label links -->
  <rect x="40" y="232" width="120" height="98" fill="#7A1C1C"/>
  <text x="100" y="274" class="mono" font-size="28" fill="#D9C089" text-anchor="middle" opacity="0.35">2</text>
  <text x="100" y="295" class="mono" font-size="7" fill="rgba(248,248,250,0.75)" letter-spacing="1" text-anchor="middle">GESPERRT</text>
  <text x="100" y="308" class="mono" font-size="7" fill="rgba(248,248,250,0.50)" letter-spacing="0.5" text-anchor="middle">Freigabe nötig</text>

  <!-- Hauptkachel -->
  <rect x="164" y="232" width="656" height="98" fill="#1F2C56"/>
  <rect x="164" y="232" width="656" height="98" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <rect x="164" y="232" width="4"   height="98" fill="#D9C089"/>
  <text x="180" y="252" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">TYPISCH GESPERRT — IMMER FREIGABE ERFORDERLICH</text>
  <line x1="180" y1="259" x2="804" y2="259" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>

  <text x="180" y="276" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Rating-Merkmale und Bonitätsklasse</text>
  <text x="180" y="290" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Risikoklasse / Engagementeinstufung</text>
  <text x="180" y="304" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Kreditnehmereinheit (KNE-Zuordnung)</text>

  <text x="490" y="276" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Grundpfandrechtswerte / Beleihungswert</text>
  <text x="490" y="290" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Sicherheitenbewertungen</text>
  <text x="490" y="304" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Kreditentscheidungsparameter</text>

  <text x="180" y="320" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">Falsche Werte hier = fehlerhafte Risikosteuerung + Prüfungsmangel.</text>

  <!-- ══════════════════════════════════════════════
       STUFE 3: Immer klären — Neutral (y=340–400)
       ══════════════════════════════════════════════ -->

  <!-- Stufen-Label links -->
  <rect x="40" y="340" width="120" height="56" fill="#3D5494"/>
  <text x="100" y="368" class="mono" font-size="7" fill="rgba(248,248,250,0.75)" letter-spacing="1" text-anchor="middle">IMMER</text>
  <text x="100" y="381" class="mono" font-size="7" fill="rgba(248,248,250,0.50)" letter-spacing="0.5" text-anchor="middle">KLÄREN</text>

  <!-- Hauptkachel -->
  <rect x="164" y="340" width="656" height="56" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="164" y="340" width="4"   height="56" fill="#3D5494"/>
  <text x="180" y="358" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">ALLES, WAS MIT KREDITENTSCHEIDUNGEN VERKNÜPFT IST</text>
  <text x="180" y="374" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Wenn unklar: vor jeder Änderung Rückfrage beim Berater oder Teamleiter.</text>
  <text x="180" y="386" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.5">Berechtigungstiefe ist hausindividuell unterschiedlich — im eigenen agree-System klären.</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=406–462)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="406" width="780" height="54" fill="#EAD9A8"/>
  <rect x="40" y="406" width="780" height="54" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="406" width="4"   height="54" fill="#D9C089"/>
  <text x="58" y="425" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">AUS SCHLECHTEN DATEN ENTSTEHEN SCHLECHTE ENTSCHEIDUNGEN.</text>
  <text x="58" y="441" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Datenqualität ist keine Verwaltungsaufgabe — sie ist die Grundlage jeder Kreditentscheidung und jeder Prüfung.</text>
  <text x="58" y="453" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Im Zweifel: Berechtigungstiefe im eigenen Haus klären, bevor Stammdaten verändert werden.</text>

  <!-- Baseline -->
  <line x1="40" y1="472" x2="820" y2="472" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="488" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Datenqualität · Berechtigungstiefe · Modul VA04</text>
  <text x="820" y="488" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">MaRisk BT 2.1 · agree21 Nutzerdokumentation (Atruvia AG, 2023)</text>
</svg>
