<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">KOMMUNIKATION · SCHULZ VON THUN (1981) · MODUL VA07 · DIE SCHNITTSTELLE BERATER–ASSISTENZ AKTIV GESTALTEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Wenn mehrere gleichzeitig „dringend" sagen</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Ein 3-Schritt-Handlungsweg für kollidierende Anfragen</text>

  <!-- ══════════════════════════════════════════════
       SITUATION: Auslöser-Box  (y=104–152)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="104" width="780" height="42" fill="#1F2C56"/>
  <rect x="40" y="104" width="4"   height="42" fill="#D9C089"/>
  <text x="58" y="122" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" font-weight="500">SITUATION</text>
  <text x="58" y="138" class="mono" font-size="8.5" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">Berater A sagt „sofort!" · Berater B sagt „sofort!" · Kunde wartet auf Rückmeldung – alles gleichzeitig.</text>
  <text x="730" y="138" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3">Ein „sofort!" hat vier Seiten.</text>

  <!-- Pfeil nach unten zu Schritt 1 -->
  <line x1="430" y1="146" x2="430" y2="166" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="430,166 424,156 436,156" fill="#C8CAD4"/>

  <!-- ══════════════════════════════════════════════
       3-SCHRITT-ABLAUF (y=172–316)
       Drei Kacheln nebeneinander: je ~246 breit
       ══════════════════════════════════════════════ -->

  <!-- SCHRITT 1: Priorisieren -->
  <rect x="40" y="172" width="240" height="138" fill="#1F2C56"/>
  <text x="160" y="196" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" text-anchor="middle">01 · PRIORISIEREN</text>
  <line x1="60" y1="203" x2="264" y2="203" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="160" y="221" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3" text-anchor="middle">Nach vereinbarter Regel</text>
  <text x="160" y="235" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3" text-anchor="middle">entscheiden – nicht nach</text>
  <text x="160" y="249" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3" text-anchor="middle">Lautstärke oder Nähe</text>
  <line x1="60" y1="263" x2="264" y2="263" stroke="#D9C089" stroke-width="0.5" opacity="0.25"/>
  <text x="160" y="278" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3" text-anchor="middle">Regulatorische Frist</text>
  <text x="160" y="291" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3" text-anchor="middle">schlägt subjektiven Druck</text>
  <text x="160" y="304" class="mono" font-size="7" fill="#D9C089" letter-spacing="1" text-anchor="middle">Sachebene</text>

  <!-- Pfeil Schritt 1 zu Schritt 2 -->
  <line x1="280" y1="241" x2="308" y2="241" stroke="#C8CAD4" stroke-width="2"/>
  <polygon points="308,241 296,235 296,247" fill="#C8CAD4"/>

  <!-- SCHRITT 2: Zurückmelden -->
  <rect x="310" y="172" width="240" height="138" fill="#3D5494"/>
  <text x="430" y="196" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" text-anchor="middle">02 · ZURÜCKMELDEN</text>
  <line x1="330" y1="203" x2="534" y2="203" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="430" y="221" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3" text-anchor="middle">Transparent mitteilen,</text>
  <text x="430" y="235" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3" text-anchor="middle">was wann kommt – statt</text>
  <text x="430" y="249" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3" text-anchor="middle">stillem Abarbeiten</text>
  <line x1="330" y1="263" x2="534" y2="263" stroke="#D9C089" stroke-width="0.5" opacity="0.25"/>
  <text x="430" y="278" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3" text-anchor="middle">„Ich erledige A bis 12 Uhr,</text>
  <text x="430" y="291" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3" text-anchor="middle">B folgt bis 14 Uhr."</text>
  <text x="430" y="304" class="mono" font-size="7" fill="#D9C089" letter-spacing="1" text-anchor="middle">Beziehungsebene</text>

  <!-- Pfeil Schritt 2 zu Schritt 3 -->
  <line x1="550" y1="241" x2="578" y2="241" stroke="#C8CAD4" stroke-width="2"/>
  <polygon points="578,241 566,235 566,247" fill="#C8CAD4"/>

  <!-- SCHRITT 3: Ansprechen / Aushandeln (GOLD) -->
  <rect x="580" y="172" width="240" height="138" fill="#D9C089"/>
  <rect x="580" y="172" width="240" height="138" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <text x="700" y="196" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2" text-anchor="middle">03 · AUSHANDELN</text>
  <line x1="600" y1="203" x2="804" y2="203" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="700" y="221" class="mono" font-size="8" fill="#15192B" letter-spacing="0.3" text-anchor="middle">Bei echtem Konflikt die</text>
  <text x="700" y="235" class="mono" font-size="8" fill="#15192B" letter-spacing="0.3" text-anchor="middle">Priorisierungsregel</text>
  <text x="700" y="249" class="mono" font-size="8" fill="#15192B" letter-spacing="0.3" text-anchor="middle">gemeinsam klären</text>
  <line x1="600" y1="263" x2="804" y2="263" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="700" y="278" class="mono" font-size="7.5" fill="#3D5494" letter-spacing="0.3" text-anchor="middle">Gespräch mit Teamleitung</text>
  <text x="700" y="291" class="mono" font-size="7.5" fill="#3D5494" letter-spacing="0.3" text-anchor="middle">oder Berater gemeinsam</text>
  <text x="700" y="304" class="mono" font-size="7" fill="#1F2C56" letter-spacing="1" text-anchor="middle">Appellebene</text>

  <!-- ══════════════════════════════════════════════
       VIER-SEITEN-HINWEIS (Schulz von Thun)
       schmale Box unter Schritt 2, y=320–338
       ══════════════════════════════════════════════ -->
  <rect x="310" y="322" width="240" height="24" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="430" y="338" class="mono" font-size="7" fill="#3D5494" letter-spacing="1" text-anchor="middle">Sach · Beziehung · Selbstoffenbarung · Appell</text>

  <!-- ══════════════════════════════════════════════
       ÜBERGABE-GRUNDREGELN (y=360–416)
       ══════════════════════════════════════════════ -->
  <text x="40" y="356" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">ÜBERGABE-GRUNDREGELN</text>
  <line x1="40" y1="362" x2="820" y2="362" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Regel 1 -->
  <rect x="40" y="370" width="378" height="40" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="370" width="4"   height="40" fill="#1F2C56"/>
  <text x="56" y="386" class="mono" font-size="8.5" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Auftrag immer ins System –</text>
  <text x="56" y="402" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.3">nicht per Zuruf. Kein System-Eintrag = kein Auftrag.</text>

  <!-- Regel 2 -->
  <rect x="442" y="370" width="378" height="40" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="442" y="370" width="4"   height="40" fill="#3D5494"/>
  <text x="458" y="386" class="mono" font-size="8.5" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Verständnis kurz rückbestätigen –</text>
  <text x="458" y="402" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.3">Missverständnisse entstehen im Übergabemoment.</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=422–476)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="422" width="780" height="50" fill="#EAD9A8"/>
  <rect x="40" y="422" width="780" height="50" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="422" width="4"   height="50" fill="#D9C089"/>
  <text x="58" y="441" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">GRUNDREGEL: Nicht jeder Konflikt hat dieselbe Ursache.</text>
  <text x="58" y="456" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Zuständigkeit unklar, Information fehlend oder Priorität strittig – die Lösung muss zur Ursache passen.</text>
  <text x="58" y="466" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.3">Schritt 1 löst Sachkonflikte · Schritt 2 löst Beziehungskonflikte · Schritt 3 löst Regelkonflikte</text>

  <!-- Baseline -->
  <line x1="40" y1="484" x2="820" y2="484" stroke="#15192B" stroke-width="1"/>

  <!-- Quelle -->
  <text x="40" y="500" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Schulz von Thun (1981) · Modul VA07</text>
  <text x="820" y="500" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Schulz von Thun, F. (2011). Miteinander reden 1 (48. Aufl.). Rowohlt.</text>
</svg>
