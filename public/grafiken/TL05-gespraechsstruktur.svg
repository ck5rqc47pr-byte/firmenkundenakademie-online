<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="660" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="28" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">STEUERUNGSGESPRÄCH · MODUL TL05 · ZIELGESPRÄCH</text>
  <line x1="40" y1="38" x2="820" y2="38" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="430" y="66" class="serif" font-size="18" font-weight="500" fill="#1F2C56" text-anchor="middle">Fünf Schritte des wirksamen Steuerungsgesprächs</text>
  <text x="430" y="83" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle">VOM KENNZAHL-ANLASS ZUM ENTWICKLUNGSORIENTIERTEN ZIEL – IN FÜNF SCHRITTEN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- KLAMMER-BOGEN OBEN: „steuern UND entwickeln"          -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <path d="M 60 112 Q 430 96 800 112" fill="none" stroke="#D9C089" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="430" y="108" class="mono" font-size="8" fill="#D9C089" letter-spacing="1.5" text-anchor="middle">STEUERN UND ENTWICKELN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PFEIL-VERBINDUNGEN ZWISCHEN SCHRITTEN                  -->
  <!-- Schritt-Breite: 140px, Abstand: 10px, Pfeil: 18px     -->
  <!-- Positionen x-Start: 60, 218, 376, 534, 692            -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Pfeil 1→2 -->
  <polygon points="210,260 218,252 218,268" fill="#C8CAD4"/>
  <!-- Pfeil 2→3 -->
  <polygon points="368,260 376,252 376,268" fill="#C8CAD4"/>
  <!-- Pfeil 3→4 -->
  <polygon points="526,260 534,252 534,268" fill="#C8CAD4"/>
  <!-- Pfeil 4→5 (Gold, da Zielzustand erreicht) -->
  <polygon points="684,260 692,252 692,268" fill="#D9C089"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCHRITT 1: VORBEREITUNG                                 -->
  <!-- x=60, w=148                                             -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="60" y="122" width="148" height="284" fill="#EDEDF3"/>
  <!-- Akzentbalken oben -->
  <rect x="60" y="122" width="148" height="4" fill="#3D5494"/>

  <!-- Nummer -->
  <text x="134" y="162" class="serif" font-size="44" fill="#8898C4" text-anchor="middle" font-style="italic" opacity="0.5">1</text>

  <!-- Schritt-Label -->
  <text x="134" y="182" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">SCHRITT</text>
  <!-- Titel -->
  <text x="134" y="200" class="serif" font-size="14" font-weight="500" fill="#1F2C56" text-anchor="middle">Vorbereitung</text>
  <line x1="80" y1="208" x2="188" y2="208" stroke="#C8CAD4" stroke-width="0.5"/>

  <!-- Inhalte -->
  <text x="134" y="226" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Cockpit-Hypothese</text>
  <text x="134" y="240" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">min. 2 Alternativen</text>
  <text x="134" y="256" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">formulieren</text>

  <text x="134" y="278" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Gesprächsziel</text>
  <text x="134" y="292" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Was soll am Ende</text>
  <text x="134" y="306" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">anders sein?</text>

  <!-- Badge: Brücke zu TL04 -->
  <rect x="74" y="356" width="120" height="32" fill="#3D5494"/>
  <text x="134" y="368" class="mono" font-size="7.5" fill="#8898C4" text-anchor="middle" letter-spacing="0.5">EINSTIEG:</text>
  <text x="134" y="381" class="mono" font-size="7.5" fill="#EAD9A8" text-anchor="middle">Cockpit-Diagnose TL04</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCHRITT 2: EINSTIEG                                     -->
  <!-- x=218, w=148                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="218" y="122" width="148" height="284" fill="#EDEDF3"/>
  <rect x="218" y="122" width="148" height="4" fill="#3D5494"/>

  <text x="292" y="162" class="serif" font-size="44" fill="#8898C4" text-anchor="middle" font-style="italic" opacity="0.5">2</text>

  <text x="292" y="182" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">SCHRITT</text>
  <text x="292" y="200" class="serif" font-size="14" font-weight="500" fill="#1F2C56" text-anchor="middle">Einstieg</text>
  <line x1="238" y1="208" x2="346" y2="208" stroke="#C8CAD4" stroke-width="0.5"/>

  <text x="292" y="226" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Wertschätzend</text>
  <text x="292" y="240" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">öffnen, Anlass</text>
  <text x="292" y="254" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">benennen</text>

  <text x="292" y="278" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Kein Urteil</text>
  <text x="292" y="292" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">im ersten Satz –</text>
  <text x="292" y="306" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">zuerst fragen</text>

  <rect x="232" y="356" width="120" height="32" fill="#3D5494"/>
  <text x="292" y="368" class="mono" font-size="7.5" fill="#8898C4" text-anchor="middle" letter-spacing="0.5">PRINZIP:</text>
  <text x="292" y="381" class="mono" font-size="7.5" fill="#EAD9A8" text-anchor="middle">Interesse vor Urteil</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCHRITT 3: GEMEINSAME LAGEBEWERTUNG                    -->
  <!-- x=376, w=148                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="376" y="122" width="148" height="284" fill="#EDEDF3"/>
  <rect x="376" y="122" width="148" height="4" fill="#3D5494"/>

  <text x="450" y="162" class="serif" font-size="44" fill="#8898C4" text-anchor="middle" font-style="italic" opacity="0.5">3</text>

  <text x="450" y="182" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">SCHRITT</text>
  <text x="450" y="200" class="serif" font-size="14" font-weight="500" fill="#1F2C56" text-anchor="middle">Lagebewertung</text>
  <line x1="396" y1="208" x2="504" y2="208" stroke="#C8CAD4" stroke-width="0.5"/>

  <text x="450" y="226" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Sicht Berater</text>
  <text x="450" y="240" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">zuerst – Hypothese</text>
  <text x="450" y="254" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">als Frage teilen</text>

  <text x="450" y="278" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Gemeinsames</text>
  <text x="450" y="292" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Situationsbild</text>
  <text x="450" y="306" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">entwickeln</text>

  <rect x="390" y="356" width="120" height="32" fill="#3D5494"/>
  <text x="450" y="368" class="mono" font-size="7.5" fill="#8898C4" text-anchor="middle" letter-spacing="0.5">DATEN + ERFAHRUNG</text>
  <text x="450" y="381" class="mono" font-size="7.5" fill="#EAD9A8" text-anchor="middle">Cockpit + Kontext</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCHRITT 4: ZIELKLÄRUNG UND MASSNAHMEN – GOLD           -->
  <!-- x=534, w=148                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="534" y="122" width="148" height="284" fill="#1F2C56"/>
  <!-- Goldener Akzentbalken -->
  <rect x="534" y="122" width="148" height="4" fill="#D9C089"/>

  <text x="608" y="162" class="serif" font-size="44" fill="#D9C089" text-anchor="middle" font-style="italic" opacity="0.7">4</text>

  <text x="608" y="182" class="mono" font-size="8" fill="#8898C4" text-anchor="middle" letter-spacing="1">SCHRITT</text>
  <text x="608" y="200" class="serif" font-size="14" font-weight="500" fill="#D9C089" text-anchor="middle">Zielklärung</text>
  <line x1="554" y1="208" x2="662" y2="208" stroke="#8898C4" stroke-width="0.5"/>

  <text x="608" y="226" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">SMART-Ziel oder</text>
  <text x="608" y="240" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">konkreter nächster</text>
  <text x="608" y="254" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Schritt</text>

  <text x="608" y="278" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">Partizipativ –</text>
  <text x="608" y="292" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Ressourcen klären,</text>
  <text x="608" y="306" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Maßnahmen planen</text>

  <rect x="548" y="356" width="120" height="32" fill="#D9C089"/>
  <text x="608" y="368" class="mono" font-size="7.5" fill="#1F2C56" text-anchor="middle" letter-spacing="0.5">KERN-SCHRITT:</text>
  <text x="608" y="381" class="mono" font-size="7.5" fill="#1F2C56" text-anchor="middle">Locke &amp; Latham 2002</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCHRITT 5: VERBINDLICHKEIT UND FOLLOW-UP               -->
  <!-- x=692, w=148                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="692" y="122" width="148" height="284" fill="#EDEDF3"/>
  <rect x="692" y="122" width="148" height="4" fill="#3D5494"/>

  <text x="766" y="162" class="serif" font-size="44" fill="#8898C4" text-anchor="middle" font-style="italic" opacity="0.5">5</text>

  <text x="766" y="182" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">SCHRITT</text>
  <text x="766" y="200" class="serif" font-size="14" font-weight="500" fill="#1F2C56" text-anchor="middle">Verbindlichkeit</text>
  <line x1="712" y1="208" x2="820" y2="208" stroke="#C8CAD4" stroke-width="0.5"/>

  <text x="766" y="226" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Wer tut was</text>
  <text x="766" y="240" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">bis wann –</text>
  <text x="766" y="254" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">schriftlich</text>

  <text x="766" y="278" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">Nächsten Termin</text>
  <text x="766" y="292" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">vereinbaren,</text>
  <text x="766" y="306" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Nachhalten</text>

  <rect x="706" y="356" width="120" height="32" fill="#3D5494"/>
  <text x="766" y="368" class="mono" font-size="7.5" fill="#8898C4" text-anchor="middle" letter-spacing="0.5">ERGEBNIS:</text>
  <text x="766" y="381" class="mono" font-size="7.5" fill="#EAD9A8" text-anchor="middle">Vereinbarung + Datum</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEITPRINZIP-BANNER                                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="40" y1="440" x2="820" y2="440" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Zwei-Spalten-Layout: Links Formate-Unterscheidung, rechts SMART-Merkhilfe -->

  <!-- Linke Spalte: Format-Unterscheidung -->
  <text x="40" y="460" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">GESPRÄCHSFORMAT</text>
  <line x1="40" y1="466" x2="400" y2="466" stroke="#E2E3E8" stroke-width="0.5"/>

  <!-- Zeile 1: Zielgespräch -->
  <rect x="40" y="472" width="8" height="8" fill="#3D5494"/>
  <text x="56" y="481" class="mono" font-size="8" fill="#3D5494">Zielgespräch</text>
  <text x="150" y="481" class="mono" font-size="8" fill="#7A8099">Periodenbeginn · Ziel entwickeln · SMART formulieren</text>

  <!-- Zeile 2: Steuerungsgespräch -->
  <rect x="40" y="490" width="8" height="8" fill="#8898C4"/>
  <text x="56" y="499" class="mono" font-size="8" fill="#3D5494">Steuerungsgespräch</text>
  <text x="186" y="499" class="mono" font-size="8" fill="#7A8099">Cockpit-Anlass · Nächster Schritt · Follow-up</text>

  <!-- Zeile 3: Brücke -->
  <line x1="40" y1="510" x2="400" y2="510" stroke="#E2E3E8" stroke-width="0.5"/>
  <text x="40" y="524" class="mono" font-size="8" fill="#7A8099">Beide Formate folgen derselben Fünf-Schritte-Struktur.</text>

  <!-- Rechte Spalte: SMART-Merkhilfe -->
  <text x="440" y="460" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">SMART AUF EINEN BLICK</text>
  <line x1="440" y1="466" x2="820" y2="466" stroke="#E2E3E8" stroke-width="0.5"/>

  <!-- S -->
  <text x="440" y="481" class="mono" font-size="8" fill="#D9C089">S</text>
  <text x="452" y="481" class="mono" font-size="8" fill="#7A8099">  Spezifisch</text>
  <text x="560" y="481" class="mono" font-size="8" fill="#3D5494">M</text>
  <text x="572" y="481" class="mono" font-size="8" fill="#7A8099">  Messbar</text>
  <text x="660" y="481" class="mono" font-size="8" fill="#D9C089">A</text>
  <text x="672" y="481" class="mono" font-size="8" fill="#7A8099">  Achievable</text>

  <!-- R + T -->
  <text x="440" y="499" class="mono" font-size="8" fill="#D9C089">R</text>
  <text x="452" y="499" class="mono" font-size="8" fill="#7A8099">  Relevant</text>
  <text x="560" y="499" class="mono" font-size="8" fill="#D9C089">T</text>
  <text x="572" y="499" class="mono" font-size="8" fill="#7A8099">  Terminiert</text>
  <line x1="440" y1="510" x2="820" y2="510" stroke="#E2E3E8" stroke-width="0.5"/>
  <text x="440" y="524" class="mono" font-size="8" fill="#7A8099">Doran (1981). SMART gilt v. a. bei klar strukturierten Tätigkeiten.</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- KERNAUSSAGE (Leitprinzip)                               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="40" y1="542" x2="820" y2="542" stroke="#E2E3E8" stroke-width="1"/>
  <text x="40" y="560" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">LEITPRINZIP</text>
  <text x="40" y="578" class="serif" font-size="13" font-weight="500" fill="#1F2C56">steuern UND entwickeln</text>
  <text x="226" y="578" class="mono" font-size="9" fill="#7A8099"> – Verbindlichkeit entsteht nicht durch Druck, sondern durch Konkretheit: Wer tut was bis wann?</text>

  <!-- Baseline -->
  <line x1="40" y1="634" x2="820" y2="634" stroke="#15192B" stroke-width="1"/>

  <!-- Quellenzeile -->
  <text x="40" y="648" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Locke, E. A. &amp; Latham, G. P. (2002). Building a practically useful theory of goal setting. American Psychologist, 57(9), 705–717.</text>

</svg>
