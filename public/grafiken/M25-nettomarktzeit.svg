<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="620" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="28" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">NETTOMARKTZEIT · MODUL M25 · SELBSTMANAGEMENT</text>
  <line x1="40" y1="38" x2="820" y2="38" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="430" y="68" class="serif" font-size="18" font-weight="500" fill="#1F2C56" text-anchor="middle">Zeitverwendung: Vorher / Nachher</text>
  <text x="430" y="86" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle">NETTOMARKTZEIT = ZEIT IM MARKT · HEBEL LIEGT IN ADMIN UND MEETINGS – NICHT BEIM KUNDEN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYOUT-KOORDINATEN                                      -->
  <!-- Balken-Startpunkt X = 180 (Label-Zone links)           -->
  <!-- Balken-Breite = 560 px für 40 h                        -->
  <!-- 1h = 14 px                                             -->
  <!-- Vorher-Balken Y = 155 (Mitte 155–225), h = 70         -->
  <!-- Nachher-Balken Y = 340 (Mitte 340–410), h = 70        -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ─── SKALA ────────────────────────────────────────────── -->
  <!-- Skala-Linie -->
  <line x1="180" y1="470" x2="740" y2="470" stroke="#15192B" stroke-width="1"/>

  <!-- Skalenticks und Labels: 0, 5, 10, 15, 20, 25, 30, 35, 40 h -->
  <!-- 0h = x180, 40h = x740, 1h = 14px -->
  <line x1="180" y1="466" x2="180" y2="474" stroke="#15192B" stroke-width="1"/>
  <text x="180" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">0</text>

  <line x1="250" y1="466" x2="250" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="250" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">5</text>

  <line x1="320" y1="466" x2="320" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="320" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">10</text>

  <line x1="390" y1="466" x2="390" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="390" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">15</text>

  <line x1="460" y1="466" x2="460" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="460" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">20</text>

  <line x1="530" y1="466" x2="530" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="530" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">25</text>

  <line x1="600" y1="466" x2="600" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="600" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">30</text>

  <line x1="670" y1="466" x2="670" y2="474" stroke="#C8CAD4" stroke-width="1"/>
  <text x="670" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">35</text>

  <line x1="740" y1="466" x2="740" y2="474" stroke="#15192B" stroke-width="1"/>
  <text x="740" y="485" class="mono" font-size="9" fill="#7A8099" text-anchor="middle">40</text>

  <!-- Skala-Einheit rechts -->
  <text x="757" y="473" class="mono" font-size="9" fill="#7A8099">h/Woche</text>

  <!-- Raster-Linien (vertikal, hell, durch beide Balken) -->
  <line x1="250" y1="110" x2="250" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="320" y1="110" x2="320" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="390" y1="110" x2="390" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="460" y1="110" x2="460" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="530" y1="110" x2="530" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="600" y1="110" x2="600" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="670" y1="110" x2="670" y2="465" stroke="#E2E3E8" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- 40%-Ziellinie: 40% × 40h = 16h → x = 180 + 16×14 = 404 px -->
  <line x1="404" y1="108" x2="404" y2="466" stroke="#D9C089" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- Ziellinie-Label oben -->
  <rect x="390" y="108" width="56" height="16" fill="#D9C089"/>
  <text x="418" y="120" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle" letter-spacing="0.5">ZIEL 40 %</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VORHER-BALKEN (Markus Wagner, Woche 14)                 -->
  <!-- Gesamt: 40h, NMZ 31 % = 12,5h                          -->
  <!-- A: 12,5h → 175px    x0=180                             -->
  <!-- B:  9,0h → 126px    x0=355                             -->
  <!-- C:  9,0h → 126px    x0=481                             -->
  <!-- D:  7,5h → 105px    x0=607                             -->
  <!-- E:  2,0h →  28px    x0=712                             -->
  <!-- Summe: 12.5+9+9+7.5+2 = 40 h, 560 px  ✓               -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Vorher-Label -->
  <text x="170" y="152" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="end">VORHER</text>
  <text x="170" y="164" class="serif" font-size="11" font-weight="500" fill="#1F2C56" text-anchor="end">Markus Wagner</text>
  <text x="170" y="177" class="mono" font-size="8" fill="#7A8099" text-anchor="end">Woche 14</text>

  <!-- A – Kundenkontakt (Gold) 12,5h = 175px -->
  <rect x="180" y="148" width="175" height="70" fill="#D9C089"/>
  <!-- NMZ-Prozentzahl im Segment -->
  <text x="267" y="179" class="serif" font-size="22" font-style="italic" fill="#1F2C56" text-anchor="middle">31 %</text>
  <text x="267" y="196" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle">12,5 h</text>

  <!-- B – Vor-/Nachbereitung 9,0h = 126px -->
  <rect x="355" y="148" width="126" height="70" fill="#3D5494"/>
  <text x="418" y="181" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">9,0 h</text>

  <!-- C – Administration 9,0h = 126px -->
  <rect x="481" y="148" width="126" height="70" fill="#1F2C56"/>
  <text x="544" y="181" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">9,0 h</text>

  <!-- D – Interne Meetings 7,5h = 105px -->
  <rect x="607" y="148" width="105" height="70" fill="#8898C4"/>
  <text x="659" y="181" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle">7,5 h</text>

  <!-- E – Wege 2,0h = 28px -->
  <rect x="712" y="148" width="28" height="70" fill="#C8CAD4"/>
  <!-- Kein Text: zu schmal -->

  <!-- Trennlinien zwischen Segmenten (Vorher) -->
  <line x1="355" y1="148" x2="355" y2="218" stroke="#F8F8FA" stroke-width="1"/>
  <line x1="481" y1="148" x2="481" y2="218" stroke="#F8F8FA" stroke-width="1"/>
  <line x1="607" y1="148" x2="607" y2="218" stroke="#F8F8FA" stroke-width="1"/>
  <line x1="712" y1="148" x2="712" y2="218" stroke="#F8F8FA" stroke-width="1"/>

  <!-- Balken-Rahmen Vorher -->
  <rect x="180" y="148" width="560" height="70" fill="none" stroke="#E2E3E8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VERBINDUNGS-ZONE: Vier Hebel als kurze Notizen          -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Vertikale Pfeillinie Vorher→Nachher -->
  <line x1="267" y1="220" x2="267" y2="320" stroke="#D9C089" stroke-width="1.5"/>
  <polygon points="267,322 263,314 271,314" fill="#D9C089"/>

  <!-- Hebel-Box (mittig, zwischen den Balken) -->
  <rect x="316" y="228" width="368" height="86" fill="#EDEDF3"/>
  <rect x="316" y="228" width="4" height="86" fill="#D9C089"/>

  <text x="328" y="246" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">VIER NMZ-HEBEL UMGESETZT</text>

  <text x="328" y="263" class="mono" font-size="8" fill="#1F2C56">1  Terminblockung: Di/Mi/Do als Kundentage</text>
  <text x="328" y="278" class="mono" font-size="8" fill="#1F2C56">2  Delegation: agree-Pflege an Assistenz</text>
  <text x="328" y="293" class="mono" font-size="8" fill="#1F2C56">3  agree-Effizienz: Vorlagen, Favoritenmenüs</text>
  <text x="328" y="308" class="mono" font-size="8" fill="#1F2C56">4  Nicht-Vertriebsaufgaben abgegeben</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- NACHHER-BALKEN                                          -->
  <!-- A: 18,5h → 259px   x0=180                             -->
  <!-- B:  7,5h → 105px   x0=439                             -->
  <!-- C:  6,5h →  91px   x0=544                             -->
  <!-- D:  5,5h →  77px   x0=635                             -->
  <!-- E:  2,0h →  28px   x0=712                             -->
  <!-- Summe: 18.5+7.5+6.5+5.5+2 = 40h, 560px  ✓            -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Nachher-Label -->
  <text x="170" y="340" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="end">NACHHER</text>
  <text x="170" y="352" class="serif" font-size="11" font-weight="500" fill="#1F2C56" text-anchor="end">Markus Wagner</text>
  <text x="170" y="365" class="mono" font-size="8" fill="#7A8099" text-anchor="end">4 Wochen später</text>

  <!-- A – Kundenkontakt (Gold) 18,5h = 259px -->
  <rect x="180" y="336" width="259" height="70" fill="#D9C089"/>
  <!-- NMZ-Prozentzahl -->
  <text x="309" y="367" class="serif" font-size="22" font-style="italic" fill="#1F2C56" text-anchor="middle">46 %</text>
  <text x="309" y="384" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle">18,5 h</text>

  <!-- B – Vor-/Nachbereitung 7,5h = 105px -->
  <rect x="439" y="336" width="105" height="70" fill="#3D5494"/>
  <text x="491" y="369" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">7,5 h</text>

  <!-- C – Administration 6,5h = 91px -->
  <rect x="544" y="336" width="91" height="70" fill="#1F2C56"/>
  <text x="589" y="369" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">6,5 h</text>

  <!-- D – Interne Meetings 5,5h = 77px -->
  <rect x="635" y="336" width="77" height="70" fill="#8898C4"/>
  <text x="673" y="369" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle">5,5 h</text>

  <!-- E – Wege 2,0h = 28px -->
  <rect x="712" y="336" width="28" height="70" fill="#C8CAD4"/>

  <!-- Trennlinien zwischen Segmenten (Nachher) -->
  <line x1="439" y1="336" x2="439" y2="406" stroke="#F8F8FA" stroke-width="1"/>
  <line x1="544" y1="336" x2="544" y2="406" stroke="#F8F8FA" stroke-width="1"/>
  <line x1="635" y1="336" x2="635" y2="406" stroke="#F8F8FA" stroke-width="1"/>
  <line x1="712" y1="336" x2="712" y2="406" stroke="#F8F8FA" stroke-width="1"/>

  <!-- Balken-Rahmen Nachher -->
  <rect x="180" y="336" width="560" height="70" fill="none" stroke="#E2E3E8" stroke-width="1"/>

  <!-- NMZ-Gewinn-Pfeil (zwischen den beiden Goldblöcken, rechte Kante) -->
  <!-- Vorher: Goldende x=355, Nachher: Goldende x=439 -->
  <!-- Klammer oben: y=218, unten: y=336 -->
  <line x1="357" y1="220" x2="357" y2="334" stroke="#D9C089" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="441" y1="220" x2="441" y2="334" stroke="#D9C089" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Horizontale Brücke mit Pfeil (Mitte) -->
  <line x1="357" y1="278" x2="441" y2="278" stroke="#D9C089" stroke-width="2"/>
  <polygon points="441,278 433,274 433,282" fill="#D9C089"/>
  <!-- Delta-Label -->
  <text x="399" y="273" class="mono" font-size="9" fill="#D9C089" text-anchor="middle">+6 h</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEGENDE                                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <text x="180" y="510" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">LEGENDE</text>

  <!-- Legende Eintrag 1: Kundenkontakt -->
  <rect x="180" y="518" width="12" height="12" fill="#D9C089"/>
  <text x="198" y="528" class="mono" font-size="9" fill="#1F2C56">A – Kundenkontakt (NMZ-relevant)</text>

  <!-- Legende Eintrag 2: Vor/Nachbereitung -->
  <rect x="370" y="518" width="12" height="12" fill="#3D5494"/>
  <text x="388" y="528" class="mono" font-size="9" fill="#1F2C56">B – Vor-/Nachbereitung</text>

  <!-- Legende Eintrag 3: Administration -->
  <rect x="180" y="536" width="12" height="12" fill="#1F2C56"/>
  <text x="198" y="546" class="mono" font-size="9" fill="#1F2C56">C – Administration</text>

  <!-- Legende Eintrag 4: Meetings -->
  <rect x="370" y="536" width="12" height="12" fill="#8898C4"/>
  <text x="388" y="546" class="mono" font-size="9" fill="#1F2C56">D – Interne Meetings</text>

  <!-- Legende Eintrag 5: Wege -->
  <rect x="180" y="554" width="12" height="12" fill="#C8CAD4"/>
  <text x="198" y="564" class="mono" font-size="9" fill="#1F2C56">E – Wege &amp; Sonstiges</text>

  <!-- Ziellinie Legende -->
  <line x1="370" y1="560" x2="382" y2="560" stroke="#D9C089" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="388" y="564" class="mono" font-size="9" fill="#1F2C56">Zielwert 40 % NMZ (= 16 h)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- NMZ-KENNZAHLEN-BOX (rechts)                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="600" y="498" width="160" height="72" fill="#1F2C56"/>
  <rect x="600" y="498" width="160" height="3" fill="#D9C089"/>
  <text x="680" y="515" class="mono" font-size="8" fill="#8898C4" text-anchor="middle" letter-spacing="1">NMZ-ENTWICKLUNG</text>
  <text x="680" y="540" class="serif" font-size="28" font-style="italic" fill="#D9C089" text-anchor="middle">+15 PP</text>
  <text x="680" y="558" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">31 % → 46 % (Ziel: 40 %)</text>
  <text x="680" y="568" class="mono" font-size="7" fill="#8898C4" text-anchor="middle">+6 h Kundenkontakt pro Woche</text>

  <!-- Baseline -->
  <line x1="40" y1="590" x2="820" y2="590" stroke="#15192B" stroke-width="1"/>

  <!-- Quellenzeile -->
  <text x="40" y="610" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Drucker, P. F. (1967). The Effective Executive. Harper &amp; Row.</text>

</svg>
