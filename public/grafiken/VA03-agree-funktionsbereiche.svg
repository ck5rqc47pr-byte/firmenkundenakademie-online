<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">KERNBANKVERFAHREN · AGREE · MODUL VA03 · AGREE IM INNENDIENST EFFIZIENT NUTZEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">agree als Single Source of Truth</text>

  <!-- ══════════════════════════════════════════════
       OBERE DREI KACHELN  y=88–196
       Breite: 240 / 240 / 272  |  x: 40 / 294 / 548
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 1: Kundenstamm -->
  <rect x="40" y="88" width="240" height="108" fill="#3D5494"/>
  <text x="56" y="111" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">01 · KUNDENSTAMM</text>
  <line x1="56" y1="118" x2="264" y2="118" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="56" y="136" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Adresse &amp; Kontaktdaten pflegen</text>
  <text x="56" y="152" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Ansprechpartner verwalten</text>
  <text x="56" y="168" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Legitimation dokumentieren</text>

  <!-- KACHEL 2: Engagement- / Kreditübersicht -->
  <rect x="294" y="88" width="240" height="108" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="310" y="111" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">02 · ENGAGEMENT</text>
  <text x="310" y="123" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">KREDITÜBERSICHT</text>
  <line x1="310" y1="130" x2="518" y2="130" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="310" y="148" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Konten &amp; Kredite einsehen</text>
  <text x="310" y="164" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Limite prüfen</text>
  <text x="310" y="180" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Sicherheiten abrufen</text>

  <!-- KACHEL 3: Vorgänge &amp; Aufgaben -->
  <rect x="548" y="88" width="272" height="108" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="564" y="111" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">03 · VORGÄNGE &amp; AUFGABEN</text>
  <text x="564" y="123" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">WIEDERVORLAGE</text>
  <line x1="564" y1="130" x2="804" y2="130" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="564" y="148" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Aufgaben annehmen</text>
  <text x="564" y="164" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Wiedervorlage setzen</text>
  <text x="564" y="180" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Status nachverfolgen</text>

