  <rect x="294" y="210" width="272" height="88" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <text x="430" y="243" class="mono" font-size="14" fill="#D9C089" letter-spacing="3" text-anchor="middle">AGREE</text>
  <line x1="318" y1="252" x2="542" y2="252" stroke="#D9C089" stroke-width="0.5" opacity="0.45"/>
  <text x="430" y="269" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="1.5" text-anchor="middle">SINGLE SOURCE OF TRUTH</text>
  <text x="430" y="284" class="mono" font-size="7" fill="rgba(248,248,250,0.50)" letter-spacing="1" text-anchor="middle">KERNBANKVERFAHREN</text>

  <!-- Spoke-Linien (hinter den Kacheln, aber Kern überdeckt Mitte) -->
  <!-- oben: Kachel 1 zu Kern -->
  <line x1="160" y1="196" x2="310" y2="210" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- oben: Kachel 2 zu Kern -->
  <line x1="414" y1="196" x2="414" y2="210" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- oben: Kachel 3 zu Kern -->
  <line x1="684" y1="196" x2="550" y2="210" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════════════════════════════════════════════
       UNTERE DREI KACHELN  y=312–420
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 4: Dokumentenablage -->
  <rect x="40" y="312" width="240" height="108" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="56" y="335" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">04 · DOKUMENTENABLAGE</text>
  <line x1="56" y1="342" x2="264" y2="342" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="56" y="360" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Verträge &amp; Beschlüsse ablegen</text>
  <text x="56" y="376" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Auswertungen speichern</text>
  <text x="56" y="392" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Korrespondenz archivieren</text>

  <!-- KACHEL 5: Suche &amp; Recherche — AKZENT (Gold) -->
  <rect x="294" y="312" width="272" height="108" fill="#D9C089"/>
  <rect x="294" y="312" width="272" height="108" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <text x="310" y="335" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">05 · SUCHE &amp; RECHERCHE</text>
  <text x="310" y="348" class="mono" font-size="8" fill="#3D5494" letter-spacing="1">SCHNELLZUGRIFF</text>
  <line x1="310" y1="355" x2="550" y2="355" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="310" y="373" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Kunden schnell finden</text>
  <text x="310" y="389" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Vorgänge recherchieren</text>
  <text x="310" y="405" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Unterlagen auffinden</text>

  <!-- KACHEL 6: Auswertungen / Reporting -->
  <rect x="580" y="312" width="240" height="108" fill="#3D5494"/>
  <text x="596" y="335" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">06 · AUSWERTUNGEN</text>
  <text x="596" y="348" class="mono" font-size="8" fill="#8898C4" letter-spacing="1">REPORTING</text>
  <line x1="596" y1="355" x2="804" y2="355" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="596" y="373" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Listen aus Systembestand</text>
  <text x="596" y="389" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Übersichten generieren</text>
  <text x="596" y="405" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Controlling-Daten abrufen</text>

  <!-- Spoke-Linien unten (Kern zu unteren Kacheln) -->
  <line x1="310" y1="298" x2="160" y2="312" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="430" y1="298" x2="430" y2="312" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="550" y1="298" x2="700" y2="312" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN  y=436–484
       ══════════════════════════════════════════════ -->
  <rect x="40" y="436" width="780" height="50" fill="#EAD9A8"/>
  <rect x="40" y="436" width="780" height="50" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="436" width="4"   height="50" fill="#D9C089"/>
  <text x="58" y="456" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">EIN DATENPUNKT — EIN ORT.</text>
  <text x="58" y="472" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Wer im System führt, macht den Vorgang nachvollziehbar und vertretbar. agree ist das gemeinsame Gedächtnis des Teams.</text>

  <!-- Baseline -->
  <line x1="40" y1="498" x2="820" y2="498" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="512" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Kernbankverfahren agree · Modul VA03</text>
  <text x="820" y="512" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Atruvia AG (2023). agree21 Anwenderhandbuch Firmenkundenberatung.</text>
</svg>
