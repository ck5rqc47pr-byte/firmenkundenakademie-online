<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="700" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="28" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">TEAMENTWICKLUNG · MODUL TL03 · TEAMPHASEN</text>
  <line x1="40" y1="38" x2="820" y2="38" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel + Kernbotschaft -->
  <text x="430" y="66" class="serif" font-size="18" font-weight="500" fill="#1F2C56" text-anchor="middle">Teamphasenuhr nach Tuckman</text>
  <text x="430" y="83" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle">TEAMS ENTWICKELN SICH IN PHASEN – FÜHRUNG PASST SICH DER PHASE AN, NICHT UMGEKEHRT</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- KREIS-UHRWERK: cx=430, cy=372, r_outer=210, r_inner=96        -->
  <!-- Uhrzeigersinn: Forming (12–3h), Storming (3–6h),              -->
  <!--                Norming (6–9h), Performing (9–12h)             -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- ─── Segment 1: FORMING (oben-rechts, 12–3 Uhr = 270°–0°) ─── -->
  <!-- path: Kreisbogen von 270° bis 360° (90° Sektor) -->
  <!-- outer arc start: (430+0, 372-210) = (430,162)  end: (430+210, 372) = (640,372) -->
  <!-- inner arc start: (430+96, 372) = (526,372)      end: (430,372-96) = (430,276) -->
  <path d="M 430 162 A 210 210 0 0 1 640 372 L 526 372 A 96 96 0 0 0 430 276 Z"
        fill="#EDEDF3" stroke="#F8F8FA" stroke-width="3"/>
  <!-- Forming: Top-Akzentstreifen innen am Rand -->
  <path d="M 430 162 A 210 210 0 0 1 640 372 L 626 372 A 196 196 0 0 0 430 176 Z"
        fill="#3D5494"/>

  <!-- ─── Segment 2: STORMING (unten-rechts, 3–6 Uhr = 0°–90°) ─── -->
  <!-- outer arc from (640,372) to (430,582)  inner from (430,468) to (526,372) -->
  <path d="M 640 372 A 210 210 0 0 1 430 582 L 430 468 A 96 96 0 0 0 526 372 Z"
        fill="#EDEDF3" stroke="#F8F8FA" stroke-width="3"/>
  <path d="M 640 372 A 210 210 0 0 1 430 582 L 430 568 A 196 196 0 0 0 626 372 Z"
        fill="#8898C4"/>

  <!-- ─── Segment 3: NORMING (unten-links, 6–9 Uhr = 90°–180°) ─── -->
  <!-- outer arc from (430,582) to (220,372)  inner from (334,372) to (430,468) -->
  <path d="M 430 582 A 210 210 0 0 1 220 372 L 334 372 A 96 96 0 0 0 430 468 Z"
        fill="#EDEDF3" stroke="#F8F8FA" stroke-width="3"/>
  <path d="M 430 582 A 210 210 0 0 1 220 372 L 220 372 A 196 196 0 0 0 430 568 Z"
        fill="#3D5494"/>

  <!-- ─── Segment 4: PERFORMING (oben-links, 9–12 Uhr = 180°–270°) – GOLD ─── -->
  <!-- outer arc from (220,372) to (430,162)  inner from (430,276) to (334,372) -->
  <path d="M 220 372 A 210 210 0 0 1 430 162 L 430 276 A 96 96 0 0 0 334 372 Z"
        fill="#1F2C56" stroke="#F8F8FA" stroke-width="3"/>
  <!-- Gold-Akzentstreifen -->
  <path d="M 220 372 A 210 210 0 0 1 430 162 L 430 176 A 196 196 0 0 0 234 372 Z"
        fill="#D9C089"/>

  <!-- ─── Mittelkreis (Hub) ─── -->
  <circle cx="430" cy="372" r="86" fill="#1F2C56"/>
  <circle cx="430" cy="372" r="78" fill="#1F2C56" stroke="#D9C089" stroke-width="1.5"/>

  <!-- ─── Uhrzeiger-Richtungskreis (sehr dezent) ─── -->
  <circle cx="430" cy="372" r="210" fill="none" stroke="#C8CAD4" stroke-width="0.5"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- PHASEN-LABELS IN DEN SEGMENTEN                                 -->
  <!-- Segment-Mittelpunkte (Winkel je 45°):                          -->
  <!-- Forming: 315° → (430+165*cos315°, 372+165*sin315°)            -->
  <!--           = (430+116.7, 372-116.7) ≈ (547, 255)               -->
  <!-- Storming: 45° → (430+116.7, 372+116.7) ≈ (547, 489)          -->
  <!-- Norming:  135° → (430-116.7, 372+116.7) ≈ (313, 489)         -->
  <!-- Performing: 225° → (430-116.7, 372-116.7) ≈ (313, 255)       -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- FORMING: oben rechts -->
  <text x="545" y="245" class="serif" font-size="17" font-weight="500" fill="#1F2C56" text-anchor="middle">Forming</text>
  <text x="545" y="261" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">ORIENTIERUNG</text>
  <line x1="490" y1="272" x2="600" y2="272" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="545" y="286" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Unsicherheit · Abtasten</text>
  <text x="545" y="300" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Abhängigkeit von FK</text>
  <rect x="488" y="311" width="115" height="32" fill="#3D5494"/>
  <text x="545" y="323" class="mono" font-size="8" fill="#F8F8FA" text-anchor="middle" letter-spacing="0.5">FÜHRUNG:</text>
  <text x="545" y="337" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">Struktur · Ziele klären</text>

  <!-- STORMING: unten rechts -->
  <text x="545" y="449" class="serif" font-size="17" font-weight="500" fill="#1F2C56" text-anchor="middle">Storming</text>
  <text x="545" y="465" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">KONFLIKT</text>
  <line x1="490" y1="476" x2="600" y2="476" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="545" y="490" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Rollenkämpfe · Reibung</text>
  <text x="545" y="504" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Frustration sichtbar</text>
  <rect x="488" y="515" width="115" height="32" fill="#8898C4"/>
  <text x="545" y="527" class="mono" font-size="8" fill="#F8F8FA" text-anchor="middle" letter-spacing="0.5">FÜHRUNG:</text>
  <text x="545" y="541" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle">Konflikte moderieren</text>

  <!-- NORMING: unten links -->
  <text x="314" y="449" class="serif" font-size="17" font-weight="500" fill="#1F2C56" text-anchor="middle">Norming</text>
  <text x="314" y="465" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="1">ORGANISATION</text>
  <line x1="258" y1="476" x2="370" y2="476" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="314" y="490" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Normen entstehen</text>
  <text x="314" y="504" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Kohäsion wächst</text>
  <rect x="258" y="515" width="115" height="32" fill="#3D5494"/>
  <text x="314" y="527" class="mono" font-size="8" fill="#F8F8FA" text-anchor="middle" letter-spacing="0.5">FÜHRUNG:</text>
  <text x="314" y="541" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">Verantwortung übergeben</text>

  <!-- PERFORMING: oben links – GOLD-HIGHLIGHT -->
  <text x="314" y="245" class="serif" font-size="17" font-weight="500" fill="#D9C089" text-anchor="middle">Performing</text>
  <text x="314" y="261" class="mono" font-size="8" fill="#D9C089" text-anchor="middle" letter-spacing="1">LEISTUNG</text>
  <line x1="258" y1="272" x2="370" y2="272" stroke="#D9C089" stroke-width="0.5" opacity="0.6"/>
  <text x="314" y="286" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Selbststeuerung</text>
  <text x="314" y="300" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Hohe Leistungsfähigkeit</text>
  <rect x="258" y="311" width="115" height="32" fill="#D9C089"/>
  <text x="314" y="323" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle" letter-spacing="0.5">FÜHRUNG:</text>
  <text x="314" y="337" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle">Delegieren · Freiraum</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- MITTELKREIS-INHALT                                              -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="430" y="357" class="mono" font-size="8" fill="#8898C4" text-anchor="middle" letter-spacing="1">ZYKLUS</text>
  <text x="430" y="373" class="serif" font-size="13" font-weight="500" fill="#F8F8FA" text-anchor="middle">Tuckman</text>
  <text x="430" y="389" class="mono" font-size="8" fill="#D9C089" text-anchor="middle" letter-spacing="1">1965 / 1977</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- UHR-ZEIGER (Rotationspfeil, zeigt Uhrzeigersinn) - dezent     -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Kleiner gebogener Pfeil im Mittelkreis, Uhrzeigersinn -->
  <path d="M 430 308 A 30 30 0 1 1 399 339" fill="none" stroke="#D9C089" stroke-width="1.5" opacity="0.7"/>
  <polygon points="399,339 393,329 407,332" fill="#D9C089" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RÜCKFALL-PFEIL (Performing → Storming bei Disruption)         -->
  <!-- Diagonal von oben-links nach unten-rechts, dezent             -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Bogen außen, von Performing (ca. 210° auf Kreis) zurück zu Storming (~45°) -->
  <!-- Pfeilstart bei Performing-Bereich, außen links -->
  <path d="M 258 310 C 150 230 150 520 540 555"
        fill="none" stroke="#C8CAD4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="540,555 530,546 543,545" fill="#C8CAD4"/>
  <!-- Rückfall-Label -->
  <text x="142" y="400" class="mono" font-size="8" fill="#7A8099" text-anchor="middle" transform="rotate(-75, 142, 400)" letter-spacing="0.5">DISRUPTION</text>
  <text x="158" y="400" class="mono" font-size="8" fill="#7A8099" text-anchor="middle" transform="rotate(-75, 158, 400)" letter-spacing="0.5">→ RÜCKFALL</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- ADJOURNING: kleiner Kreis außen, 6-Uhr-Position (unten)      -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <circle cx="430" cy="601" r="22" fill="#F8F8FA" stroke="#C8CAD4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="430" y="597" class="mono" font-size="7" fill="#7A8099" text-anchor="middle" letter-spacing="0.5">ADJOURNING</text>
  <text x="430" y="609" class="mono" font-size="7" fill="#7A8099" text-anchor="middle">Auflösung</text>
  <!-- Verbindungslinie von Norming/Storming-Übergangspunkt zu Adjourning -->
  <line x1="430" y1="579" x2="430" y2="622" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- UHRZEIGER-PFEILE an den Segmentübergängen (Rotation)          -->
  <!-- 3 Uhr (rechts): (640,372) -->
  <!-- 6 Uhr (unten): (430,582) -->
  <!-- 9 Uhr (links): (220,372) -->
  <!-- 12 Uhr (oben): (430,162) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Kleiner Richtungspfeil bei 3 Uhr -->
  <polygon points="640,363 640,354 650,372" fill="#C8CAD4"/>
  <!-- Kleiner Richtungspfeil bei 9 Uhr -->
  <polygon points="220,381 220,390 210,372" fill="#C8CAD4"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEGENDE UNTEN                                                   -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <line x1="40" y1="645" x2="820" y2="645" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Legende: Rückfall-Pfeil -->
  <line x1="44" y1="658" x2="72" y2="658" stroke="#C8CAD4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="72,658 66,654 66,662" fill="#C8CAD4"/>
  <text x="78" y="662" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.5">Rückfall bei Disruption (Neuzugang, Umstrukturierung)</text>

  <!-- Legende: Performing -->
  <rect x="370" y="651" width="10" height="10" fill="#1F2C56"/>
  <text x="386" y="661" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.5">Performing = Zielzustand</text>

  <!-- Legende: Adjourning -->
  <circle cx="535" cy="657" r="5" fill="none" stroke="#C8CAD4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="546" y="661" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.5">Adjourning (Abschluss/Neuformierung)</text>

  <!-- Baseline -->
  <line x1="40" y1="681" x2="820" y2="681" stroke="#15192B" stroke-width="1"/>

  <!-- Quellenzeile -->
  <text x="40" y="693" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Tuckman, B. W. (1965). Developmental sequence in small groups. Psychological Bulletin, 63(6). · Tuckman, B. W. &amp; Jensen, M. A. C. (1977). Stages of small-group development revisited. Group &amp; Organization Studies, 2(4).</text>

</svg>
