<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">§ 154 AO · §§ 10–11 GwG · MODUL VA10 · NEUKUNDEN RECHTSSICHER ANLEGEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Neukundenanlage: Legitimation und Kontenwahrheit</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Die drei gesetzlichen Säulen der formalen Prüfung</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 1: Drei Säulen (y=104–230)
       Breite: 3 × 246 + 2 × 13 = 764 → x: 40 / 299 / 558
       ══════════════════════════════════════════════ -->

  <!-- SÄULE 1: Kontenwahrheit — Navy (Schwerpunkt) -->
  <rect x="40"  y="104" width="246" height="126" fill="#1F2C56"/>
  <rect x="40"  y="104" width="246" height="126" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <text x="56"  y="128" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">01 · KONTENWAHRHEIT</text>
  <text x="56"  y="141" class="mono" font-size="8" fill="#8898C4" letter-spacing="1">§ 154 AO</text>
  <line x1="56" y1="148" x2="270" y2="148" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="56"  y="166" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Verbot falscher oder erfundener</text>
  <text x="56"  y="180" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">  Namen auf Konten</text>
  <text x="56"  y="196" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Richtiger Name des Kontoinhabers</text>
  <text x="56"  y="212" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">Steuerrechtliche Grundpflicht</text>

  <!-- SÄULE 2: Identifizierung — Gold (Akzent) -->
  <rect x="299" y="104" width="246" height="126" fill="#D9C089"/>
  <rect x="299" y="104" width="246" height="126" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <text x="315" y="128" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">02 · IDENTIFIZIERUNG</text>
  <text x="315" y="141" class="mono" font-size="8" fill="#3D5494" letter-spacing="1">§§ 10–11 GwG</text>
  <line x1="315" y1="148" x2="529" y2="148" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="315" y="166" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Pflicht zur Identifizierung</text>
  <text x="315" y="180" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Ausweis / Reisepass (Natürl.)</text>
  <text x="315" y="196" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Registerauszug (Unternehmen)</text>
  <text x="315" y="212" class="mono" font-size="8" fill="#3D5494" letter-spacing="0.5">Geldwäscherechtliche Pflicht</text>

  <!-- SÄULE 3: Transparenzregister — Mid-Primary -->
  <rect x="558" y="104" width="262" height="126" fill="#3D5494"/>
  <text x="574" y="128" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">03 · TRANSPARENZREGISTER</text>
  <text x="574" y="141" class="mono" font-size="8" fill="#8898C4" letter-spacing="1">§§ 18–22 GwG</text>
  <line x1="574" y1="148" x2="804" y2="148" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="574" y="166" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Nachweis über wirtschaftlich</text>
  <text x="574" y="180" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">  Berechtigten einholen</text>
  <text x="574" y="196" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Auszug oder Eigenerklärung</text>
  <text x="574" y="212" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5">Pflicht seit GwG-Reform 2020</text>

  <!-- ══════════════════════════════════════════════
       ROLLEN-ABGRENZUNG (y=244–330)
       ══════════════════════════════════════════════ -->

  <text x="40" y="242" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">ROLLEN-ABGRENZUNG</text>
  <line x1="40" y1="248" x2="820" y2="248" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Linke Hälfte: Sachbearbeitung FORMAL -->
  <rect x="40"  y="256" width="376" height="68" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40"  y="256" width="4"   height="68" fill="#1F2C56"/>
  <text x="56"  y="274" class="mono" font-size="8" fill="#1F2C56" letter-spacing="1.5" font-weight="500">SACHBEARBEITUNG PRÜFT FORMAL</text>
  <text x="56"  y="290" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Sind die handelnden Personen identifiziert?</text>
  <text x="56"  y="304" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Sind Unterlagen vollständig und aktuell?</text>
  <text x="56"  y="318" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Zuständigkeit: Vertriebsassistenz</text>

  <!-- Trennpfeil (gezeichnet) -->
  <line x1="430" y1="290" x2="452" y2="290" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="452,285 462,290 452,295" fill="#C8CAD4"/>

  <!-- Rechte Hälfte: Berater/GW-Beauftragter INHALTLICH -->
  <rect x="468" y="256" width="352" height="68" fill="#1F2C56"/>
  <rect x="468" y="256" width="4"   height="68" fill="#D9C089"/>
  <text x="484" y="274" class="mono" font-size="8" fill="#D9C089" letter-spacing="1.5" font-weight="500">BERATER / GW-BEAUFTRAGTER INHALTLICH</text>
  <text x="484" y="290" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Wer ist wirtschaftlich Berechtigter?</text>
  <text x="484" y="304" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Risikoklassifizierung und KYC-Tiefe</text>
  <text x="484" y="318" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Vertiefung: Modul VA11</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=346–422)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="346" width="780" height="64" fill="#EAD9A8"/>
  <rect x="40" y="346" width="780" height="64" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="346" width="4"   height="64" fill="#D9C089"/>
  <text x="58" y="365" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">GRUNDREGEL: Kein Konto ohne vollständige Legitimationsunterlagen.</text>
  <text x="58" y="381" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Sorgfalt bei der Anlage ist kein Formalismus — sie schützt die Bank vor Haftung und vor Geldwäsche-</text>
  <text x="58" y="397" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">risiken. Fehlende oder veraltete Unterlagen müssen nachgefordert werden, bevor das Konto eröffnet wird.</text>

  <!-- Baseline -->
  <line x1="40" y1="432" x2="820" y2="432" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="448" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">§ 154 AO · §§ 10–11 GwG · Modul VA10</text>
  <text x="820" y="448" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Becker, J. &amp; Peppmeier, A. (2018). Bankbetriebslehre (11. Aufl.). NWB.</text>
</svg>
