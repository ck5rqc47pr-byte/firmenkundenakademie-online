<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">§ 43 GwG · § 47 GwG · BAFIN AUA · MODUL VA11 · EINHEITEN UND GELDWÄSCHEPRÄVENTION</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Verdacht erkennen und richtig eskalieren</text>
  <text x="40" y="87" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Die Assistenz erkennt und meldet — sie entscheidet nicht. Vier Schritte, zwei absolute Verbote.</text>

  <!-- ══════════════════════════════════════════════
       ESKALATIONSWEG: 4 STUFEN HORIZONTAL (y=102–220)
       ══════════════════════════════════════════════ -->

  <!-- STUFE 1: Verdachtssignal -->
  <rect x="40" y="102" width="168" height="102" fill="#3D5494"/>
  <rect x="40" y="102" width="168" height="4" fill="#D9C089"/>
  <text x="124" y="120" class="mono" font-size="7" fill="#D9C089" letter-spacing="2" text-anchor="middle">SCHRITT 1</text>
  <text x="124" y="133" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">Assistenz erkennt</text>
  <text x="124" y="146" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">Verdachtssignal</text>
  <line x1="56" y1="153" x2="192" y2="153" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <text x="124" y="167" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Unübliche Transaktion</text>
  <text x="124" y="179" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Inkonsistente Angaben</text>
  <text x="124" y="191" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Strukturierter Barverkehr</text>

  <!-- Pfeil 1 zu 2 -->
  <line x1="208" y1="153" x2="236" y2="153" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="236,148 248,153 236,158" fill="#C8CAD4"/>

  <!-- STUFE 2: Dokumentieren -->
  <rect x="248" y="102" width="168" height="102" fill="#1F2C56"/>
  <rect x="248" y="102" width="168" height="4" fill="#D9C089"/>
  <text x="332" y="120" class="mono" font-size="7" fill="#D9C089" letter-spacing="2" text-anchor="middle">SCHRITT 2</text>
  <text x="332" y="133" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">Schriftlich</text>
  <text x="332" y="146" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">dokumentieren</text>
  <line x1="264" y1="153" x2="400" y2="153" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <text x="332" y="167" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Datum, Sachverhalt,</text>
  <text x="332" y="179" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Beobachtung festhalten</text>
  <text x="332" y="191" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Ablauf nicht verändern</text>

  <!-- Pfeil 2 zu 3 -->
  <line x1="416" y1="153" x2="444" y2="153" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="444,148 456,153 444,158" fill="#C8CAD4"/>

  <!-- STUFE 3: GW-Beauftragten informieren -->
  <rect x="456" y="102" width="168" height="102" fill="#1F2C56"/>
  <rect x="456" y="102" width="168" height="4" fill="#D9C089"/>
  <text x="540" y="120" class="mono" font-size="7" fill="#D9C089" letter-spacing="2" text-anchor="middle">SCHRITT 3</text>
  <text x="540" y="133" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">GW-Beauftragten</text>
  <text x="540" y="146" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">unverzüglich inform.</text>
  <line x1="472" y1="153" x2="608" y2="153" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <text x="540" y="167" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Intern melden,</text>
  <text x="540" y="179" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">nicht selbst entscheiden</text>
  <text x="540" y="191" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Dokumentation übergeben</text>

  <!-- Pfeil 3 zu 4 -->
  <line x1="624" y1="153" x2="652" y2="153" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="652,148 664,153 652,158" fill="#C8CAD4"/>

  <!-- STUFE 4: GW-Beauftragter meldet an FIU -->
  <rect x="664" y="102" width="156" height="102" fill="#D9C089" stroke="#1F2C56" stroke-width="1.5"/>
  <text x="742" y="120" class="mono" font-size="7" fill="#1F2C56" letter-spacing="2" text-anchor="middle">SCHRITT 4</text>
  <text x="742" y="133" class="mono" font-size="9" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">GW-Beauftragter</text>
  <text x="742" y="146" class="mono" font-size="9" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">meldet an FIU</text>
  <line x1="680" y1="153" x2="804" y2="153" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="742" y="167" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">§ 43 GwG Meldepflicht</text>
  <text x="742" y="179" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">Financial Intelligence Unit</text>
  <text x="742" y="191" class="mono" font-size="7" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">NICHT die Assistenz</text>

  <!-- ══════════════════════════════════════════════
       ZWEI WARNBLÖCKE (y=234–330)
       ══════════════════════════════════════════════ -->

  <!-- WARN-BLOCK 1: Tipping-Off-Verbot -->
  <rect x="40" y="234" width="378" height="80" fill="#5C1010"/>
  <rect x="40" y="234" width="378" height="80" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <rect x="40" y="234" width="5" height="80" fill="#D9C089"/>
  <!-- Warn-Badge -->
  <rect x="53" y="244" width="100" height="16" fill="#D9C089"/>
  <text x="103" y="256" class="mono" font-size="7" fill="#1F2C56" letter-spacing="1" text-anchor="middle" font-weight="500">TIPPING-OFF-VERBOT</text>
  <text x="53" y="277" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">§ 47 GwG: Den Kunden NICHT auf den</text>
  <text x="53" y="291" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">Verdacht ansprechen.</text>
  <text x="53" y="306" class="mono" font-size="7" fill="rgba(248,248,250,0.70)" letter-spacing="0.5">Kein Hinweis, keine Andeutung gegenüber dem Betroffenen</text>

  <!-- WARN-BLOCK 2: Sorgfaltspflicht -->
  <rect x="432" y="234" width="388" height="80" fill="#5C1010"/>
  <rect x="432" y="234" width="388" height="80" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <rect x="432" y="234" width="5" height="80" fill="#D9C089"/>
  <!-- Warn-Badge -->
  <rect x="445" y="244" width="116" height="16" fill="#D9C089"/>
  <text x="503" y="256" class="mono" font-size="7" fill="#1F2C56" letter-spacing="1" text-anchor="middle" font-weight="500">SORGFALTSPFLICHT</text>
  <text x="445" y="277" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5">Die Sorgfaltspflicht ist nicht ermessensabhängig.</text>
  <text x="445" y="291" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5">Sie steht über Kundenwert und Beraterwunsch.</text>
  <text x="445" y="306" class="mono" font-size="7" fill="rgba(248,248,250,0.70)" letter-spacing="0.5">BaFin AuA: keine Ausnahme, kein Ermessen, keine interne Weisung dagegen</text>

  <!-- ══════════════════════════════════════════════
       AMPELKARTE: Drei Signaltypen (y=334–402)
       ══════════════════════════════════════════════ -->

  <text x="40" y="334" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">TYPISCHE VERDACHTSSIGNALE IN DER ASSISTENZPRAXIS</text>
  <line x1="40" y1="340" x2="820" y2="340" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Signal 1 -->
  <rect x="40" y="350" width="248" height="44" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="350" width="4" height="44" fill="#3D5494"/>
  <text x="58" y="366" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Unübliche Transaktionsmuster</text>
  <text x="58" y="380" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Hohe Barumsätze, viele Kleinbeträge knapp unter</text>
  <text x="58" y="390" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Meldeschwellen (strukturierter Barverkehr)</text>

  <!-- Signal 2 -->
  <rect x="306" y="350" width="248" height="44" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="306" y="350" width="4" height="44" fill="#3D5494"/>
  <text x="324" y="366" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Inkonsistente Angaben</text>
  <text x="324" y="380" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Adresswechsel ohne plausiblen Grund, Widersprüche</text>
  <text x="324" y="390" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">zwischen Einkommensnachweisen und Kontoumsätzen</text>

  <!-- Signal 3 -->
  <rect x="572" y="350" width="248" height="44" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="572" y="350" width="4" height="44" fill="#3D5494"/>
  <text x="590" y="366" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Unklare wirtschaftliche Herkunft</text>
  <text x="590" y="380" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Plötzlich hohe Einlagen ohne nachvollziehbaren</text>
  <text x="590" y="390" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Hintergrund, Dritte als wirtschaftlich Berechtigte</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=408–484)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="408" width="780" height="64" fill="#EAD9A8"/>
  <rect x="40" y="408" width="780" height="64" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="408" width="4" height="64" fill="#D9C089"/>
  <text x="58" y="427" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">KERNBOTSCHAFT: Die Assistenz erkennt und meldet — sie entscheidet nicht.</text>
  <text x="58" y="443" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Wer dokumentiert und unverzüglich an den Geldwäschebeauftragten eskaliert, ist rechtlich abgesichert.</text>
  <text x="58" y="459" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Die Meldung an die FIU (§ 43 GwG) obliegt ausschließlich dem Geldwäschebeauftragten — niemals der Assistenz.</text>

  <!-- Baseline -->
  <line x1="40" y1="490" x2="820" y2="490" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="506" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">§ 43 GwG · § 47 GwG · BaFin AuA · Modul VA11</text>
  <text x="820" y="506" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">BaFin (2024). Auslegungs- und Anwendungshinweise zum GwG. Bundesanstalt für Finanzdienstleistungsaufsicht.</text>
</svg>
