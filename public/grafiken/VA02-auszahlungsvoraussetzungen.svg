<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">AUSZAHLUNG · MARISK BTO 1.2 · § 18 KWG · MODUL VA02 · SICHERHEITEN UND AUSZAHLUNG FORMAL KORREKT BEARBEITEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Auszahlungsvoraussetzungen – das Tor vor der Auszahlung</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="1">ALLE PUNKTE MÜSSEN ERFÜLLT SEIN, BEVOR DIE AUSZAHLUNG FREIGEGEBEN WERDEN DARF</text>

  <!-- ══════════════════════════════════════════════
       LINKE SPALTE: PRUFPUNKTE  x=40–490
       ══════════════════════════════════════════════ -->

  <!-- Header Prüfliste -->
  <rect x="40" y="104" width="450" height="32" fill="#1F2C56"/>
  <text x="56" y="125" class="mono" font-size="10" fill="#F8F8FA" letter-spacing="2">PRÜFPUNKTE VOR AUSZAHLUNG</text>

  <!-- Prüfpunkt 1 -->
  <rect x="40" y="136" width="450" height="46" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="136" width="4"   height="46" fill="#3D5494"/>
  <text x="56" y="154" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">01 · KREDITVERTRAG</text>
  <text x="56" y="170" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Kreditvertrag von allen Parteien rechtsverbindlich unterschrieben</text>

  <!-- Prüfpunkt 2 -->
  <rect x="40" y="184" width="450" height="58" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="184" width="4"   height="58" fill="#3D5494"/>
  <text x="56" y="202" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">02 · SICHERHEITEN</text>
  <text x="56" y="218" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Vereinbarte Sicherheiten bestellt und nachgewiesen</text>
  <text x="56" y="234" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Grundschuld eingetragen — Rang im Grundbuch gesichert</text>

  <!-- Prüfpunkt 3 -->
  <rect x="40" y="244" width="450" height="58" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="244" width="4"   height="58" fill="#3D5494"/>
  <text x="56" y="262" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">03 · OFFENLEGUNG (§ 18 KWG)</text>
  <text x="56" y="278" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Aktuelle Offenlegungsunterlagen vollstandig eingegangen</text>
  <text x="56" y="294" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Jahresabschluss / BWA / Saldenliste geprüft und abgelegt</text>

  <!-- Prüfpunkt 4 -->
  <rect x="40" y="304" width="450" height="58" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="304" width="4"   height="58" fill="#3D5494"/>
  <text x="56" y="322" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">04 · BESONDERE AUFLAGEN</text>
  <text x="56" y="338" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Auflagen aus dem Kreditbeschluss erfullt</text>
  <text x="56" y="354" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">z. B. Eigenmittelnachweis, Verwendungsnachweis</text>

  <!-- ══════════════════════════════════════════════
       GATE-PFEIL MITTE  x=491–530
       ══════════════════════════════════════════════ -->

  <!-- Pfeil-Linie -->
  <line x1="500" y1="228" x2="530" y2="228" stroke="#1F2C56" stroke-width="2"/>
  <polygon points="528,222 540,228 528,234" fill="#1F2C56"/>

  <!-- Alle-Punkte-Label -->
  <text x="514" y="218" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">ALLE</text>
  <text x="514" y="242" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">ERFÜLLT</text>

  <!-- ══════════════════════════════════════════════
       RECHTE SPALTE: FREIGABE  x=540–820
       ══════════════════════════════════════════════ -->

  <!-- Freigabe-Box Header -->
  <rect x="540" y="104" width="280" height="32" fill="#1F2C56"/>
  <text x="556" y="125" class="mono" font-size="10" fill="#D9C089" letter-spacing="2">ERGEBNIS</text>

  <!-- Freigabe-Box Body -->
  <rect x="540" y="136" width="280" height="226" fill="#1F2C56" stroke="#D9C089" stroke-width="1.5"/>

  <!-- Grosses Label -->
  <text x="680" y="220" class="serif" font-size="14" fill="#D9C089" font-weight="500" text-anchor="middle">AUSZAHLUNG</text>
  <text x="680" y="244" class="mono" font-size="11" fill="#F8F8FA" letter-spacing="3" text-anchor="middle">FREIGABEREIF</text>

  <!-- Trennlinie -->
  <line x1="560" y1="264" x2="800" y2="264" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>

  <!-- Untertext Freigabe -->
  <text x="680" y="288" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Marktfolge prüft und gibt frei.</text>
  <text x="680" y="304" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Markt kommuniziert dem Kunden.</text>
  <text x="680" y="320" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Vier-Augen-Prinzip MaRisk BTO 1.2.</text>

  <!-- Dekorative Linie unten -->
  <line x1="560" y1="340" x2="800" y2="340" stroke="#D9C089" stroke-width="0.5" opacity="0.3"/>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN  (y=378–432)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="378" width="780" height="44" fill="#EAD9A8"/>
  <rect x="40" y="378" width="780" height="44" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="378" width="4"   height="44" fill="#D9C089"/>
  <text x="58" y="397" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">ROLLE DER VERTRIEBSASSISTENZ — MARISK BTO 1.2</text>
  <text x="58" y="413" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Die Assistenz erkennt, dokumentiert und eskaliert — sie entscheidet nicht (MaRisk BTO 1.2). Freigabe = Marktfolge.</text>

  <!-- Baseline -->
  <line x1="40" y1="444" x2="820" y2="444" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="460" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">MaRisk BTO 1.2 · § 18 KWG · Modul VA02</text>
  <text x="820" y="460" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Bundesanstalt fur Finanzdienstleistungsaufsicht (2017). MaRisk AT/BTO 1.2. BaFin.</text>
</svg>
