<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="660" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="28" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">SITUATIVES FÜHREN · MODUL TL02 · FÜHRUNGSSTILE</text>
  <line x1="40" y1="38" x2="820" y2="38" stroke="#E2E3E8" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- TEIL 1: 2×2 STILMATRIX                                -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Y-Achse Label: Beziehungsorientierung -->
  <text x="14" y="270" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle" transform="rotate(-90, 14, 270)">BEZIEHUNGSORIENTIERUNG</text>
  <!-- Y-Achse Beschriftungen -->
  <text x="28" y="60" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hoch</text>
  <text x="28" y="430" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">niedrig</text>

  <!-- X-Achse Label: Aufgabenorientierung -->
  <text x="460" y="458" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle">AUFGABENORIENTIERUNG</text>
  <!-- X-Achse Beschriftungen -->
  <text x="100" y="472" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">niedrig</text>
  <text x="820" y="472" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hoch</text>

  <!-- Achsen -->
  <line x1="60" y1="52" x2="60" y2="445" stroke="#15192B" stroke-width="1.5"/>
  <line x1="60" y1="445" x2="830" y2="445" stroke="#15192B" stroke-width="1.5"/>
  <!-- Achsen-Pfeilspitzen -->
  <polygon points="60,48 55,58 65,58" fill="#15192B"/>
  <polygon points="834,445 824,440 824,450" fill="#15192B"/>

  <!-- Mittellinie vertikal (teilt Matrix in L/R) -->
  <line x1="445" y1="52" x2="445" y2="445" stroke="#E2E3E8" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Mittellinie horizontal (teilt Matrix in O/U) -->
  <line x1="60" y1="248" x2="830" y2="248" stroke="#E2E3E8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ─── S3 | oben-links: niedrig Aufgabe, hoch Beziehung ─── -->
  <rect x="62" y="54" width="381" height="192" fill="#EDEDF3"/>
  <!-- Accent-Streifen oben -->
  <rect x="62" y="54" width="381" height="4" fill="#8898C4"/>
  <!-- Stil-Nummer -->
  <text x="82" y="82" class="serif" font-size="26" font-style="italic" fill="#1F2C56" opacity="0.25">S3</text>
  <!-- Titel -->
  <text x="252" y="110" class="serif" font-size="16" font-weight="500" fill="#1F2C56" text-anchor="middle">Sekundieren / Partizipieren</text>
  <!-- Kurzcharakteristik -->
  <text x="252" y="133" class="mono" font-size="9" fill="#3D5494" text-anchor="middle">Zuhören · Ermutigen · Einbeziehen</text>
  <line x1="122" y1="147" x2="382" y2="147" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="252" y="163" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Kann – braucht Zutrauen,</text>
  <text x="252" y="177" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">nicht mehr Kontrolle</text>
  <!-- Reifegrad-Badge -->
  <rect x="192" y="216" width="120" height="22" fill="#3D5494"/>
  <text x="252" y="231" class="mono" font-size="9" fill="#F8F8FA" text-anchor="middle" letter-spacing="1">→ REIFEGRAD D3</text>

  <!-- ─── S2 | oben-rechts: hoch Aufgabe, hoch Beziehung ─── -->
  <rect x="447" y="54" width="381" height="192" fill="#1F2C56"/>
  <!-- Accent-Streifen oben -->
  <rect x="447" y="54" width="381" height="4" fill="#D9C089"/>
  <!-- Stil-Nummer -->
  <text x="467" y="82" class="serif" font-size="26" font-style="italic" fill="#F8F8FA" opacity="0.25">S2</text>
  <!-- Titel -->
  <text x="637" y="110" class="serif" font-size="16" font-weight="500" fill="#F8F8FA" text-anchor="middle">Coachen / Trainieren</text>
  <!-- Kurzcharakteristik -->
  <text x="637" y="133" class="mono" font-size="9" fill="#D9C089" text-anchor="middle">Erklären · Dialog · Ermutigen</text>
  <line x1="507" y1="147" x2="767" y2="147" stroke="#8898C4" stroke-width="0.5"/>
  <text x="637" y="163" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Wachsendes Können braucht</text>
  <text x="637" y="177" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Erklärung und Motivation</text>
  <!-- Reifegrad-Badge -->
  <rect x="577" y="216" width="120" height="22" fill="#D9C089"/>
  <text x="637" y="231" class="mono" font-size="9" fill="#1F2C56" text-anchor="middle" letter-spacing="1">→ REIFEGRAD D2</text>

  <!-- ─── S4 | unten-links: niedrig Aufgabe, niedrig Beziehung ─── -->
  <rect x="62" y="250" width="381" height="193" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="1"/>
  <!-- Accent-Streifen unten -->
  <rect x="62" y="439" width="381" height="4" fill="#8898C4"/>
  <!-- Stil-Nummer -->
  <text x="82" y="278" class="serif" font-size="26" font-style="italic" fill="#1F2C56" opacity="0.18">S4</text>
  <!-- Titel -->
  <text x="252" y="306" class="serif" font-size="16" font-weight="500" fill="#1F2C56" text-anchor="middle">Delegieren</text>
  <!-- Kurzcharakteristik -->
  <text x="252" y="329" class="mono" font-size="9" fill="#3D5494" text-anchor="middle">Freiraum · Vertrauen · Verantwortung</text>
  <line x1="122" y1="343" x2="382" y2="343" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="252" y="359" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Kann und will – braucht</text>
  <text x="252" y="373" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Freiraum, keinen Dirigenten</text>
  <!-- Reifegrad-Badge -->
  <rect x="192" y="412" width="120" height="22" fill="#3D5494"/>
  <text x="252" y="427" class="mono" font-size="9" fill="#F8F8FA" text-anchor="middle" letter-spacing="1">→ REIFEGRAD D4</text>

  <!-- ─── S1 | unten-rechts: hoch Aufgabe, niedrig Beziehung ─── -->
  <rect x="447" y="250" width="381" height="193" fill="#EDEDF3"/>
  <!-- Accent-Streifen unten -->
  <rect x="447" y="439" width="381" height="4" fill="#3D5494"/>
  <!-- Stil-Nummer -->
  <text x="467" y="278" class="serif" font-size="26" font-style="italic" fill="#1F2C56" opacity="0.18">S1</text>
  <!-- Titel -->
  <text x="637" y="306" class="serif" font-size="16" font-weight="500" fill="#1F2C56" text-anchor="middle">Dirigieren / Anleiten</text>
  <!-- Kurzcharakteristik -->
  <text x="637" y="329" class="mono" font-size="9" fill="#3D5494" text-anchor="middle">Struktur · Klarheit · Schritt für Schritt</text>
  <line x1="507" y1="343" x2="767" y2="343" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="637" y="359" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Einsteiger braucht Klarheit,</text>
  <text x="637" y="373" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">keine offene Diskussion</text>
  <!-- Reifegrad-Badge -->
  <rect x="577" y="412" width="120" height="22" fill="#3D5494"/>
  <text x="637" y="427" class="mono" font-size="9" fill="#F8F8FA" text-anchor="middle" letter-spacing="1">→ REIFEGRAD D1</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- TEIL 2: REIFEGRAD-LEISTE D1 → D4                      -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Trennlinie -->
  <line x1="40" y1="492" x2="820" y2="492" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Abschnitts-Label -->
  <text x="40" y="510" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">REIFEGRAD DES MITARBEITERS (AUFGABENBEZOGEN)</text>

  <!-- Pfeil D1 → D4 -->
  <line x1="62" y1="525" x2="800" y2="525" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="804,525 794,520 794,530" fill="#C8CAD4"/>

  <!-- D1-Karte -->
  <rect x="62" y="532" width="172" height="88" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="62" y="532" width="172" height="3" fill="#3D5494"/>
  <text x="148" y="553" class="serif" font-size="15" font-weight="500" fill="#1F2C56" text-anchor="middle">D1</text>
  <text x="148" y="570" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="0.5">GERING · HOCH</text>
  <text x="148" y="586" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">wenig Können,</text>
  <text x="148" y="598" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">viel Engagement</text>
  <text x="148" y="612" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle" font-weight="500">→ S1 Dirigieren</text>

  <!-- D2-Karte (Accent-Gold: kritischste Stufe) -->
  <rect x="248" y="532" width="172" height="88" fill="#1F2C56"/>
  <rect x="248" y="532" width="172" height="3" fill="#D9C089"/>
  <text x="334" y="553" class="serif" font-size="15" font-weight="500" fill="#D9C089" text-anchor="middle">D2</text>
  <text x="334" y="570" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle" letter-spacing="0.5">WACHSEND · SINKEND</text>
  <text x="334" y="586" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">wachsendes Können,</text>
  <text x="334" y="598" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">sinkendes Engagement</text>
  <text x="334" y="612" class="mono" font-size="8" fill="#D9C089" text-anchor="middle" font-weight="500">→ S2 Coachen</text>

  <!-- D3-Karte -->
  <rect x="434" y="532" width="172" height="88" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="434" y="532" width="172" height="3" fill="#3D5494"/>
  <text x="520" y="553" class="serif" font-size="15" font-weight="500" fill="#1F2C56" text-anchor="middle">D3</text>
  <text x="520" y="570" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="0.5">HOCH · SCHWANKEND</text>
  <text x="520" y="586" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hohes Können,</text>
  <text x="520" y="598" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">schwankendes Vertrauen</text>
  <text x="520" y="612" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle" font-weight="500">→ S3 Sekundieren</text>

  <!-- D4-Karte -->
  <rect x="620" y="532" width="172" height="88" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="620" y="532" width="172" height="3" fill="#3D5494"/>
  <text x="706" y="553" class="serif" font-size="15" font-weight="500" fill="#1F2C56" text-anchor="middle">D4</text>
  <text x="706" y="570" class="mono" font-size="8" fill="#3D5494" text-anchor="middle" letter-spacing="0.5">HOCH · HOCH</text>
  <text x="706" y="586" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hohes Können,</text>
  <text x="706" y="598" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hohes Engagement</text>
  <text x="706" y="612" class="mono" font-size="8" fill="#1F2C56" text-anchor="middle" font-weight="500">→ S4 Delegieren</text>

  <!-- Verbindungspfeile D-Karten → Stil-Badges (dezent) -->
  <!-- D1 → S1: Pfeil nach oben (zu unten-rechts) -->
  <line x1="148" y1="532" x2="637" y2="443" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- D2 → S2: Pfeil nach oben (zu oben-rechts) -->
  <line x1="334" y1="532" x2="637" y2="250" stroke="#D9C089" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- D3 → S3: Pfeil nach oben (zu oben-links) -->
  <line x1="520" y1="532" x2="252" y2="250" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- D4 → S4: Pfeil nach oben (zu unten-links) -->
  <line x1="706" y1="532" x2="252" y2="443" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Baseline -->
  <line x1="40" y1="644" x2="820" y2="644" stroke="#15192B" stroke-width="1"/>

  <!-- Kernbotschaft -->
  <text x="40" y="636" class="mono" font-size="9" fill="#3D5494" letter-spacing="0.5" font-style="italic">Reifegrad ist aufgabenbezogen, nicht personenbezogen.</text>

  <!-- Quellenzeile -->
  <text x="40" y="655" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Hersey, P. &amp; Blanchard, K. H. (1996). Management of Organizational Behavior. Prentice Hall.</text>

</svg>
