<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">ROLLENTHEORIE · KATZ &amp; KAHN (1978) · MODUL VA07 · DIE SCHNITTSTELLE BERATER–ASSISTENZ AKTIV GESTALTEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Die Assistenz im Rollengeflecht (role set)</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Verschiedene Erwartungssender – nicht immer mit kompatiblen Anforderungen</text>

  <!-- ══════════════════════════════════════════════
       ZENTRUM: Assistenz-Ellipse  (cx=390, cy=235)
       ══════════════════════════════════════════════ -->
  <ellipse cx="390" cy="235" rx="66" ry="38" fill="#1F2C56"/>
  <ellipse cx="390" cy="235" rx="66" ry="38" fill="none" stroke="#D9C089" stroke-width="2"/>
  <text x="390" y="230" class="mono" font-size="9" fill="#D9C089" letter-spacing="2" text-anchor="middle" font-weight="500">ASSISTENZ</text>
  <text x="390" y="245" class="mono" font-size="8" fill="#8898C4" letter-spacing="1" text-anchor="middle">Rollenträger</text>

  <!-- ══════════════════════════════════════════════
       ERWARTUNGSSENDER: 5 Kacheln außen
       ══════════════════════════════════════════════ -->

  <!-- BERATER A (oben links) -->
  <rect x="40" y="100" width="148" height="66" fill="#3D5494"/>
  <text x="114" y="124" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" text-anchor="middle">BERATER A</text>
  <line x1="60" y1="130" x2="168" y2="130" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="114" y="145" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.3" text-anchor="middle">„Sofort – mein Termin!</text>
  <text x="114" y="158" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.3" text-anchor="middle">Priorität 1"</text>

  <!-- Pfeil Berater A zur Assistenz -->
  <line x1="188" y1="147" x2="326" y2="218" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="326,218 314,213 319,224" fill="#C8CAD4"/>

  <!-- BERATER B (oben rechts) -->
  <rect x="672" y="100" width="148" height="66" fill="#3D5494"/>
  <text x="746" y="124" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" text-anchor="middle">BERATER B</text>
  <line x1="692" y1="130" x2="800" y2="130" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="746" y="145" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.3" text-anchor="middle">„Heute noch –</text>
  <text x="746" y="158" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.3" text-anchor="middle">dringend!"</text>

  <!-- Pfeil Berater B zur Assistenz -->
  <line x1="672" y1="147" x2="454" y2="218" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="454,218 454,205 463,218" fill="#C8CAD4"/>

  <!-- MARKTFOLGE (links Mitte) -->
  <rect x="40" y="204" width="148" height="62" fill="#1F2C56" stroke="#C8CAD4" stroke-width="1"/>
  <text x="114" y="226" class="mono" font-size="8" fill="#8898C4" letter-spacing="2" text-anchor="middle">MARKTFOLGE</text>
  <line x1="60" y1="232" x2="168" y2="232" stroke="#C8CAD4" stroke-width="0.5" opacity="0.4"/>
  <text x="114" y="247" class="mono" font-size="7.5" fill="rgba(248,248,250,0.75)" letter-spacing="0.3" text-anchor="middle">„Vollständige Unterlagen</text>
  <text x="114" y="259" class="mono" font-size="7.5" fill="rgba(248,248,250,0.75)" letter-spacing="0.3" text-anchor="middle">bis 12 Uhr"</text>

  <!-- Pfeil Marktfolge zur Assistenz -->
  <line x1="188" y1="235" x2="324" y2="235" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="324,235 312,229 312,241" fill="#C8CAD4"/>

  <!-- KUNDE (rechts Mitte) -->
  <rect x="672" y="204" width="148" height="62" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="746" y="226" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2" text-anchor="middle">KUNDE</text>
  <line x1="692" y1="232" x2="800" y2="232" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="746" y="247" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3" text-anchor="middle">„Ich möchte Rückmeldung</text>
  <text x="746" y="259" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3" text-anchor="middle">bis heute Mittag"</text>

  <!-- Pfeil Kunde zur Assistenz -->
  <line x1="672" y1="235" x2="456" y2="235" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="456,235 468,229 468,241" fill="#C8CAD4"/>

  <!-- TEAMLEITUNG (unten Mitte) -->
  <rect x="296" y="308" width="188" height="62" fill="#EDEDF3" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="296" y="308" width="188" height="4" fill="#1F2C56"/>
  <text x="390" y="330" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2" text-anchor="middle">TEAMLEITUNG</text>
  <line x1="316" y1="336" x2="468" y2="336" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="390" y="351" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3" text-anchor="middle">„Standards einhalten</text>
  <text x="390" y="364" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3" text-anchor="middle">und Melde-Fristen"</text>

  <!-- Pfeil Teamleitung zur Assistenz -->
  <line x1="390" y1="308" x2="390" y2="273" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="390,273 384,285 396,285" fill="#C8CAD4"/>

  <!-- ══════════════════════════════════════════════
       DREI STEUERUNGSBEGRIFFE (rechter Block)
       x=510–820, y=100–308
       ══════════════════════════════════════════════ -->

  <!-- Trennlinie vertikal angedeutet -->
  <line x1="510" y1="100" x2="510" y2="300" stroke="#E2E3E8" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Begriff 1: Rollenklarheit -->
  <rect x="520" y="100" width="300" height="58" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="520" y="100" width="4" height="58" fill="#8898C4"/>
  <text x="536" y="120" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2" font-weight="500">ROLLENKLARHEIT</text>
  <text x="536" y="134" class="mono" font-size="7.5" fill="#7A8099" letter-spacing="0.5">Ist klar, wer was übernimmt?</text>
  <text x="536" y="150" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3">Eindeutige Zuständigkeiten senken Reibung</text>

  <!-- Begriff 2: Rollenkonflikt -->
  <rect x="520" y="172" width="300" height="58" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="520" y="172" width="4" height="58" fill="#3D5494"/>
  <text x="536" y="192" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2" font-weight="500">ROLLENKONFLIKT</text>
  <text x="536" y="206" class="mono" font-size="7.5" fill="#7A8099" letter-spacing="0.5">Widersprüchliche Anforderungen</text>
  <text x="536" y="222" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3">z. B. zwei Berater wollen gleichzeitig „sofort"</text>

  <!-- Begriff 3: Rollenaushandlung (GOLD hervorgehoben) -->
  <rect x="520" y="244" width="300" height="64" fill="#D9C089"/>
  <rect x="520" y="244" width="300" height="64" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="520" y="244" width="4" height="64" fill="#1F2C56"/>
  <text x="536" y="264" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2" font-weight="500">ROLLENAUSHANDLUNG</text>
  <text x="706" y="252" class="mono" font-size="7" fill="#3D5494" letter-spacing="1" text-anchor="middle">AKTIVER HEBEL</text>
  <text x="536" y="279" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.3">Erwartungen werden aktiv besprochen,</text>
  <text x="536" y="293" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.3">nicht einfach vermutet oder ausgehalten</text>

  <!-- Verbindungspfeil von Assistenz zu Steuerungsbegriff-Block -->
  <line x1="456" y1="213" x2="516" y2="195" stroke="#D9C089" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=388–456)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="388" width="780" height="56" fill="#EAD9A8"/>
  <rect x="40" y="388" width="780" height="56" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="388" width="4"   height="56" fill="#D9C089"/>
  <text x="58" y="407" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">GRUNDREGEL: Klare Absprachen ersetzen ständige Rückfragen.</text>
  <text x="58" y="423" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Erwartungen aushandeln, nicht vermuten. Im Rollengeflecht entstehen Konflikte nicht wegen schlechten Willens –</text>
  <text x="58" y="437" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">sondern wegen unklarer Zuständigkeiten. Rollenaushandlung macht sie sichtbar und lösbar.</text>

  <!-- Baseline -->
  <line x1="40" y1="462" x2="820" y2="462" stroke="#15192B" stroke-width="1"/>

  <!-- Quelle -->
  <text x="40" y="478" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">role set – Katz &amp; Kahn (1978) · Modul VA07</text>
  <text x="820" y="478" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Katz, D. &amp; Kahn, R. L. (1978). The Social Psychology of Organizations (2nd ed.). Wiley.</text>
</svg>
