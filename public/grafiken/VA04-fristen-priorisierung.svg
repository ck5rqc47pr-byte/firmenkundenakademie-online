<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">§ 18 KWG · MARISK BT 2.1 · MODUL VA04 · WIEDERVORLAGE, FRISTEN UND DATENQUALITÄT STEUERN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Fristen priorisieren: Risikoart schlägt Zeitnähe</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Die vier Fristentypen – und warum § 18-Befunde immer Priorität 1 haben</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 1: Vier Fristentypen als Kacheln (y=104–210)
       Breite: 4 × 183 + 3 × 14 = 774 → x-Start 40
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 1: Offenlegung § 18 — AKZENT-HERVORHEBUNG (Gold) -->
  <rect x="40"  y="104" width="183" height="126" fill="#D9C089"/>
  <rect x="40"  y="104" width="183" height="126" fill="none" stroke="#1F2C56" stroke-width="2"/>
  <rect x="40"  y="104" width="183" height="4" fill="#1F2C56"/>
  <text x="56"  y="126" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">01 · OFFENLEGUNG</text>
  <text x="56"  y="139" class="mono" font-size="8" fill="#3D5494" letter-spacing="1">§ 18 KWG</text>
  <line x1="56" y1="146" x2="207" y2="146" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="56"  y="162" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">ab 750.000 EUR:</text>
  <text x="56"  y="176" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">· Jahresabschlüsse</text>
  <text x="56"  y="190" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">· BWA / Saldenliste</text>
  <text x="56"  y="204" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">· Selbstauskunft</text>
  <text x="56"  y="220" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">Marktfolge-Meldepflicht</text>

  <!-- KACHEL 2: Sicherheiten — Mid-Primary -->
  <rect x="237" y="104" width="183" height="126" fill="#3D5494"/>
  <text x="253" y="126" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">02 · SICHERHEITEN</text>
  <line x1="253" y1="133" x2="404" y2="133" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="253" y="150" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Befristete Bürgschaft</text>
  <text x="253" y="164" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Wertnachweis</text>
  <text x="253" y="178" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Versicherungsnachweis</text>
  <text x="253" y="192" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Grundbucheintrag</text>
  <text x="253" y="215" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Wertverlust bei Ablauf</text>

  <!-- KACHEL 3: Vertrag / Konditionen — Navy -->
  <rect x="434" y="104" width="183" height="126" fill="#1F2C56"/>
  <text x="450" y="126" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">03 · VERTRAG</text>
  <line x1="450" y1="133" x2="601" y2="133" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="450" y="150" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Auslaufende Zinsbindung</text>
  <text x="450" y="164" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Befristete Kreditlinie</text>
  <text x="450" y="178" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Konditionen-Review</text>
  <text x="450" y="192" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Prolongation</text>
  <text x="450" y="215" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Rechtzeitig verlängern</text>

  <!-- KACHEL 4: Auflagen — Hell / bg-2 -->
  <rect x="631" y="104" width="189" height="126" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="647" y="126" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">04 · AUFLAGEN</text>
  <line x1="647" y1="133" x2="804" y2="133" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="647" y="150" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Nachweise aus Beschluss</text>
  <text x="647" y="164" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Verwendungsnachweise</text>
  <text x="647" y="178" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Fortschrittsberichte</text>
  <text x="647" y="192" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Bauzwischennachweise</text>
  <text x="647" y="215" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Kreditbeschluss-Pflicht</text>

  <!-- ══════════════════════════════════════════════
       PRIORITÄTSLEITER (y=248–380)
       ══════════════════════════════════════════════ -->

  <!-- Überschrift Leiter -->
  <text x="40" y="246" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">PRIORISIERUNGSREGEL</text>
  <line x1="40" y1="252" x2="820" y2="252" stroke="#E2E3E8" stroke-width="1"/>

  <!-- PRIORITÄT 1: § 18-Befund — Rot-Akzent -->
  <rect x="40"  y="260" width="780" height="36" fill="#7A1C1C"/>
  <rect x="40"  y="260" width="780" height="36" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <rect x="40"  y="260" width="4"   height="36" fill="#D9C089"/>
  <!-- Priorität-Badge -->
  <rect x="52" y="268" width="56" height="18" fill="#D9C089"/>
  <text x="80" y="281" class="mono" font-size="8" fill="#15192B" letter-spacing="1" text-anchor="middle" font-weight="500">PRIO 1</text>
  <text x="120" y="275" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">§ 18-Offenlegungsbefund — regulatorisch kritisch</text>
  <text x="120" y="288" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">Immer sofort, unabhängig von der Restlaufzeit · Marktfolge-Meldepflicht bei Überfälligkeit</text>

  <!-- PRIORITÄT 2: Sicherheiten-Fristablauf -->
  <rect x="40"  y="300" width="780" height="30" fill="#1F2C56"/>
  <rect x="40"  y="300" width="4"   height="30" fill="#8898C4"/>
  <rect x="52"  y="308" width="56" height="14" fill="#8898C4"/>
  <text x="80" y="319" class="mono" font-size="7" fill="#15192B" letter-spacing="1" text-anchor="middle" font-weight="500">PRIO 2</text>
  <text x="120" y="317" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">Sicherheiten-Fristablauf — Wertverlust oder Enthaftung droht</text>
  <text x="120" y="326" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Befristete Bürgschaft, Versicherungsablauf, Wertgutachten</text>

  <!-- PRIORITÄT 3: Vertragsfristen -->
  <rect x="40"  y="334" width="780" height="28" fill="#3D5494"/>
  <rect x="40"  y="334" width="4"   height="28" fill="#C8CAD4"/>
  <rect x="52"  y="341" width="56" height="14" fill="#C8CAD4"/>
  <text x="80" y="352" class="mono" font-size="7" fill="#1F2C56" letter-spacing="1" text-anchor="middle" font-weight="500">PRIO 3</text>
  <text x="120" y="350" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">Vertragsfristen — Prolongation, Konditions-Review</text>
  <text x="120" y="359" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Zinsbindungsende, befristete Kreditlinien</text>

  <!-- PRIORITÄT 4: Auflagen -->
  <rect x="40"  y="366" width="780" height="26" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40"  y="366" width="4"   height="26" fill="#C8CAD4"/>
  <rect x="52"  y="373" width="56" height="12" fill="#C8CAD4"/>
  <text x="80" y="383" class="mono" font-size="7" fill="#1F2C56" letter-spacing="1" text-anchor="middle" font-weight="500">PRIO 4</text>
  <text x="120" y="382" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Auflagen aus Kreditbeschluss — Nachweise und Fortschrittsberichte</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=402–460)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="402" width="780" height="56" fill="#EAD9A8"/>
  <rect x="40" y="402" width="780" height="56" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="402" width="4"   height="56" fill="#D9C089"/>
  <text x="58" y="421" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">GRUNDREGEL: Risikoart schlägt Zeitnähe.</text>
  <text x="58" y="437" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">§ 18-Befunde immer zuerst — auch wenn andere Fristen näher liegen. Alles ins System — mit Frist und</text>
  <text x="58" y="451" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Verantwortlichem — und regelmäßig durchgehen: wöchentlich die nächsten 4 Wochen im Blick.</text>

  <!-- Baseline -->
  <line x1="40" y1="474" x2="820" y2="474" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="490" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">§ 18 KWG · Modul VA04</text>
  <text x="820" y="490" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Becker, J. &amp; Peppmeier, A. (2018). Bankbetriebslehre (11. Aufl.). NWB.</text>
</svg>
