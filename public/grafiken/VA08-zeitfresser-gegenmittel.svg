<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">SELBSTORGANISATION · MODUL VA08 · DREI TECHNIKEN GEGEN ZERFASERTES ARBEITEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="68" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Drei Gegenmittel gegen zerfasertes Arbeiten</text>
  <text x="40" y="84" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Bündeln · Bearbeitungsblock · 2-Minuten-Regel</text>

  <!-- ═══════════════════════════════════════════
       DREI KACHELN  (y=104–320)
       Breite je 241 + Abstand 13 → Start 40
       ═══════════════════════════════════════════ -->

  <!-- ─── KACHEL 1: BÜNDELN — Navy ─── -->
  <rect x="40" y="104" width="241" height="216" fill="#1F2C56"/>
  <rect x="40" y="104" width="241" height="5" fill="#D9C089"/>
  <!-- Nummer -->
  <text x="56" y="130" class="serif" font-size="40" fill="#D9C089" font-style="italic" opacity="0.35">01</text>
  <text x="56" y="152" class="mono" font-size="10" fill="#D9C089" letter-spacing="2">BÜNDELN</text>
  <line x1="56" y1="159" x2="265" y2="159" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <!-- Kurzregel -->
  <text x="56" y="178" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">Gleichartige Aufgaben</text>
  <text x="56" y="191" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">am Stück erledigen.</text>
  <!-- Einsatzfall -->
  <text x="56" y="214" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5">Einsatz:</text>
  <text x="56" y="228" class="mono" font-size="8" fill="rgba(248,248,250,0.80)" letter-spacing="0.5">Mehrere gleichartige</text>
  <text x="56" y="241" class="mono" font-size="8" fill="rgba(248,248,250,0.80)" letter-spacing="0.5">Mini-Aufgaben</text>
  <!-- Beispiel -->
  <text x="56" y="264" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">Beispiel:</text>
  <text x="56" y="278" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">Alle Wiedervorlagen</text>
  <text x="56" y="291" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">täglich im Bearbeitungsblock</text>
  <text x="56" y="304" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">gemeinsam prüfen</text>

  <!-- ─── KACHEL 2: BEARBEITUNGSBLOCK — Gold/Akzent ─── -->
  <rect x="294" y="104" width="241" height="216" fill="#D9C089"/>
  <rect x="294" y="104" width="241" height="5" fill="#1F2C56"/>
  <text x="310" y="130" class="serif" font-size="40" fill="#1F2C56" font-style="italic" opacity="0.20">02</text>
  <text x="310" y="152" class="mono" font-size="10" fill="#1F2C56" letter-spacing="2">BEARBEITUNGSBLOCK</text>
  <line x1="310" y1="159" x2="519" y2="159" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="310" y="178" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5" font-weight="500">Störungsarme Fokuszeit</text>
  <text x="310" y="191" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5" font-weight="500">fest im Tagesplan einplanen.</text>
  <text x="310" y="214" class="mono" font-size="8" fill="#3D5494" letter-spacing="0.5">Einsatz:</text>
  <text x="310" y="228" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Konzentrierte</text>
  <text x="310" y="241" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Bearbeitungsaufgaben</text>
  <text x="310" y="264" class="mono" font-size="8" fill="#3D5494" letter-spacing="0.5">Beispiel:</text>
  <text x="310" y="278" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5">Täglich 45 Minuten</text>
  <text x="310" y="291" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5">ohne Telefon – braucht</text>
  <text x="310" y="304" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5">Teamabsprache (Vertretung)</text>

  <!-- ─── KACHEL 3: 2-MINUTEN-REGEL — Mid-Primary ─── -->
  <rect x="547" y="104" width="273" height="216" fill="#3D5494"/>
  <rect x="547" y="104" width="273" height="5" fill="#8898C4"/>
  <text x="563" y="130" class="serif" font-size="40" fill="#8898C4" font-style="italic" opacity="0.35">03</text>
  <text x="563" y="152" class="mono" font-size="10" fill="#D9C089" letter-spacing="2">2-MINUTEN-REGEL</text>
  <line x1="563" y1="159" x2="804" y2="159" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="563" y="178" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">Was in unter zwei Minuten</text>
  <text x="563" y="191" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" font-weight="500">erledigt ist: sofort tun.</text>
  <text x="563" y="214" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5">Einsatz:</text>
  <text x="563" y="228" class="mono" font-size="8" fill="rgba(248,248,250,0.80)" letter-spacing="0.5">Kurze Einzelaufgaben</text>
  <text x="563" y="241" class="mono" font-size="8" fill="rgba(248,248,250,0.80)" letter-spacing="0.5">(kein Aufwand fürs Einplanen)</text>
  <text x="563" y="264" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">Beispiel:</text>
  <text x="563" y="278" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">Alles über 2 Minuten</text>
  <text x="563" y="291" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">terminieren statt liegen</text>
  <text x="563" y="304" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">lassen</text>

  <!-- ═══════════════════════════════════════════
       ZUSAMMENSPIEL-LEISTE (y=336–378)
       ═══════════════════════════════════════════ -->
  <text x="40" y="334" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">SO GREIFEN DIE DREI TECHNIKEN INEINANDER</text>
  <line x1="40" y1="340" x2="820" y2="340" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Verbindungsstreifen -->
  <rect x="40"  y="348" width="241" height="28" fill="#1F2C56"/>
  <text x="56"  y="366" class="mono" font-size="8" fill="#D9C089" letter-spacing="1">Bündeln: ab 3 gleichartigen Aufgaben</text>

  <!-- Verbindungspfeil 1 (gezeichnet) -->
  <line x1="281" y1="362" x2="293" y2="362" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="294,362 289,358 289,366" fill="#C8CAD4"/>

  <rect x="294" y="348" width="241" height="28" fill="#D9C089"/>
  <text x="310" y="366" class="mono" font-size="8" fill="#1F2C56" letter-spacing="1">Block: schützt Bündel-Zeit täglich</text>

  <!-- Verbindungspfeil 2 -->
  <line x1="535" y1="362" x2="546" y2="362" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="547,362 542,358 542,366" fill="#C8CAD4"/>

  <rect x="547" y="348" width="273" height="28" fill="#3D5494"/>
  <text x="563" y="366" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="1">2-Min.-Regel: Restaufgaben sofort lösen</text>

  <!-- ═══════════════════════════════════════════
       MERKKASTEN
       ═══════════════════════════════════════════ -->
  <rect x="40" y="394" width="780" height="58" fill="#EAD9A8"/>
  <rect x="40" y="394" width="780" height="58" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="394" width="4"   height="58" fill="#D9C089"/>
  <text x="58" y="413" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">GRUNDREGEL: 2-Minuten-Regel und Bündeln schließen sich nicht aus.</text>
  <text x="58" y="429" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Aus zehn Zwei-Minuten-Aufgaben werden sonst zwanzig Minuten zerfasertes Arbeiten. Der Bearbeitungsblock</text>
  <text x="58" y="443" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">braucht die Freigabe der Teamleitung – Telefonvertretung muss vorab geklärt sein.</text>

  <!-- Baseline -->
  <line x1="40" y1="472" x2="820" y2="472" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="488" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Selbstorganisation · Modul VA08</text>
  <text x="820" y="488" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Allen, D. (2001). Getting Things Done. Penguin Books.</text>
</svg>
