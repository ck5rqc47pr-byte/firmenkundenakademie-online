<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">§ 19 KWG · ART. 392 CRR · § 3 GwG · MODUL VA11 · EINHEITEN UND GELDWÄSCHEPRÄVENTION</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Beteiligungsstruktur lesen: Einheit bilden, wB durchrechnen</text>
  <text x="40" y="87" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Zwei Prüffragen: Kreditnehmereinheit (§ 19 KWG) und wirtschaftlich Berechtigter (§ 3 GwG)</text>

  <!-- ══════════════════════════════════════════════
       LINKE SPALTE: KREDITNEHMEREINHEIT (x=40–400, y=102–330)
       ══════════════════════════════════════════════ -->

  <!-- Spaltenheader links -->
  <rect x="40" y="102" width="360" height="24" fill="#1F2C56"/>
  <text x="220" y="118" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" text-anchor="middle">KREDITNEHMEREINHEIT · § 19 ABS. 2 KWG</text>

  <!-- Zwei Tatbestände -->
  <!-- Kasten A: Beherrschung -->
  <rect x="40" y="134" width="168" height="72" fill="#3D5494"/>
  <rect x="40" y="134" width="168" height="4" fill="#D9C089"/>
  <text x="124" y="152" class="mono" font-size="8" fill="#D9C089" letter-spacing="1.5" text-anchor="middle">TATBESTAND A</text>
  <text x="124" y="165" class="mono" font-size="9" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">Beherrschung</text>
  <line x1="56" y1="172" x2="192" y2="172" stroke="#8898C4" stroke-width="0.5" opacity="0.5"/>
  <text x="124" y="185" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Mehrheitsbeteiligung oder</text>
  <text x="124" y="197" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Stimmrechtsmehrheit (§ 290 HGB)</text>

  <!-- ODER-Verbinder -->
  <rect x="218" y="156" width="44" height="22" fill="#D9C089"/>
  <text x="240" y="171" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" text-anchor="middle" font-weight="500">ODER</text>

  <!-- Kasten B: Wirtschaftliche Abhängigkeit -->
  <rect x="272" y="134" width="128" height="72" fill="#3D5494"/>
  <rect x="272" y="134" width="128" height="4" fill="#D9C089"/>
  <text x="336" y="152" class="mono" font-size="8" fill="#D9C089" letter-spacing="1.5" text-anchor="middle">TATBESTAND B</text>
  <text x="336" y="165" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle" font-weight="500">Wirtschaftl. Abhäng.</text>
  <line x1="288" y1="172" x2="384" y2="172" stroke="#8898C4" stroke-width="0.5" opacity="0.5"/>
  <text x="336" y="185" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">Finanzielle Verflechtung</text>
  <text x="336" y="197" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">ohne Beherrschung</text>

  <!-- Pfeil nach unten zu Ergebnis -->
  <line x1="220" y1="206" x2="220" y2="228" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="215,228 220,240 225,228" fill="#C8CAD4"/>

  <!-- Ergebnis-Kasten Einheit -->
  <rect x="40" y="240" width="360" height="36" fill="#D9C089" stroke="#1F2C56" stroke-width="1"/>
  <text x="220" y="255" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" text-anchor="middle" font-weight="500">Greift ein Tatbestand: eine Kreditnehmereinheit</text>
  <text x="220" y="268" class="mono" font-size="8" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">Großkredit ab 10 % der anrechenbaren Eigenmittel (Art. 392 CRR)</text>

  <!-- Kernfrage -->
  <rect x="40" y="284" width="360" height="28" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <rect x="40" y="284" width="4" height="28" fill="#1F2C56"/>
  <text x="58" y="296" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Kernfrage:</text>
  <text x="130" y="296" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Wer gehört zusammen in die Einheit?</text>
  <text x="58" y="308" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Alle Meldepflichten aggregiert über die Einheit, nicht je Einzelgesellschaft</text>

  <!-- ══════════════════════════════════════════════
       RECHTE SPALTE: WIRTSCHAFTLICH BERECHTIGTER (x=420–820, y=102–330)
       ══════════════════════════════════════════════ -->

  <!-- Spaltenheader rechts -->
  <rect x="420" y="102" width="400" height="24" fill="#1F2C56"/>
  <text x="620" y="118" class="mono" font-size="8" fill="#D9C089" letter-spacing="2" text-anchor="middle">WIRTSCHAFTLICH BERECHTIGTER · § 3 ABS. 2 GwG</text>

  <!-- Schwellen-Kasten -->
  <rect x="420" y="134" width="400" height="22" fill="#3D5494"/>
  <text x="620" y="149" class="mono" font-size="8" fill="#F8F8FA" letter-spacing="0.5" text-anchor="middle">Schwelle: Direkte oder indirekte Beteiligung über 25 % — Ketten durchrechnen</text>

  <!-- Organigramm: Rechenbeispiel -->
  <!-- Natürliche Person oben -->
  <rect x="510" y="166" width="220" height="34" fill="#1F2C56" stroke="#D9C089" stroke-width="1.5"/>
  <text x="620" y="181" class="mono" font-size="8" fill="#D9C089" letter-spacing="1" text-anchor="middle" font-weight="500">NATÜRLICHE PERSON</text>
  <text x="620" y="193" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">hält 80 % an Holding GmbH</text>

  <!-- Pfeil von Nat. Person zu Holding -->
  <line x1="620" y1="200" x2="620" y2="216" stroke="#D9C089" stroke-width="1.5"/>
  <polygon points="615,216 620,228 625,216" fill="#D9C089"/>
  <text x="640" y="214" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">80 %</text>

  <!-- Holding GmbH -->
  <rect x="510" y="228" width="220" height="34" fill="#3D5494"/>
  <text x="620" y="243" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5" text-anchor="middle" font-weight="500">HOLDING GMBH</text>
  <text x="620" y="255" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">hält 70 % an Tochter GmbH</text>

  <!-- Pfeil von Holding zu Tochter -->
  <line x1="620" y1="262" x2="620" y2="278" stroke="#D9C089" stroke-width="1.5"/>
  <polygon points="615,278 620,290 625,278" fill="#D9C089"/>
  <text x="640" y="276" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">70 %</text>

  <!-- Tochter GmbH -->
  <rect x="510" y="290" width="220" height="34" fill="#3D5494"/>
  <text x="620" y="305" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5" text-anchor="middle" font-weight="500">TOCHTER GMBH</text>
  <text x="620" y="317" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5" text-anchor="middle">(zu prüfendes Unternehmen)</text>

  <!-- Rechenkasten rechts -->
  <rect x="742" y="220" width="78" height="72" fill="#D9C089" stroke="#1F2C56" stroke-width="1"/>
  <text x="781" y="237" class="mono" font-size="7" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle">80 % × 70 %</text>
  <line x1="754" y1="243" x2="808" y2="243" stroke="#1F2C56" stroke-width="0.5"/>
  <text x="781" y="256" class="mono" font-size="10" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">= 56 %</text>
  <text x="781" y="270" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">über 25 %</text>
  <text x="781" y="283" class="mono" font-size="7" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">wB der Tochter</text>

  <!-- Kein-wB Hinweis -->
  <rect x="420" y="228" width="80" height="58" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="460" y="249" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">Zweite</text>
  <text x="460" y="261" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">Beteiligung</text>
  <text x="460" y="273" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5" text-anchor="middle">unter 25 %</text>
  <text x="460" y="285" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">kein wB</text>

  <!-- ══════════════════════════════════════════════
       TRENNLINIE ZWISCHEN DEN ZWEI SPALTEN
       ══════════════════════════════════════════════ -->
  <line x1="410" y1="102" x2="410" y2="320" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=338–430)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="338" width="780" height="72" fill="#EAD9A8"/>
  <rect x="40" y="338" width="780" height="72" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="338" width="4" height="72" fill="#D9C089"/>
  <text x="58" y="356" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">MERKREGEL: Wer die Struktur durchschaut, erkennt das Risiko.</text>
  <text x="58" y="372" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Über 25 % durchgerechnet = wirtschaftlich Berechtigter; unter 25 % nicht. Ketten bis zur natürlichen Person</text>
  <text x="58" y="387" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">vollständig zurückverfolgen. Transparenzregister abgleichen (§ 23a GwG Unstimmigkeitsmeldung bei</text>
  <text x="58" y="402" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Abweichungen). Einheit nach § 19 KWG und wB nach § 3 GwG unabhängig voneinander prüfen.</text>

  <!-- Baseline -->
  <line x1="40" y1="428" x2="820" y2="428" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="444" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">§ 19 KWG · Art. 392 CRR · § 3 GwG · Modul VA11</text>
  <text x="820" y="444" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">BaFin (2024). Auslegungs- und Anwendungshinweise zum GwG. Bundesanstalt für Finanzdienstleistungsaufsicht.</text>
</svg>
