<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="560" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">WIRKUNGSKETTE · MODUL 26 · ESG IM KREDITGESCHÄFT</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <text x="40" y="60" class="mono" font-size="9" fill="#7A8099" letter-spacing="1">VOM ESG-EREIGNIS ZUR KAPITALDIENSTFÄHIGKEIT · TRANSITIONSRISIKO KONKRET</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- STUFE 1: ESG-Ereignis -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="82" width="130" height="64" fill="#1F2C56"/>
  <text x="105" y="103" class="mono" font-size="8" fill="#8898C4" letter-spacing="1" text-anchor="middle">STUFE 1</text>
  <text x="105" y="121" class="serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="500">ESG-Ereignis</text>
  <text x="105" y="137" class="mono" font-size="8" fill="#D9C089" text-anchor="middle" letter-spacing="0.5">CO₂-Maut · Euro 5</text>

  <!-- Pfeil 1→2 (Mitte) -->
  <line x1="170" y1="114" x2="192" y2="114" stroke="#C8CAD4" stroke-width="2"/>
  <polygon points="192,109 202,114 192,119" fill="#C8CAD4"/>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- STUFE 2: Geschäftsmodell — Verzweigung (Kernaussage) -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- Hauptbox mit Accent-Rahmen (hervorgehoben) -->
  <rect x="202" y="73" width="148" height="82" fill="#FFFFFF" stroke="#D9C089" stroke-width="2"/>
  <rect x="202" y="73" width="6" height="82" fill="#D9C089"/>
  <text x="282" y="95" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="1" text-anchor="middle">STUFE 2 · SCHLÜSSEL</text>
  <text x="282" y="114" class="serif" font-size="13" fill="#1F2C56" text-anchor="middle" font-weight="500">Geschäftsmodell</text>
  <text x="282" y="131" class="mono" font-size="8" fill="#7A8099" text-anchor="middle" letter-spacing="0.3">Anpassungskapazität</text>
  <text x="282" y="145" class="mono" font-size="8" fill="#7A8099" text-anchor="middle" letter-spacing="0.3">Flotte · Investitionskraft</text>

  <!-- Verzweigungspfeil oben (Angepasst) -->
  <line x1="350" y1="100" x2="380" y2="84" stroke="#3D5494" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="377,79 385,87 378,89" fill="#3D5494"/>

  <!-- Verzweigungspfeil unten (Exponiert) -->
  <line x1="350" y1="128" x2="380" y2="148" stroke="#B33A3A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="377,152 385,145 382,154" fill="#B33A3A"/>

  <!-- Pfeil-Label oben -->
  <text x="360" y="78" class="mono" font-size="8" fill="#3D5494" letter-spacing="0.5">moderner Fuhrpark</text>

  <!-- Pfeil-Label unten -->
  <text x="360" y="162" class="mono" font-size="8" fill="#B33A3A" letter-spacing="0.5">61 % Euro 5, keine Planung</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- STUFE 3: Cashflow — zwei Ausprägungen -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- Obere Variante (geringe Belastung) -->
  <rect x="385" y="68" width="128" height="46" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="1"/>
  <text x="449" y="87" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">CASHFLOW (STABIL)</text>
  <text x="449" y="103" class="serif" font-size="12" fill="#1F2C56" text-anchor="middle">Mehrkosten tragbar</text>

  <!-- Untere Variante (hohe Belastung) -->
  <rect x="385" y="128" width="128" height="46" fill="#FFF0F0" stroke="#E2C8C8" stroke-width="1"/>
  <text x="449" y="147" class="mono" font-size="7" fill="#B33A3A" letter-spacing="0.5" text-anchor="middle">CASHFLOW (BELASTET)</text>
  <text x="449" y="163" class="serif" font-size="12" fill="#7A1515" text-anchor="middle">EBITDA sinkt −44 T€</text>

  <!-- Wiedervereinigungspfeile → Stufe 4 -->
  <line x1="513" y1="91" x2="545" y2="110" stroke="#C8CAD4" stroke-width="1.5"/>
  <line x1="513" y1="151" x2="545" y2="134" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="542,106 550,113 543,116" fill="#C8CAD4"/>
  <polygon points="542,138 550,131 543,128" fill="#C8CAD4"/>

  <!-- Stufe 3 Label (zentriert zwischen den beiden Boxen) -->
  <text x="449" y="120" class="mono" font-size="7" fill="#7A8099" letter-spacing="1" text-anchor="middle">STUFE 3</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- STUFE 4: Kapitaldienstfähigkeit -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="550" y="82" width="130" height="64" fill="#3D5494"/>
  <text x="615" y="103" class="mono" font-size="8" fill="#8898C4" letter-spacing="1" text-anchor="middle">STUFE 4</text>
  <text x="615" y="119" class="serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">Kapitaldienstfähigkeit</text>
  <text x="615" y="136" class="mono" font-size="8" fill="#D9C089" text-anchor="middle" letter-spacing="0.3">DSCR 1,77 → 1,38</text>

  <!-- Pfeil 4→5 -->
  <line x1="680" y1="114" x2="700" y2="114" stroke="#C8CAD4" stroke-width="2"/>
  <polygon points="700,109 710,114 700,119" fill="#C8CAD4"/>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- STUFE 5: Rating / PD -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="710" y="82" width="110" height="64" fill="#15192B"/>
  <text x="765" y="103" class="mono" font-size="8" fill="#8898C4" letter-spacing="1" text-anchor="middle">STUFE 5</text>
  <text x="765" y="119" class="serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">Rating / PD</text>
  <text x="765" y="136" class="mono" font-size="8" fill="#D9C089" text-anchor="middle" letter-spacing="0.3">Bepreisung · Laufzeit</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- ERLÄUTERUNGEN UNTEN (je Stufe) -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <line x1="40" y1="178" x2="820" y2="178" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Erläuterungsboxen -->
  <!-- S1 -->
  <rect x="40" y="188" width="130" height="90" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <text x="105" y="207" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">TRANSITIONSRISIKO</text>
  <text x="55" y="224" class="serif" font-size="11" fill="#3D4460">EU-Verordnung:</text>
  <text x="55" y="240" class="serif" font-size="11" fill="#3D4460">CO₂-Maut­zuschlag</text>
  <text x="55" y="256" class="serif" font-size="11" fill="#3D4460">0,04 €/km für</text>
  <text x="55" y="272" class="serif" font-size="11" fill="#3D4460">Euro 5 ab 2027</text>

  <!-- S2 -->
  <rect x="202" y="188" width="148" height="90" fill="#FFFDF5" stroke="#D9C089" stroke-width="1"/>
  <text x="276" y="207" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="0.5" text-anchor="middle" font-weight="500">DIFFERENZIERUNGSPUNKT</text>
  <text x="216" y="224" class="serif" font-size="11" fill="#3D4460">Anpassungskapazität</text>
  <text x="216" y="240" class="serif" font-size="11" fill="#3D4460">entscheidet: Flotten­</text>
  <text x="216" y="256" class="serif" font-size="11" fill="#3D4460">alter, Investitions­</text>
  <text x="216" y="272" class="serif" font-size="11" fill="#3D4460">kraft, Marktspielraum</text>

  <!-- S3 -->
  <rect x="385" y="188" width="128" height="90" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <text x="449" y="207" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">OPERATIVE WIRKUNG</text>
  <text x="399" y="224" class="serif" font-size="11" fill="#3D4460">Mehrkosten mindern</text>
  <text x="399" y="240" class="serif" font-size="11" fill="#3D4460">EBITDA; Flottenumbau</text>
  <text x="399" y="256" class="serif" font-size="11" fill="#3D4460">bindet Investitions­</text>
  <text x="399" y="272" class="serif" font-size="11" fill="#3D4460">mittel gleichzeitig</text>

  <!-- S4 -->
  <rect x="550" y="188" width="130" height="90" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <text x="615" y="207" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">DSCR-SZENARIO</text>
  <text x="564" y="224" class="serif" font-size="11" fill="#3D4460">Szenario A (kein Inv.):</text>
  <text x="564" y="240" class="serif" font-size="11" fill="#B33A3A">DSCR 1,66</text>
  <text x="564" y="256" class="serif" font-size="11" fill="#3D4460">Szenario B (Teilumbau):</text>
  <text x="564" y="272" class="serif" font-size="11" fill="#3D5494">DSCR 1,38 (&gt; 1,20)</text>

  <!-- S5 -->
  <rect x="710" y="188" width="110" height="90" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <text x="765" y="207" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle" font-weight="500">KREDITKONDITIONEN</text>
  <text x="724" y="224" class="serif" font-size="11" fill="#3D4460">Veränderte PD fließt</text>
  <text x="724" y="240" class="serif" font-size="11" fill="#3D4460">in Bepreisung ein —</text>
  <text x="724" y="256" class="serif" font-size="11" fill="#3D4460">Effekt bei langen</text>
  <text x="724" y="272" class="serif" font-size="11" fill="#3D4460">Laufzeiten stärker</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- KERNAUSSAGE-BANNER -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="296" width="780" height="44" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="1"/>
  <rect x="40" y="296" width="6" height="44" fill="#D9C089"/>
  <text x="60" y="314" class="mono" font-size="8" fill="#9A7B2E" letter-spacing="1">KERNAUSSAGE DES MODULS</text>
  <text x="60" y="331" class="serif" font-size="13" fill="#1F2C56">Die Kette ist kein Automatismus. Stufe 2 — die Anpassungskapazität des Geschäftsmodells — entscheidet, ob ein ESG-Ereignis</text>
  <text x="60" y="347" class="serif" font-size="13" fill="#1F2C56">zum Kreditrisiko wird. Hier unterscheiden sich Kunden — und hier setzt die Beratung an.</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- ZEITHORIZONT-BALKEN -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <rect x="40" y="358" width="780" height="80" fill="#FFFFFF" stroke="#E2E3E8" stroke-width="1"/>
  <text x="60" y="377" class="mono" font-size="9" fill="#7A8099" letter-spacing="1">ZEITHORIZONT · M04 vs. M26</text>

  <!-- M04 Balken -->
  <rect x="60" y="386" width="160" height="16" fill="#8898C4"/>
  <text x="64" y="398" class="mono" font-size="8" fill="#FFFFFF" letter-spacing="0.3">M04 · 6–18 Monate · Liquidität</text>

  <!-- M26 Balken (länger) -->
  <rect x="60" y="408" width="680" height="16" fill="#1F2C56"/>
  <text x="64" y="420" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.3">M26 · 10-Jahres-Horizont · Strukturelles Transformationsrisiko · MaRisk AT 2.2 Tz. 8</text>

  <!-- Skala -->
  <text x="60" y="434" class="mono" font-size="7" fill="#B0B3C0">Heute</text>
  <text x="205" y="434" class="mono" font-size="7" fill="#B0B3C0">+18 M</text>
  <text x="420" y="434" class="mono" font-size="7" fill="#B0B3C0">+5 Jahre</text>
  <text x="720" y="434" class="mono" font-size="7" fill="#B0B3C0">+10 Jahre</text>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- BASELINE & QUELLE -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <line x1="40" y1="448" x2="820" y2="448" stroke="#15192B" stroke-width="1"/>
  <text x="40" y="462" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Wirkungskette nach TCFD (2017) · Delis, de Greiff, Iosifidi &amp; Ongena (2024) · BaFin MaRisk 9. Novelle (2026) · Fallzahlen: fiktiver Praxisfall Kramer &amp; Sohn GmbH</text>

</svg>
