<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">SERVQUAL · PARASURAMAN ET AL. 1988 · MODUL VA05 · PROFESSIONELL AM TELEFON UND IM SCHRIFTVERKEHR</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Das Servicetelefonat in vier Schritten</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Gesprächsstruktur für den Innendienst – verknüpft mit den SERVQUAL-Dimensionen</text>

  <!-- ══════════════════════════════════════════════
       ZEITSTRAHL-LINIE
       ══════════════════════════════════════════════ -->
  <line x1="40" y1="170" x2="820" y2="170" stroke="#C8CAD4" stroke-width="2"/>
  <!-- Pfeilspitze rechts -->
  <polygon points="824,170 816,165 816,175" fill="#C8CAD4"/>

  <!-- START-Punkt -->
  <circle cx="60" cy="170" r="5" fill="#1F2C56"/>
  <text x="60" y="193" class="mono" font-size="7" fill="#7A8099" letter-spacing="1" text-anchor="middle">START</text>

  <!-- SCHRITT-Kreise auf der Linie -->
  <!-- Schritt 1: x=190 -->
  <circle cx="190" cy="170" r="14" fill="#1F2C56"/>
  <text x="190" y="175" class="mono" font-size="10" fill="#F8F8FA" font-weight="500" text-anchor="middle">1</text>

  <!-- Schritt 2: x=390 — AKZENT-GOLD (Hebel) -->
  <circle cx="390" cy="170" r="18" fill="#D9C089"/>
  <circle cx="390" cy="170" r="18" fill="none" stroke="#1F2C56" stroke-width="2"/>
  <text x="390" y="176" class="mono" font-size="11" fill="#1F2C56" font-weight="500" text-anchor="middle">2</text>

  <!-- Schritt 3: x=590 -->
  <circle cx="590" cy="170" r="14" fill="#1F2C56"/>
  <text x="590" y="175" class="mono" font-size="10" fill="#F8F8FA" font-weight="500" text-anchor="middle">3</text>

  <!-- Schritt 4: x=780 -->
  <circle cx="780" cy="170" r="14" fill="#1F2C56"/>
  <text x="780" y="175" class="mono" font-size="10" fill="#F8F8FA" font-weight="500" text-anchor="middle">4</text>

  <!-- ══════════════════════════════════════════════
       SCHRITTE – OBERE KACHELN (y=100–155)
       Schritte 1 + 3 oben
       ══════════════════════════════════════════════ -->

  <!-- SCHRITT 1 oben: Melden -->
  <rect x="100" y="96" width="182" height="66" fill="#1F2C56"/>
  <text x="116" y="116" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">01 · MELDEN</text>
  <line x1="116" y1="122" x2="266" y2="122" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="116" y="137" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">Freundlich, mit Namen</text>
  <text x="116" y="151" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">und Haus – sofort erreichbar</text>
  <!-- Verbindungslinie -->
  <line x1="190" y1="162" x2="190" y2="156" stroke="#1F2C56" stroke-width="1.5"/>

  <!-- SERVQUAL-Tag Schritt 1 -->
  <rect x="100" y="200" width="182" height="18" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="191" y="212" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">Erreichbarkeit</text>
  <line x1="190" y1="184" x2="190" y2="200" stroke="#C8CAD4" stroke-width="1"/>

  <!-- SCHRITT 3 oben: Sachlage &amp; Lösung -->
  <rect x="500" y="96" width="182" height="66" fill="#1F2C56"/>
  <text x="516" y="116" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">03 · SACHLAGE &amp; LÖSUNG</text>
  <line x1="516" y1="122" x2="666" y2="122" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="516" y="137" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">Fakten klar erklären,</text>
  <text x="516" y="151" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">realistischen Weg aufzeigen</text>
  <!-- Verbindungslinie -->
  <line x1="590" y1="162" x2="590" y2="156" stroke="#1F2C56" stroke-width="1.5"/>

  <!-- SERVQUAL-Tag Schritt 3 -->
  <rect x="500" y="200" width="182" height="18" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="591" y="212" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">Leistungskompetenz</text>
  <line x1="590" y1="184" x2="590" y2="200" stroke="#C8CAD4" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════
       SCHRITTE – UNTERE KACHELN (y=228–320)
       Schritte 2 + 4 unten
       ══════════════════════════════════════════════ -->

  <!-- SCHRITT 2 unten: Zuhören &amp; Verständnis — AKZENT-GOLD (Hebel) -->
  <rect x="295" y="228" width="190" height="80" fill="#D9C089"/>
  <rect x="295" y="228" width="190" height="80" fill="none" stroke="#1F2C56" stroke-width="2"/>
  <rect x="295" y="228" width="190" height="4" fill="#1F2C56"/>
  <text x="311" y="250" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">02 · ZUHÖREN &amp; VERSTÄNDNIS</text>
  <text x="311" y="263" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">ENTSCHEIDENDER HEBEL</text>
  <line x1="311" y1="269" x2="469" y2="269" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="311" y="283" class="mono" font-size="8" fill="#15192B" letter-spacing="0.3">Ausreden lassen,</text>
  <text x="311" y="296" class="mono" font-size="8" fill="#15192B" letter-spacing="0.3">Anliegen spiegeln</text>
  <!-- Verbindungslinie -->
  <line x1="390" y1="184" x2="390" y2="228" stroke="#D9C089" stroke-width="1.5"/>

  <!-- SERVQUAL-Tag Schritt 2 — Beziehung vor Sache -->
  <rect x="295" y="314" width="190" height="22" fill="#EAD9A8" stroke="#D9C089" stroke-width="1"/>
  <text x="390" y="329" class="mono" font-size="7" fill="#1F2C56" letter-spacing="0.5" text-anchor="middle">Einfühlung · Beziehung vor Sache</text>
  <line x1="390" y1="308" x2="390" y2="314" stroke="#D9C089" stroke-width="1"/>

  <!-- SCHRITT 4 unten: Abschluss &amp; nächster Schritt -->
  <rect x="695" y="228" width="165" height="80" fill="#3D5494"/>
  <text x="711" y="248" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">04 · ABSCHLUSS</text>
  <text x="711" y="262" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">&amp; nächster Schritt</text>
  <line x1="711" y1="269" x2="844" y2="269" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="711" y="283" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">Konkreten Termin</text>
  <text x="711" y="296" class="mono" font-size="8" fill="rgba(248,248,250,0.90)" letter-spacing="0.3">und nächsten Schritt zusagen</text>
  <!-- Verbindungslinie -->
  <line x1="780" y1="184" x2="780" y2="228" stroke="#3D5494" stroke-width="1.5"/>

  <!-- SERVQUAL-Tag Schritt 4 -->
  <rect x="695" y="314" width="165" height="22" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="777" y="329" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5" text-anchor="middle">Zuverlässigkeit</text>
  <line x1="778" y1="308" x2="778" y2="314" stroke="#C8CAD4" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════
       SERVQUAL-Legende (y=352–376)
       ══════════════════════════════════════════════ -->
  <text x="40" y="360" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">SERVQUAL-DIMENSIONEN (Parasuraman et al. 1988):</text>
  <!-- Legende-Kacheln -->
  <rect x="40" y="368" width="12" height="10" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="58" y="378" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3">Erreichbarkeit (Schritt 1)</text>
  <rect x="210" y="368" width="12" height="10" fill="#D9C089" stroke="#1F2C56" stroke-width="1"/>
  <text x="228" y="378" class="mono" font-size="7.5" fill="#1F2C56" letter-spacing="0.3">Einfühlung (Schritt 2 · Hebel)</text>
  <rect x="420" y="368" width="12" height="10" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="438" y="378" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3">Leistungskompetenz (Schritt 3)</text>
  <rect x="650" y="368" width="12" height="10" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="668" y="378" class="mono" font-size="7.5" fill="#3D4460" letter-spacing="0.3">Zuverlässigkeit (Schritt 4)</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=392–452)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="392" width="780" height="54" fill="#EAD9A8"/>
  <rect x="40" y="392" width="780" height="54" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="392" width="4"   height="54" fill="#D9C089"/>
  <text x="58" y="411" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">GRUNDSATZ: Zuverlässigkeit ist die wichtigste Servicedimension.</text>
  <text x="58" y="427" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Eine Zusage ist eine Selbstverpflichtung. Niemals zusagen, was nicht gehalten werden kann –</text>
  <text x="58" y="441" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">lieber einen realistischen Termin nennen und dann früher liefern (Parasuraman et al. 1988, S. 23).</text>

  <!-- Baseline -->
  <line x1="40" y1="462" x2="820" y2="462" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="478" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">SERVQUAL (Parasuraman et al. 1988) · Modul VA05</text>
  <text x="820" y="478" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Parasuraman, A., Zeithaml, V. A. &amp; Berry, L. L. (1988). SERVQUAL. Journal of Retailing, 64(1), 12–40.</text>
</svg>
