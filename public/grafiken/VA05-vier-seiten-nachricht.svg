<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">KOMMUNIKATION · SCHULZ VON THUN · MODUL VA05 · PROFESSIONELL AM TELEFON UND IM SCHRIFTVERKEHR</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Die vier Seiten einer Nachricht (Schulz von Thun)</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Jede Äußerung enthält vier Botschaften – bewusst oder unbewusst</text>

  <!-- ══════════════════════════════════════════════
       ZENTRALE AUSSAGE (Sprechblase / Zitat-Box)
       y=104–168, x=220–640
       ══════════════════════════════════════════════ -->
  <rect x="220" y="104" width="420" height="74" fill="#1F2C56"/>
  <rect x="220" y="104" width="420" height="74" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <!-- Anführungszeichen-Akzent -->
  <text x="236" y="130" class="serif" font-size="28" fill="#D9C089" font-style="italic" opacity="0.6">&#8222;</text>
  <text x="258" y="133" class="serif" font-size="11" fill="#F8F8FA" font-style="italic">Ist die Darlehenszusage denn immer noch nicht durch?</text>
  <text x="258" y="150" class="serif" font-size="11" fill="#F8F8FA" font-style="italic">Ich warte seit über einer Woche!</text>
  <text x="600" y="166" class="serif" font-size="28" fill="#D9C089" font-style="italic" opacity="0.6" text-anchor="end">&#8220;</text>
  <text x="258" y="168" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5">— verärgerte Aussage des Geschäftsführers am Telefon</text>

  <!-- ══════════════════════════════════════════════
       VIER SEITEN – Positionierung
       Links:   Sachinhalt      x=40–200,  y=120–240
       Rechts:  Appell          x=660–820, y=120–240
       Oben:    Selbstoffenbarung           y=192–270 (mittig)
       Unten:   Beziehung                  y=270–350 (mittig)
       ══════════════════════════════════════════════ -->

  <!-- Verbindungslinien zu den vier Kacheln -->
  <!-- Links (Sachinhalt) -->
  <line x1="220" y1="141" x2="200" y2="185" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Rechts (Appell) -->
  <line x1="640" y1="141" x2="660" y2="185" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Oben (Selbstoffenbarung) -->
  <line x1="430" y1="104" x2="430" y2="88" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Unten (Beziehung) -->
  <line x1="430" y1="178" x2="430" y2="206" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- SEITE 1: Sachinhalt (Links) — bg-2 mit Navy-Rand -->
  <rect x="40" y="155" width="175" height="104" fill="#EDEDF3" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="40" y="155" width="175" height="4" fill="#1F2C56"/>
  <text x="56" y="177" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">SACHINHALT</text>
  <text x="56" y="191" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">Was liegt vor?</text>
  <line x1="56" y1="198" x2="199" y2="198" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="56" y="215" class="mono" font-size="8.5" fill="#15192B" letter-spacing="0.3">„Die Zusage liegt noch</text>
  <text x="56" y="229" class="mono" font-size="8.5" fill="#15192B" letter-spacing="0.3">nicht vor."</text>
  <text x="56" y="248" class="mono" font-size="7.5" fill="#3D5494" letter-spacing="0.3">die reine Information</text>

  <!-- SEITE 2: Selbstoffenbarung (Oben-Mitte) — Mid-Primary -->
  <rect x="271" y="192" width="318" height="80" fill="#3D5494"/>
  <rect x="271" y="192" width="318" height="4" fill="#8898C4"/>
  <text x="287" y="214" class="mono" font-size="8" fill="#EAD9A8" letter-spacing="2">SELBSTOFFENBARUNG</text>
  <text x="287" y="228" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Was zeigt der Sender von sich?</text>
  <line x1="287" y1="234" x2="573" y2="234" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="287" y="250" class="mono" font-size="8.5" fill="#F8F8FA" letter-spacing="0.3">„Ich bin unter Druck / verunsichert."</text>
  <text x="287" y="264" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3">was er über sich zeigt</text>

  <!-- SEITE 3: Appell (Rechts) — Gold-Akzent -->
  <rect x="645" y="155" width="175" height="104" fill="#D9C089"/>
  <rect x="645" y="155" width="175" height="104" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="645" y="155" width="175" height="4" fill="#1F2C56"/>
  <text x="661" y="177" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">APPELL</text>
  <text x="661" y="191" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">Was soll erreicht werden?</text>
  <line x1="661" y1="198" x2="804" y2="198" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="661" y="215" class="mono" font-size="8.5" fill="#15192B" letter-spacing="0.3">„Kümmern Sie sich</text>
  <text x="661" y="229" class="mono" font-size="8.5" fill="#15192B" letter-spacing="0.3">sofort darum!"</text>
  <text x="661" y="248" class="mono" font-size="7.5" fill="#3D5494" letter-spacing="0.3">was er erreichen will</text>

  <!-- SEITE 4: Beziehung (Unten-Mitte) — Navy dunkel -->
  <rect x="271" y="280" width="318" height="80" fill="#1F2C56"/>
  <rect x="271" y="280" width="318" height="4" fill="#D9C089"/>
  <text x="287" y="302" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">BEZIEHUNG</text>
  <text x="287" y="316" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Wie steht der Sender zum Empfänger?</text>
  <line x1="287" y1="322" x2="573" y2="322" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="287" y="338" class="mono" font-size="8.5" fill="#F8F8FA" letter-spacing="0.3">„Ich fühle mich von euch nicht ernst genommen."</text>
  <text x="287" y="352" class="mono" font-size="7.5" fill="#8898C4" letter-spacing="0.3">wie er zum Empfänger steht</text>

  <!-- Seitenbezeichnungen / Orientierungsachsen -->
  <text x="127" y="148" class="mono" font-size="7" fill="#7A8099" letter-spacing="1" text-anchor="middle">SACHEBENE</text>
  <text x="733" y="148" class="mono" font-size="7" fill="#7A8099" letter-spacing="1" text-anchor="middle">WIRKEBENE</text>

  <!-- ══════════════════════════════════════════════
       REAKTIONSPFEIL + HANDLUNGSTIPP
       ══════════════════════════════════════════════ -->
  <!-- Pfeil: Beziehung → Reaktion -->
  <text x="430" y="380" class="mono" font-size="8" fill="#7A8099" letter-spacing="1" text-anchor="middle">EMPFÄNGER-REAKTION</text>
  <line x1="430" y1="360" x2="430" y2="385" stroke="#C8CAD4" stroke-width="1"/>
  <polygon points="430,390 425,382 435,382" fill="#C8CAD4"/>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=396–458)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="396" width="780" height="58" fill="#EAD9A8"/>
  <rect x="40" y="396" width="780" height="58" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="396" width="4"   height="58" fill="#D9C089"/>
  <text x="58" y="415" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">REAKTIONSREGEL: Ein verärgerter Anruf hat vier Seiten.</text>
  <text x="58" y="431" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Reagieren Sie zuerst auf Beziehung und Selbstoffenbarung, dann auf den Sachinhalt</text>
  <text x="58" y="445" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">(Watzlawick: erst die Beziehung klären, dann die Sache). Den Appell zuletzt adressieren.</text>

  <!-- Baseline -->
  <line x1="40" y1="472" x2="820" y2="472" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="488" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Schulz von Thun · Watzlawick · Modul VA05</text>
  <text x="820" y="488" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Schulz von Thun, F. (2011). Miteinander reden 1 (48. Aufl.). Rowohlt.</text>
</svg>
