<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="700" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="28" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">SELBST- &amp; ZEITFÜHRUNG · MODUL TL01 · PRIORITÄTEN</text>
  <line x1="40" y1="38" x2="820" y2="38" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="430" y="66" class="serif" font-size="18" font-weight="500" fill="#1F2C56" text-anchor="middle">Eisenhower-Matrix: Wichtig × Dringend</text>
  <text x="430" y="84" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle">WO ENTSTEHT FÜHRUNGSWIRKUNG? · QUADRANT II IST DER FÜHRUNGSQUADRANT</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ACHSEN                                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Y-Achse Label: Wichtigkeit -->
  <text x="14" y="310" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle" transform="rotate(-90, 14, 310)">WICHTIGKEIT</text>
  <!-- Y-Achse Beschriftungen -->
  <text x="30" y="112" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hoch</text>
  <text x="30" y="490" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">niedrig</text>

  <!-- X-Achse Label: Dringlichkeit -->
  <text x="450" y="514" class="mono" font-size="9" fill="#7A8099" letter-spacing="1" text-anchor="middle">DRINGLICHKEIT</text>
  <!-- X-Achse Beschriftungen -->
  <text x="108" y="528" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">niedrig</text>
  <text x="800" y="528" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">hoch</text>

  <!-- Achsen -->
  <line x1="60" y1="100" x2="60" y2="497" stroke="#15192B" stroke-width="1.5"/>
  <line x1="60" y1="497" x2="838" y2="497" stroke="#15192B" stroke-width="1.5"/>
  <!-- Achsen-Pfeilspitzen -->
  <polygon points="60,96 55,106 65,106" fill="#15192B"/>
  <polygon points="842,497 832,492 832,502" fill="#15192B"/>

  <!-- Mittellinie vertikal -->
  <line x1="449" y1="100" x2="449" y2="497" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Mittellinie horizontal -->
  <line x1="60" y1="299" x2="838" y2="299" stroke="#C8CAD4" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- QUADRANT II: oben-links – WICHTIG + NICHT DRINGEND     -->
  <!-- Führungsquadrant – HERVORGEHOBEN (Primary + Gold)      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="62" y="102" width="385" height="195" fill="#1F2C56"/>
  <!-- Gold-Akzentstreifen oben -->
  <rect x="62" y="102" width="385" height="4" fill="#D9C089"/>
  <!-- Quadrant-Nummer (wasserzeichen-artig) -->
  <text x="82" y="138" class="serif" font-size="36" font-style="italic" fill="#F8F8FA" opacity="0.12">II</text>

  <!-- Quadrant-Label -->
  <text x="254" y="128" class="mono" font-size="8" fill="#D9C089" letter-spacing="1.5" text-anchor="middle">WICHTIG · NICHT DRINGEND</text>
  <!-- Titel -->
  <text x="254" y="150" class="serif" font-size="16" font-weight="500" fill="#F8F8FA" text-anchor="middle">Führungsarbeit</text>
  <!-- Handlungslogik -->
  <text x="254" y="168" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">bewusst einplanen &amp; aktiv verteidigen</text>
  <!-- Trennlinie -->
  <line x1="102" y1="178" x2="407" y2="178" stroke="#3D5494" stroke-width="0.5"/>
  <!-- Beispiele -->
  <text x="254" y="196" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Entwicklungsgespräche planen</text>
  <text x="254" y="212" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Wochenplanung &amp; Teamplanung</text>
  <text x="254" y="228" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Cockpit-Analyse vorbereiten</text>
  <text x="254" y="244" class="mono" font-size="8" fill="#8898C4" text-anchor="middle">Eigene Weiterbildung</text>
  <!-- Badge -->
  <rect x="174" y="263" width="160" height="22" fill="#D9C089"/>
  <text x="254" y="278" class="mono" font-size="9" fill="#1F2C56" text-anchor="middle" letter-spacing="1">ZIEL: AUSBAUEN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- QUADRANT I: oben-rechts – WICHTIG + DRINGEND           -->
  <!-- Krisen – klein halten                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="451" y="102" width="385" height="195" fill="#EDEDF3"/>
  <!-- Akzentstreifen oben -->
  <rect x="451" y="102" width="385" height="4" fill="#3D5494"/>
  <!-- Quadrant-Nummer -->
  <text x="471" y="138" class="serif" font-size="36" font-style="italic" fill="#1F2C56" opacity="0.14">I</text>

  <!-- Quadrant-Label -->
  <text x="643" y="128" class="mono" font-size="8" fill="#3D5494" letter-spacing="1.5" text-anchor="middle">WICHTIG · DRINGEND</text>
  <!-- Titel -->
  <text x="643" y="150" class="serif" font-size="16" font-weight="500" fill="#1F2C56" text-anchor="middle">Krisen &amp; Deadlines</text>
  <!-- Handlungslogik -->
  <text x="643" y="168" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">sofort erledigen – klein halten</text>
  <!-- Trennlinie -->
  <line x1="491" y1="178" x2="796" y2="178" stroke="#C8CAD4" stroke-width="0.5"/>
  <!-- Beispiele -->
  <text x="643" y="196" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Eskaliertes Kreditengagement</text>
  <text x="643" y="212" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Akuter Mitarbeiterkonflikt</text>
  <text x="643" y="228" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Kritische Kundensituation</text>
  <!-- Badge -->
  <rect x="563" y="263" width="160" height="22" fill="#3D5494"/>
  <text x="643" y="278" class="mono" font-size="9" fill="#F8F8FA" text-anchor="middle" letter-spacing="1">ZIEL: KLEIN HALTEN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- QUADRANT III: unten-rechts – NICHT WICHTIG + DRINGEND  -->
  <!-- Schein-Dringlichkeiten – delegieren / hinterfragen      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="451" y="301" width="385" height="194" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="1"/>
  <!-- Akzentstreifen unten -->
  <rect x="451" y="491" width="385" height="4" fill="#8898C4"/>
  <!-- Quadrant-Nummer -->
  <text x="471" y="335" class="serif" font-size="36" font-style="italic" fill="#1F2C56" opacity="0.10">III</text>

  <!-- Quadrant-Label -->
  <text x="643" y="324" class="mono" font-size="8" fill="#7A8099" letter-spacing="1.5" text-anchor="middle">NICHT WICHTIG · DRINGEND</text>
  <!-- Titel -->
  <text x="643" y="346" class="serif" font-size="16" font-weight="500" fill="#1F2C56" text-anchor="middle">Schein-Dringlichkeiten</text>
  <!-- Handlungslogik -->
  <text x="643" y="364" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">delegieren oder hinterfragen</text>
  <!-- Trennlinie -->
  <line x1="491" y1="374" x2="796" y2="374" stroke="#C8CAD4" stroke-width="0.5"/>
  <!-- Beispiele -->
  <text x="643" y="392" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Aufwärtsdelegation von Mitarbeitern</text>
  <text x="643" y="408" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Viele Anfragen &amp; Standard-Mails</text>
  <text x="643" y="424" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Meetings ohne klares Ziel</text>
  <!-- Badge -->
  <rect x="563" y="455" width="160" height="22" fill="#8898C4"/>
  <text x="643" y="470" class="mono" font-size="9" fill="#F8F8FA" text-anchor="middle" letter-spacing="1">ZIEL: DELEGIEREN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- QUADRANT IV: unten-links – NICHT WICHTIG + NICHT DRIN. -->
  <!-- Zeitfresser – weglassen / minimieren                    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="62" y="301" width="385" height="194" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="1"/>
  <!-- Akzentstreifen unten -->
  <rect x="62" y="491" width="385" height="4" fill="#C8CAD4"/>
  <!-- Quadrant-Nummer -->
  <text x="82" y="335" class="serif" font-size="36" font-style="italic" fill="#1F2C56" opacity="0.10">IV</text>

  <!-- Quadrant-Label -->
  <text x="254" y="324" class="mono" font-size="8" fill="#7A8099" letter-spacing="1.5" text-anchor="middle">NICHT WICHTIG · NICHT DRINGEND</text>
  <!-- Titel -->
  <text x="254" y="346" class="serif" font-size="16" font-weight="500" fill="#1F2C56" text-anchor="middle">Zeitfresser</text>
  <!-- Handlungslogik -->
  <text x="254" y="364" class="mono" font-size="8" fill="#3D5494" text-anchor="middle">weglassen oder auf Minimum reduzieren</text>
  <!-- Trennlinie -->
  <line x1="102" y1="374" x2="407" y2="374" stroke="#C8CAD4" stroke-width="0.5"/>
  <!-- Beispiele -->
  <text x="254" y="392" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Unnötige Systempflege &amp; Routine</text>
  <text x="254" y="408" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Soziale Ablenkung im Büro</text>
  <text x="254" y="424" class="mono" font-size="8" fill="#7A8099" text-anchor="middle">Berichte die niemand liest</text>
  <!-- Badge -->
  <rect x="174" y="455" width="160" height="22" fill="#C8CAD4"/>
  <text x="254" y="470" class="mono" font-size="9" fill="#15192B" text-anchor="middle" letter-spacing="1">ZIEL: MINIMIEREN</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEITPRINZIP-BANNER                                      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <line x1="40" y1="550" x2="820" y2="550" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Leitprinzip-Label -->
  <text x="40" y="568" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">LEITPRINZIP</text>

  <!-- Leitprinzip-Text zweizeilig -->
  <text x="40" y="587" class="serif" font-size="13" font-weight="500" fill="#1F2C56">Der Teamleiter arbeitet in Quadrant II –</text>
  <text x="40" y="606" class="serif" font-size="13" fill="#1F2C56">oder er wird von Quadrant I und III <tspan font-style="italic">getrieben.</tspan></text>

  <!-- Rechts: Q-II Anteil Richtwert -->
  <rect x="600" y="558" width="220" height="56" fill="#1F2C56"/>
  <rect x="600" y="558" width="220" height="3" fill="#D9C089"/>
  <text x="710" y="577" class="mono" font-size="8" fill="#8898C4" text-anchor="middle" letter-spacing="1">RICHTWERT FÜHRUNGSZEIT</text>
  <text x="710" y="596" class="serif" font-size="22" font-style="italic" fill="#D9C089" text-anchor="middle">≥ 40 %</text>
  <text x="710" y="609" class="mono" font-size="8" fill="#EAD9A8" text-anchor="middle">der Woche in Quadrant II</text>

  <!-- Baseline -->
  <line x1="40" y1="668" x2="820" y2="668" stroke="#15192B" stroke-width="1"/>

  <!-- Quellenzeile -->
  <text x="40" y="680" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Covey, S. R. (1989). The 7 Habits of Highly Effective People. Simon &amp; Schuster.</text>

</svg>
