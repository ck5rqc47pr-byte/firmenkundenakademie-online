<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">WORKAROUND · DSGVO · TAM · MODUL VA03 · AGREE IM INNENDIENST EFFIZIENT NUTZEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Was ein Workaround wirklich kostet</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Vier versteckte Kosten einer Parallelliste (Excel / Notizzettel) neben dem System</text>

  <!-- ══════════════════════════════════════════════
       VIER KACHELN: 2×2 Raster
       Reihe 1: y=104–238  |  Reihe 2: y=252–386
       Spalte 1: x=40–416  |  Spalte 2: x=430–820
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 1: Doppelpflege (oben links) — Navy -->
  <rect x="40" y="104" width="376" height="134" fill="#1F2C56"/>
  <text x="56" y="128" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">01 · DOPPELPFLEGE</text>
  <line x1="56" y1="135" x2="400" y2="135" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="56" y="155" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Daten stehen an zwei Orten — die Liste</text>
  <text x="56" y="170" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">und das System. Eine davon veraltet zwangs-</text>
  <text x="56" y="185" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">läufig. Jede Änderung muss doppelt gepflegt</text>
  <text x="56" y="200" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">werden — ein unsichtbarer Zeitfresser.</text>
  <text x="56" y="224" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5">Zeitaufwand verdoppelt sich ohne Mehrwert.</text>

  <!-- KACHEL 2: Fehlerquelle (oben rechts) — Mid-Primary -->
  <rect x="430" y="104" width="390" height="134" fill="#3D5494"/>
  <text x="446" y="128" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">02 · FEHLERQUELLE</text>
  <line x1="446" y1="135" x2="804" y2="135" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="446" y="155" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Widersprüchliche Stände führen zu falschen</text>
  <text x="446" y="170" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Auskünften. Der Berater gibt den Stand der</text>
  <text x="446" y="185" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Liste aus — das System zeigt etwas anderes.</text>
  <text x="446" y="200" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Kunde und Kollegin vertrauen unterschiedlichen</text>
  <text x="446" y="215" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Quellen.</text>
  <text x="446" y="224" class="mono" font-size="8" fill="#8898C4" letter-spacing="0.5">Fehler entstehen nicht aus Nachlässigkeit, sondern aus dem System.</text>

  <!-- KACHEL 3: Datenschutz (unten links) — ROT-AKZENT -->
  <!-- Rote Hervorhebung: dunkelroter Hintergrund ähnlich Risiko-Ton, aber im CI-Rahmen -->
  <!-- Wir nutzen eine eigene rote Akzentfarbe innerhalb CI-Konventionen: #8B1A1A (dunkelrot) -->
  <rect x="40" y="252" width="376" height="134" fill="#7A1C1C"/>
  <rect x="40" y="252" width="376" height="134" fill="none" stroke="#D9C089" stroke-width="1.5"/>
  <text x="56" y="276" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">03 · DATENSCHUTZ</text>
  <text x="56" y="289" class="mono" font-size="8" fill="rgba(217,192,137,0.80)" letter-spacing="1">DSGVO-RISIKO · ART. 5, 32 DSGVO</text>
  <line x1="56" y1="296" x2="400" y2="296" stroke="#D9C089" stroke-width="0.5" opacity="0.5"/>
  <text x="56" y="315" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">Kundendaten außerhalb des gesicherten</text>
  <text x="56" y="330" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">Systems (Excel, Notizzettel) verstoßen gegen</text>
  <text x="56" y="345" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">Art. 5 (Integrität) &amp; Art. 32 DSGVO (technische</text>
  <text x="56" y="360" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">Schutzmaßnahmen). Prüfer-Fundstelle.</text>
  <text x="56" y="374" class="mono" font-size="8" fill="rgba(217,192,137,0.75)" letter-spacing="0.5">Rote Ampel: unmittelbares Haftungsrisiko für die Bank.</text>

  <!-- KACHEL 4: Kein gemeinsamer Stand (unten rechts) — Hell / bg-2 -->
  <rect x="430" y="252" width="390" height="134" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="446" y="276" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">04 · KEIN GEMEINSAMER STAND</text>
  <text x="446" y="289" class="mono" font-size="8" fill="#7A8099" letter-spacing="1">WISSEN GEHT VERLOREN</text>
  <line x1="446" y1="296" x2="804" y2="296" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="446" y="315" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Der Berater sieht die Notiz der Assistenz</text>
  <text x="446" y="330" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">nicht. Bei Urlaub, Krankheit oder Wechsel</text>
  <text x="446" y="345" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">geht das Wissen unwiderruflich verloren.</text>
  <text x="446" y="360" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Vertretungsfähigkeit ist nicht mehr gegeben.</text>
  <text x="446" y="374" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.5">agree schafft gemeinsame Sichtbarkeit für das ganze Team.</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN TAM  y=402–460
       ══════════════════════════════════════════════ -->
  <rect x="40" y="402" width="780" height="64" fill="#EAD9A8"/>
  <rect x="40" y="402" width="780" height="64" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="402" width="4"   height="64" fill="#D9C089"/>
  <text x="58" y="422" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">WORKAROUNDS SIND EIN SIGNAL, KEIN CHARAKTERFEHLER.</text>
  <text x="58" y="438" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Ein System wird genutzt, wenn es nützlich UND bedienbar ist (Davis, 1989 — Technology Acceptance Model).</text>
  <text x="58" y="454" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Workarounds zeigen: Das System löst ein echtes Problem noch nicht gut genug. Lösung = System verbessern, nicht Menschen tadeln.</text>

  <!-- Baseline -->
  <line x1="40" y1="476" x2="820" y2="476" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="490" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Art. 5, 32 DSGVO · TAM (Davis 1989) · Modul VA03</text>
  <text x="820" y="490" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Davis, F. D. (1989). Perceived Usefulness, Perceived Ease of Use. MIS Quarterly, 13(3).</text>
</svg>
