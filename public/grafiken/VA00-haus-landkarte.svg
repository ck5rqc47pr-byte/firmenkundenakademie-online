<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">ERSTORIENTIERUNG · LAVE &amp; WENGER 1991 · MODUL VA00 · DAS EIGENE HAUS KENNEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Die Landkarte des eigenen Hauses</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Vier Orientierungsfelder des Firmenkunden-Innendienstes</text>

  <!-- ══════════════════════════════════════════════
       2×2-GRID der vier Orientierungsfelder
       Zeile 1: y=104–232   Zeile 2: y=246–374
       Spalten: x=40–430 (390px) | x=444–820 (376px)
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 1: Produkte & Verbund — Navy (oben links) -->
  <rect x="40"  y="104" width="390" height="128" fill="#1F2C56"/>
  <text x="56"  y="128" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">01 · PRODUKTE &amp; VERBUND</text>
  <line x1="56" y1="136" x2="414" y2="136" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="56"  y="152" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">Was bieten wir an – und wer im Verbund hilft dabei?</text>
  <text x="56"  y="170" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kredit, Zahlungsverkehr, Einlagen, Außenhandel</text>
  <text x="56"  y="185" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Verbund: R+V, Union Investment, DZ Bank</text>
  <text x="56"  y="200" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Fördermittel: KfW, L-Bank, Schwäbisch Hall</text>
  <text x="56"  y="218" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Verbundstrategie VR/Raiffeisen</text>

  <!-- KACHEL 2: Prozesse & Rollen — Mid-Primary (oben rechts) -->
  <rect x="444" y="104" width="376" height="128" fill="#3D5494"/>
  <text x="460" y="128" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">02 · PROZESSE &amp; ROLLEN</text>
  <line x1="460" y1="136" x2="804" y2="136" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="460" y="152" class="mono" font-size="8" fill="rgba(248,248,250,0.75)" letter-spacing="0.5">Wer entscheidet was – und wo stehe ich darin?</text>
  <text x="460" y="170" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kreditprozess: Anbahnung bis Bestand</text>
  <text x="460" y="185" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Markt (Beratung) vs. Marktfolge (Votum)</text>
  <text x="460" y="200" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Funktionstrennung nach MaRisk BTO 1.2</text>
  <text x="460" y="218" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Aufsichtsrechtliche Anforderung</text>

  <!-- KACHEL 3: Technische Systeme — Akzent-Gold (unten links) -->
  <rect x="40"  y="246" width="390" height="128" fill="#D9C089"/>
  <rect x="40"  y="246" width="390" height="128" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <text x="56"  y="270" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">03 · TECHNISCHE SYSTEME</text>
  <line x1="56" y1="278" x2="414" y2="278" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="56"  y="294" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Welches System nutze ich wofür?</text>
  <text x="56"  y="312" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">· agree = Kernbankverfahren (Stammdaten, Kredit)</text>
  <text x="56"  y="327" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">· DMS = Dokumentenmanagementsystem (Akte)</text>
  <text x="56"  y="342" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">· Microsoft 365, VR-NetWorld, Marktinformationen</text>
  <text x="56"  y="360" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">Atruvia-Plattform (agree21)</text>

  <!-- KACHEL 4: Erwartungen & Schnittstellen — Hell/bg-2 (unten rechts) -->
  <rect x="444" y="246" width="376" height="128" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="460" y="270" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">04 · ERWARTUNGEN &amp; SCHNITTSTELLEN</text>
  <line x1="460" y1="278" x2="804" y2="278" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="460" y="294" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Was braucht mein Berater – und wen frage ich bei was?</text>
  <text x="460" y="312" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Berater: Vorbereitung, Unterlagen, Wiedervorlagen</text>
  <text x="460" y="327" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Marktfolge: Vollständigkeitsprüfung, Rückfragen</text>
  <text x="460" y="342" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">· Bankgeheimnis &amp; DSGVO ab Tag 1 beachten</text>
  <text x="460" y="360" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5">§ 1 Abs. 1 KWG, DS-GVO Art. 5</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN (y=390–462)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="390" width="780" height="64" fill="#EAD9A8"/>
  <rect x="40" y="390" width="780" height="64" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="390" width="4"   height="64" fill="#D9C089"/>
  <text x="58" y="409" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">Wer das eigene Haus kennt, findet für jeden Fall die richtige Stelle.</text>
  <text x="58" y="425" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Sie müssen es noch nicht beherrschen – Sie müssen wissen, was es gibt und wo Sie sich einordnen.</text>
  <text x="58" y="441" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Die vier Felder bilden Ihre Orientierungskarte für die ersten Wochen im Firmenkundeninnendienst.</text>

  <!-- Baseline -->
  <line x1="40" y1="468" x2="820" y2="468" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="484" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Erstorientierung (Lave &amp; Wenger 1991) · Modul VA00</text>
  <text x="820" y="484" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Lave, J. &amp; Wenger, E. (1991). Situated Learning. Cambridge University Press.</text>
</svg>
