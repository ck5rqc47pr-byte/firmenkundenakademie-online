<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">VERTRIEBSANLÄSSE · RELATIONSHIP LENDING · MODUL VA09 · VERTRIEBSANLÄSSE ERKENNEN UND AUFBEREITEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Vertriebsanlässe: das Signal und der Bedarf dahinter</text>
  <text x="40" y="87" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Die Hausbank sieht Portfoliodaten früher als jeder Wettbewerber — sechs typische Signalmuster</text>

  <!-- ══════════════════════════════════════════════
       SPALTEN-KOPFZEILE  (y=102–122)
       ══════════════════════════════════════════════ -->

  <!-- Kopfzeile Hintergrund -->
  <rect x="40" y="102" width="780" height="22" fill="#1F2C56"/>

  <!-- Spalten-Trennlinien im Kopf -->
  <line x1="323" y1="102" x2="323" y2="124" stroke="#3D5494" stroke-width="1"/>
  <line x1="572" y1="102" x2="572" y2="124" stroke="#3D5494" stroke-width="1"/>

  <!-- Spalten-Labels -->
  <text x="56"  y="117" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">SIGNAL AUS DEM PORTFOLIO</text>
  <text x="339" y="117" class="mono" font-size="8" fill="#8898C4" letter-spacing="2">MÖGLICHER BEDARF</text>
  <text x="588" y="117" class="mono" font-size="8" fill="#8898C4" letter-spacing="2">VERBUND / PRODUKT</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 1: Kreditlinie (y=124–166)   AKZENT
       ══════════════════════════════════════════════ -->
  <rect x="40"  y="124" width="283" height="42" fill="#D9C089"/>
  <rect x="323" y="124" width="249" height="42" fill="#EAD9A8"/>
  <rect x="572" y="124" width="248" height="42" fill="#EAD9A8"/>
  <!-- Trennlinien Zeile 1 -->
  <line x1="323" y1="124" x2="323" y2="166" stroke="#C8AE6E" stroke-width="0.5"/>
  <line x1="572" y1="124" x2="572" y2="166" stroke="#C8AE6E" stroke-width="0.5"/>
  <!-- Inhalt Zeile 1 -->
  <text x="56" y="141" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Kreditlinie dauerhaft hoch</text>
  <text x="56" y="155" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5">ausgelastet (&gt; 80 % Limit)</text>
  <text x="339" y="141" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Erweiterung oder</text>
  <text x="339" y="155" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Umstrukturierung der Linie</text>
  <text x="588" y="141" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Betriebsmittelkredit,</text>
  <text x="588" y="155" class="mono" font-size="8" fill="#15192B" letter-spacing="0.5">Kontokorrent-Erhöhung</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 2: Zinsbindung (y=166–208)   HELL
       ══════════════════════════════════════════════ -->
  <rect x="40"  y="166" width="283" height="42" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="0.5"/>
  <rect x="323" y="166" width="249" height="42" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="0.5"/>
  <rect x="572" y="166" width="248" height="42" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="0.5"/>
  <line x1="323" y1="166" x2="323" y2="208" stroke="#C8CAD4" stroke-width="0.5"/>
  <line x1="572" y1="166" x2="572" y2="208" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="56" y="183" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Zinsbindung läuft aus</text>
  <text x="56" y="197" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">(Frist &lt; 12 Monate)</text>
  <text x="339" y="183" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Prolongation oder</text>
  <text x="339" y="197" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Umschuldung</text>
  <text x="588" y="183" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Kredit, Annuitätendarlehen,</text>
  <text x="588" y="197" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">MünchenerHyp</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 3: Liquidität (y=208–250)   NAVY
       ══════════════════════════════════════════════ -->
  <rect x="40"  y="208" width="283" height="42" fill="#3D5494"/>
  <rect x="323" y="208" width="249" height="42" fill="#1F2C56"/>
  <rect x="572" y="208" width="248" height="42" fill="#1F2C56"/>
  <line x1="323" y1="208" x2="323" y2="250" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <line x1="572" y1="208" x2="572" y2="250" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <text x="56" y="225" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5" font-weight="500">Hohe, ungenutzte</text>
  <text x="56" y="239" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">Liquidität auf Konto</text>
  <text x="339" y="225" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Geldanlage /</text>
  <text x="339" y="239" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Kapitalanlage</text>
  <text x="588" y="225" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Union Investment,</text>
  <text x="588" y="239" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Festgeld, Tagesgeld</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 4: Nachfolge (y=250–292)   HELL
       ══════════════════════════════════════════════ -->
  <rect x="40"  y="250" width="283" height="42" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="0.5"/>
  <rect x="323" y="250" width="249" height="42" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="0.5"/>
  <rect x="572" y="250" width="248" height="42" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="0.5"/>
  <line x1="323" y1="250" x2="323" y2="292" stroke="#C8CAD4" stroke-width="0.5"/>
  <line x1="572" y1="250" x2="572" y2="292" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="56" y="267" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Inhaber 60+ ohne erkennbare</text>
  <text x="56" y="281" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Nachfolgelösung</text>
  <text x="339" y="267" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Nachfolgeberatung /</text>
  <text x="339" y="281" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Unternehmensbewertung</text>
  <text x="588" y="267" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">DZ Bank M&amp;A,</text>
  <text x="588" y="281" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Schwäbisch Hall</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 5: Investition (y=292–334)   EDEDF3
       ══════════════════════════════════════════════ -->
  <rect x="40"  y="292" width="283" height="42" fill="#EDEDF3" stroke="#E2E3E8" stroke-width="0.5"/>
  <rect x="323" y="292" width="249" height="42" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="0.5"/>
  <rect x="572" y="292" width="248" height="42" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="0.5"/>
  <line x1="323" y1="292" x2="323" y2="334" stroke="#C8CAD4" stroke-width="0.5"/>
  <line x1="572" y1="292" x2="572" y2="334" stroke="#C8CAD4" stroke-width="0.5"/>
  <text x="56" y="309" class="mono" font-size="8" fill="#1F2C56" letter-spacing="0.5" font-weight="500">Investition angedeutet</text>
  <text x="56" y="323" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">(im Gespräch / Akte)</text>
  <text x="339" y="309" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Investitionsfinanzierung /</text>
  <text x="339" y="323" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Fördermittelprüfung</text>
  <text x="588" y="309" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">KfW / L-Bank,</text>
  <text x="588" y="323" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Leasing, Investitionskredit</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 6: Umsatzwachstum (y=334–376)   MID-PRIMARY
       ══════════════════════════════════════════════ -->
  <rect x="40"  y="334" width="283" height="42" fill="#3D5494"/>
  <rect x="323" y="334" width="249" height="42" fill="#1F2C56"/>
  <rect x="572" y="334" width="248" height="42" fill="#1F2C56"/>
  <line x1="323" y1="334" x2="323" y2="376" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <line x1="572" y1="334" x2="572" y2="376" stroke="#8898C4" stroke-width="0.5" opacity="0.4"/>
  <text x="56" y="351" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5" font-weight="500">Umsatzwachstum erkennbar</text>
  <text x="56" y="365" class="mono" font-size="8" fill="#D9C089" letter-spacing="0.5">(Kontoeingang steigt)</text>
  <text x="339" y="351" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Working-Capital-Bedarf /</text>
  <text x="339" y="365" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Forderungsfinanzierung</text>
  <text x="588" y="351" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Kontokorrent, Factoring,</text>
  <text x="588" y="365" class="mono" font-size="8" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">Avalkredit</text>

  <!-- Äußerer Rahmen Tabelle -->
  <rect x="40" y="102" width="780" height="274" fill="none" stroke="#C8CAD4" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN: Hausbankvorteil  (y=388–450)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="388" width="780" height="56" fill="#EAD9A8"/>
  <rect x="40" y="388" width="780" height="56" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="388" width="4"   height="56" fill="#D9C089"/>
  <text x="58" y="407" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">HAUSBANKVORTEIL: Relationship Lending (Petersen &amp; Rajan, 1994).</text>
  <text x="58" y="423" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Die Hausbank sieht Kontobewegungen, Kreditinanspruchnahmen und Fristenläufe früher als jeder Wettbewerber —</text>
  <text x="58" y="437" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">diese Informationsasymmetrie ist der Rohstoff für proaktive Vertriebsanlässe.</text>

  <!-- Baseline -->
  <line x1="40" y1="460" x2="820" y2="460" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="476" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Relationship Lending – Petersen &amp; Rajan (1994) · Modul VA09</text>
  <text x="820" y="476" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Petersen, M. A. &amp; Rajan, R. G. (1994). The Benefits of Lending Relationships. Journal of Finance, 49(1), 3–37.</text>
</svg>
