<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">KREDITAKTE · § 18 KWG · MARISK BTO 1.2 · MODUL VA01 · DIE KREDITAKTE SICHER FÜHREN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Die sechs Bereiche einer Firmenkunden-Kreditakte</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 1: Kacheln 1 – 3  (y=88–210)
       Breite: 3 × 246 + 2 × 13 = 764 → x-Start 40
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 1: Antrag &amp; Entscheidung -->
  <rect x="40"  y="88" width="246" height="122" fill="#1F2C56"/>
  <text x="56"  y="113" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">01 · ANTRAG &amp; ENTSCHEIDUNG</text>
  <line x1="56" y1="120" x2="270" y2="120" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="56"  y="139" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kreditantrag</text>
  <text x="56"  y="155" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kreditbeschluss / Votum</text>
  <text x="56"  y="171" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Genehmigungsprotokoll</text>

  <!-- KACHEL 2: Vertrag -->
  <rect x="299" y="88" width="246" height="122" fill="#3D5494"/>
  <text x="315" y="113" class="mono" font-size="9" fill="#D9C089" letter-spacing="2">02 · VERTRAG</text>
  <line x1="315" y1="120" x2="529" y2="120" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="315" y="139" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kreditvertrag (unterschrieben)</text>
  <text x="315" y="155" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Konditionen / Tilgungsplan</text>
  <text x="315" y="171" class="mono" font-size="9" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Vertragsänderungen</text>

  <!-- KACHEL 3: Bonität &amp; Offenlegung — AKZENT-HERVORHEBUNG -->
  <rect x="558" y="88" width="262" height="122" fill="#D9C089"/>
  <rect x="558" y="88" width="262" height="122" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <text x="574" y="113" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">03 · BONITÄT &amp; OFFENLEGUNG</text>
  <text x="574" y="126" class="mono" font-size="8" fill="#3D5494" letter-spacing="1">§ 18 KWG — HÄUFIGSTER MANGEL</text>
  <line x1="574" y1="133" x2="804" y2="133" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="574" y="149" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Jahresabschlüsse (mind. 3 J.)</text>
  <text x="574" y="165" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· BWA / Saldenliste</text>
  <text x="574" y="181" class="mono" font-size="9" fill="#15192B" letter-spacing="0.5">· Selbstauskunft / Steuerbescheid</text>

  <!-- ══════════════════════════════════════════════
       ZEILE 2: Kacheln 4 – 6  (y=226–348)
       ══════════════════════════════════════════════ -->

  <!-- KACHEL 4: Sicherheiten -->
  <rect x="40"  y="226" width="246" height="122" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="56"  y="251" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">04 · SICHERHEITEN</text>
  <line x1="56" y1="258" x2="270" y2="258" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="56"  y="277" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Sicherheitenverträge</text>
  <text x="56"  y="293" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Grundbuchauszug</text>
  <text x="56"  y="309" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Wertnachweise / Gutachten</text>

  <!-- KACHEL 5: Formales / Legitimation -->
  <rect x="299" y="226" width="246" height="122" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="315" y="251" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">05 · FORMALES / LEGITIMATION</text>
  <line x1="315" y1="258" x2="529" y2="258" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="315" y="277" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· HR-Auszug / Gesellschaftsv.</text>
  <text x="315" y="293" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· KYC-Unterlagen (Geldwäsche)</text>
  <text x="315" y="309" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Vollmachten / Unterschriften</text>

  <!-- KACHEL 6: Korrespondenz &amp; Überwachung -->
  <rect x="558" y="226" width="262" height="122" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>
  <text x="574" y="251" class="mono" font-size="9" fill="#1F2C56" letter-spacing="2">06 · KORRESPONDENZ &amp; ÜBERWACHUNG</text>
  <line x1="574" y1="258" x2="804" y2="258" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>
  <text x="574" y="277" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Schriftverkehr (Nachforderungen)</text>
  <text x="574" y="293" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Wiedervorlagen / Fristen</text>
  <text x="574" y="309" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Engagementüberwachung</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN: § 18-Hinweis  (y=368–440)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="368" width="780" height="56" fill="#EAD9A8"/>
  <rect x="40" y="368" width="780" height="56" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="368" width="4"   height="56" fill="#D9C089"/>
  <text x="58" y="387" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">REGELFALL KREDITAKTE: Vollständigkeit aller 6 Bereiche ist MaRisk-Pflicht (BTO 1.2).</text>
  <text x="58" y="405" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Bereich 3 (Bonität &amp; Offenlegung) ist prüfungsrelevant: § 18 KWG verlangt laufende Offenlegung bei Krediten ab 750.000 EUR —</text>
  <text x="58" y="419" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">interne Grenze der VR-Bank Musterregion eG oft bereits ab 50.000–100.000 EUR. Fehlende Unterlagen = Prüfungsmangel.</text>

  <!-- Baseline -->
  <line x1="40" y1="446" x2="820" y2="446" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="462" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">§ 18 KWG · MaRisk BTO 1.2 · Modul VA01</text>
  <text x="820" y="462" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Becker, J. &amp; Peppmeier, A. (2018). Bankbetriebslehre (11. Aufl.). NWB.</text>
</svg>
