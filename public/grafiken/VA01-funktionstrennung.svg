<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">FUNKTIONSTRENNUNG · MARISK BTO 1.2 · MODUL VA01 · DIE KREDITAKTE SICHER FÜHREN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Funktionstrennung: Markt und Marktfolge</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="1">KREDITENTSCHEIDUNGEN ERFORDERN VOTUM BEIDER BEREICHE — VIER-AUGEN-PRINZIP GEMÄSS MARISK BTO 1.2</text>

  <!-- ══════════════════════════════════════════════
       LINKE SPALTE: MARKT  x=40–390
       ══════════════════════════════════════════════ -->

  <!-- Markt Header -->
  <rect x="40" y="104" width="350" height="32" fill="#1F2C56"/>
  <text x="55"  y="125" class="mono" font-size="10" fill="#F8F8FA" letter-spacing="2">MARKT · VERTRIEB / BERATER</text>

  <!-- Markt Body -->
  <rect x="40" y="136" width="350" height="220" fill="#3D5494"/>

  <text x="55" y="164" class="mono" font-size="9" fill="#D9C089" letter-spacing="1">AUFGABEN</text>
  <line x1="55" y1="170" x2="374" y2="170" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>

  <text x="55" y="190" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Kundenkontakt und Beziehungspflege</text>
  <text x="55" y="208" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Bedarfsanalyse und Produktangebot</text>
  <text x="55" y="226" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Kreditantrag aufnehmen und vollständig</text>
  <text x="55" y="242" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">  einreichen</text>
  <text x="55" y="260" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Erstvolum aus Marktperspektive</text>
  <text x="55" y="278" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Kundenkommunikation (Ergebnis,</text>
  <text x="55" y="294" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">  Konditionen, Rückfragen weiterleiten)</text>
  <text x="55" y="312" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Beauftragung Verbundpartner (Sicherheit)</text>
  <text x="55" y="330" class="mono" font-size="9" fill="rgba(248,248,250,0.90)" letter-spacing="0.5">· Pflege Kundenstammdaten</text>

  <!-- ══════════════════════════════════════════════
       TRENNLINIE MITTE  x=394–426
       ══════════════════════════════════════════════ -->

  <!-- Vertikale Trennlinie -->
  <line x1="430" y1="104" x2="430" y2="356" stroke="#C8CAD4" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Vier-Augen-Prinzip Label auf Trennlinie -->
  <rect x="396" y="198" width="68" height="60" fill="#F8F8FA" stroke="#E2E3E8" stroke-width="1"/>
  <text x="430" y="218" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">VIER-</text>
  <text x="430" y="230" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">AUGEN-</text>
  <text x="430" y="242" class="mono" font-size="7" fill="#7A8099" letter-spacing="0.5" text-anchor="middle">PRINZIP</text>

  <!-- Pfeile links + rechts -->
  <line x1="390" y1="228" x2="396" y2="228" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="390,228 396,224 396,232" fill="#C8CAD4"/>
  <line x1="464" y1="228" x2="470" y2="228" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="470,228 464,224 464,232" fill="#C8CAD4"/>

  <!-- ══════════════════════════════════════════════
       RECHTE SPALTE: MARKTFOLGE  x=470–820
       ══════════════════════════════════════════════ -->

  <!-- Marktfolge Header -->
  <rect x="470" y="104" width="350" height="32" fill="#1F2C56"/>
  <text x="485" y="125" class="mono" font-size="10" fill="#F8F8FA" letter-spacing="2">MARKTFOLGE · INNENDIENST / SBBG</text>

  <!-- Marktfolge Body -->
  <rect x="470" y="136" width="350" height="220" fill="#EDEDF3" stroke="#C8CAD4" stroke-width="1"/>

  <text x="485" y="164" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1">AUFGABEN</text>
  <line x1="485" y1="170" x2="804" y2="170" stroke="#1F2C56" stroke-width="0.5" opacity="0.25"/>

  <text x="485" y="190" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Unabhängiges Kreditvotum (Marktfolge)</text>
  <text x="485" y="208" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Anlage und Pflege der Kreditakte</text>
  <text x="485" y="226" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Offenlegung nach § 18 KWG steuern</text>
  <text x="485" y="244" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Nachforderung fehlender Unterlagen</text>
  <text x="485" y="262" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Engagementüberwachung / Wiedervorlage</text>
  <text x="485" y="280" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Auszahlungskontrolle (Vollständigkeit</text>
  <text x="485" y="296" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">  Sicherheiten, Vertragsunterzeichnung)</text>
  <text x="485" y="314" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Ratingsystem-Eingabe / Bonitätsprüfung</text>
  <text x="485" y="332" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">· Schnittstelle zu Revision und BaFin</text>

  <!-- ══════════════════════════════════════════════
       MERKKASTEN § 18 KWG  (y=370–440)
       ══════════════════════════════════════════════ -->
  <rect x="40" y="370" width="780" height="62" fill="#EAD9A8"/>
  <rect x="40" y="370" width="780" height="62" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="370" width="4"   height="62" fill="#D9C089"/>
  <text x="58" y="389" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">MERKKASTEN § 18 KWG — LAUFENDE OFFENLEGUNG</text>
  <text x="58" y="407" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Gesetzliche Pflicht: Jahresabschlüsse und Vermögensübersichten bei Kreditnehmern ab 750.000 EUR Gesamtverschuldung.</text>
  <text x="58" y="421" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Hausinterne Grenze: VR-Bank Musterregion eG oft bereits ab 50.000–100.000 EUR. Zuständig: Marktfolge — nicht Berater.</text>

  <!-- Baseline -->
  <line x1="40" y1="450" x2="820" y2="450" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="466" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">MaRisk BTO 1.2 · § 18 KWG · Modul VA01</text>
  <text x="820" y="466" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Bundesanstalt für Finanzdienstleistungsaufsicht (2017). MaRisk AT/BTO 1.2. BaFin.</text>
</svg>
