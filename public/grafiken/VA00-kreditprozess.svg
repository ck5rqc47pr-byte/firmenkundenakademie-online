<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="#F8F8FA"/>

  <!-- Eyebrow -->
  <text x="40" y="30" class="mono" font-size="10" fill="#7A8099" letter-spacing="2">KREDITPROZESS · MARISK BTO 1.2 · MODUL VA00 · DAS EIGENE HAUS KENNEN</text>
  <line x1="40" y1="40" x2="820" y2="40" stroke="#E2E3E8" stroke-width="1"/>

  <!-- Titel -->
  <text x="40" y="70" class="serif" font-size="17" fill="#1F2C56" font-weight="500">Der Kreditprozess end-to-end – wer macht was?</text>
  <text x="40" y="88" class="mono" font-size="9" fill="#7A8099" letter-spacing="0.5">Sieben Phasen · Akzent-Gold = Assistenz beteiligt</text>

  <!-- ══════════════════════════════════════════════
       LEGENDE (y=100)
       ══════════════════════════════════════════════ -->
  <rect x="560" y="96" width="12" height="12" fill="#1F2C56"/>
  <text x="578" y="107" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Markt / Marktfolge</text>
  <rect x="680" y="96" width="12" height="12" fill="#D9C089" stroke="#1F2C56" stroke-width="1"/>
  <text x="698" y="107" class="mono" font-size="8" fill="#3D4460" letter-spacing="0.5">Assistenz beteiligt</text>

  <!-- ══════════════════════════════════════════════
       PROZESSBOXEN ZEILE 1: Phase 1–4 (y=118–218)
       Breite pro Phase: 182px; Abstand: 12px
       x-Positionen: 40, 234, 428, 622  (letzte bis 820)
       ══════════════════════════════════════════════ -->

  <!-- PHASE 1: Anbahnung — Navy -->
  <rect x="40"  y="118" width="182" height="100" fill="#1F2C56"/>
  <rect x="40"  y="118" width="182" height="4"   fill="#3D5494"/>
  <text x="56"  y="140" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">01 · ANBAHNUNG</text>
  <line x1="56" y1="147" x2="206" y2="147" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="56"  y="163" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kundengespräch</text>
  <text x="56"  y="177" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Bedarfsklärung</text>
  <text x="56"  y="191" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Berater (Markt)</text>
  <text x="56"  y="208" class="mono" font-size="6.5" fill="#8898C4" letter-spacing="0.5">Erstkontakt, Analyse</text>

  <!-- Pfeil 1→2 -->
  <line x1="222" y1="168" x2="230" y2="168" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="230,163 242,168 230,173" fill="#C8CAD4"/>

  <!-- PHASE 2: Unterlagensammlung — Akzent-Gold (Assistenz) -->
  <rect x="244" y="118" width="182" height="100" fill="#D9C089"/>
  <rect x="244" y="118" width="182" height="100" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="244" y="118" width="182" height="4"   fill="#1F2C56"/>
  <text x="260" y="140" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">02 · UNTERLAGEN</text>
  <line x1="260" y1="147" x2="410" y2="147" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="260" y="163" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.5">· Jahresabschlüsse</text>
  <text x="260" y="177" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.5">· BWA, HR-Auszug</text>
  <text x="260" y="191" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">Assistenz + Berater</text>
  <text x="260" y="208" class="mono" font-size="6.5" fill="#3D5494" letter-spacing="0.5">Anfordern, prüfen</text>

  <!-- Pfeil 2→3 -->
  <line x1="426" y1="168" x2="434" y2="168" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="434,163 446,168 434,173" fill="#C8CAD4"/>

  <!-- PHASE 3: Antrag & Votum — Mid-Primary -->
  <rect x="448" y="118" width="182" height="100" fill="#3D5494"/>
  <rect x="448" y="118" width="182" height="4"   fill="#1F2C56"/>
  <text x="464" y="140" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">03 · ANTRAG &amp; VOTUM</text>
  <line x1="464" y1="147" x2="614" y2="147" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="464" y="163" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kreditantrag stellen</text>
  <text x="464" y="177" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Marktfolge-Votum</text>
  <text x="464" y="191" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Berater + Marktfolge</text>
  <text x="464" y="208" class="mono" font-size="6.5" fill="#8898C4" letter-spacing="0.5">Analyse, Rating</text>

  <!-- Pfeil 3→4 -->
  <line x1="630" y1="168" x2="638" y2="168" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="638,163 650,168 638,173" fill="#C8CAD4"/>

  <!-- PHASE 4: Beschluss — Navy -->
  <rect x="652" y="118" width="168" height="100" fill="#1F2C56"/>
  <rect x="652" y="118" width="168" height="4"   fill="#3D5494"/>
  <text x="668" y="140" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">04 · BESCHLUSS</text>
  <line x1="668" y1="147" x2="804" y2="147" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="668" y="163" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kreditentscheidung</text>
  <text x="668" y="177" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Kompetenzgrenzen</text>
  <text x="668" y="191" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Marktfolge / GL</text>
  <text x="668" y="208" class="mono" font-size="6.5" fill="#8898C4" letter-spacing="0.5">Beschlussprotokoll</text>

  <!-- ══════════════════════════════════════════════
       PROZESSBOXEN ZEILE 2: Phase 5–7 (y=244–344)
       Drei Phasen, zentriert: x=40, 299, 558 (letzte bis 820)
       ══════════════════════════════════════════════ -->

  <!-- Verbindungspfeil Zeile 1 zu Zeile 2 (Phase 4 unten zu Phase 5 links) -->
  <!-- Senkrechter Knick: von Phase-4-Mitte runter, dann nach links zu Phase 5 -->
  <line x1="736" y1="218" x2="736" y2="234" stroke="#C8CAD4" stroke-width="1.5"/>
  <line x1="736" y1="234" x2="130" y2="234" stroke="#C8CAD4" stroke-width="1.5"/>
  <line x1="130" y1="234" x2="130" y2="242" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="125,242 130,254 135,242" fill="#C8CAD4"/>

  <!-- PHASE 5: Vertrag & Sicherheiten — Akzent-Gold (Assistenz) -->
  <rect x="40"  y="256" width="246" height="100" fill="#D9C089"/>
  <rect x="40"  y="256" width="246" height="100" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="40"  y="256" width="246" height="4"   fill="#1F2C56"/>
  <text x="56"  y="278" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">05 · VERTRAG &amp; SICHERHEITEN</text>
  <line x1="56" y1="285" x2="270" y2="285" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="56"  y="301" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.5">· Vertragsunterlagen erstellen</text>
  <text x="56"  y="315" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.5">· Sicherheitenbestellung</text>
  <text x="56"  y="329" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">Assistenz + Marktfolge</text>
  <text x="56"  y="346" class="mono" font-size="6.5" fill="#3D5494" letter-spacing="0.5">Unterschriften, Grundbuch</text>

  <!-- Pfeil 5→6 -->
  <line x1="286" y1="306" x2="298" y2="306" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="298,301 310,306 298,311" fill="#C8CAD4"/>

  <!-- PHASE 6: Auszahlung — Navy -->
  <rect x="310" y="256" width="240" height="100" fill="#1F2C56"/>
  <rect x="310" y="256" width="240" height="4"   fill="#3D5494"/>
  <text x="326" y="278" class="mono" font-size="8" fill="#D9C089" letter-spacing="2">06 · AUSZAHLUNG</text>
  <line x1="326" y1="285" x2="534" y2="285" stroke="#D9C089" stroke-width="0.5" opacity="0.4"/>
  <text x="326" y="301" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Voraussetzungen prüfen</text>
  <text x="326" y="315" class="mono" font-size="7.5" fill="rgba(248,248,250,0.85)" letter-spacing="0.5">· Freigabe erteilen</text>
  <text x="326" y="329" class="mono" font-size="7" fill="#8898C4" letter-spacing="0.5">Marktfolge</text>
  <text x="326" y="346" class="mono" font-size="6.5" fill="#8898C4" letter-spacing="0.5">Auszahlungsprotokoll</text>

  <!-- Pfeil 6→7 -->
  <line x1="550" y1="306" x2="562" y2="306" stroke="#C8CAD4" stroke-width="1.5"/>
  <polygon points="562,301 574,306 562,311" fill="#C8CAD4"/>

  <!-- PHASE 7: Bestandsbearbeitung — Akzent-Gold (Assistenz) -->
  <rect x="574" y="256" width="246" height="100" fill="#D9C089"/>
  <rect x="574" y="256" width="246" height="100" fill="none" stroke="#1F2C56" stroke-width="1.5"/>
  <rect x="574" y="256" width="246" height="4"   fill="#1F2C56"/>
  <text x="590" y="278" class="mono" font-size="8" fill="#1F2C56" letter-spacing="2">07 · BESTANDSBEARBEITUNG</text>
  <line x1="590" y1="285" x2="804" y2="285" stroke="#1F2C56" stroke-width="0.5" opacity="0.35"/>
  <text x="590" y="301" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.5">· Wiedervorlagen, Offenlegung</text>
  <text x="590" y="315" class="mono" font-size="7.5" fill="#15192B" letter-spacing="0.5">· Aktenführung, Fristen</text>
  <text x="590" y="329" class="mono" font-size="7" fill="#3D5494" letter-spacing="0.5">Assistenz (Kernrolle)</text>
  <text x="590" y="346" class="mono" font-size="6.5" fill="#3D5494" letter-spacing="0.5">Laufende Engagementpflege</text>

  <!-- ══════════════════════════════════════════════
       MERKZEILE: Funktionstrennung (y=374–440)
       ══════════════════════════════════════════════ -->
  <text x="40" y="372" class="mono" font-size="9" fill="#7A8099" letter-spacing="2">FUNKTIONSTRENNUNG (MARISK BTO 1.2)</text>
  <line x1="40" y1="378" x2="820" y2="378" stroke="#E2E3E8" stroke-width="1"/>

  <rect x="40" y="386" width="780" height="72" fill="#EAD9A8"/>
  <rect x="40" y="386" width="780" height="72" fill="none" stroke="#D9C089" stroke-width="1"/>
  <rect x="40" y="386" width="4"   height="72" fill="#D9C089"/>
  <text x="58" y="405" class="mono" font-size="9" fill="#1F2C56" letter-spacing="1" font-weight="500">Markt (Beratung/Vertrieb) und Marktfolge (Analyse, Votum, Bestandsbearbeitung) sind aufsichtsrechtlich getrennt.</text>
  <text x="58" y="421" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">Das Votum liegt IMMER bei der Marktfolge – nie beim Markt oder der Assistenz. Kein Mitarbeiter des Marktes darf</text>
  <text x="58" y="437" class="mono" font-size="9" fill="#3D4460" letter-spacing="0.5">gleichzeitig an der Kreditentscheidung und an der Bonitätsbeurteilung beteiligt sein (MaRisk BTO 1.2).</text>
  <text x="58" y="450" class="mono" font-size="8" fill="#7A8099" letter-spacing="0.5">Die Assistenz unterstützt Markt (Phasen 2, 5) und Marktfolge (Phase 7) – sie entscheidet nie eigenständig.</text>

  <!-- Baseline -->
  <line x1="40" y1="476" x2="820" y2="476" stroke="#15192B" stroke-width="1"/>

  <!-- Source -->
  <text x="40" y="492" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5">Kreditprozess · MaRisk BTO 1.2 · Modul VA00</text>
  <text x="820" y="492" class="mono" font-size="9" fill="#B0B3C0" letter-spacing="0.5" text-anchor="end">Becker, J. &amp; Peppmeier, A. (2018). Bankbetriebslehre (11. Aufl.). NWB.</text>
</svg>
